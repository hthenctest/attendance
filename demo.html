/* Layout: thumb-first single column on phones, two panes split at the fold on foldables and tablets,

* { box-sizing: border-box; }

/* Page frame */
.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Two panes on foldables and tablets: the gap sits on the fold */
@media (min-width: 760px) {
  .wrap.wide { max-width: 1120px; }
  .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "a act" "b act"; grid-template-rows: auto 1fr; column-gap: 64px; align-items: start; }

  .pane-a { grid-area: a; } .pane-b { grid-area: b; }

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 20px; border-radius: 14px; border: 1px solid transparent; font-weight: 650; font-size: 17px; background: var(--accent); color: var(--accent-ink); text-decoration: none; transition: transform .1s ease, filter .15s ease; }
.btn:active { transform: scale(.98); }

.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.quiet { background: transparent; color: var(--ink-2); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.ok { background: var(--ok); color: var(--surface); }

.field > label, .label { font-size: 14px; font-weight: 650; color: var(--ink-2); }
.input { width: 100%; min-height: var(--tap); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.input.pin { font-family: var(--font-mono); font-size: 24px; letter-spacing: .45em; text-align: center; padding-inline: 8px; }
textarea.input { min-height: 88px; resize: vertical; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); gap: 2px; }
.seg button { padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.check { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.error { color: var(--danger); font-size: 15px; font-weight: 550; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.accent { background: var(--accent-soft); color: var(--accent-strong); }
.note.ok-note { background: var(--ok-soft); color: var(--ok); }
.note.danger-note { background: var(--danger-soft); color: var(--danger); }
.k-idle { margin: 10px auto; max-width: 720px; align-items: center; }
.k-idle .btn { margin-left: auto; flex: none; }
fieldset.group { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset.group > legend { padding: 0; margin-bottom: 6px; }
.cal-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 10px; align-items: end; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.cal-row .field { gap: 4px; min-width: 0; }
.cal-end { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.plain-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.review-item { padding: 8px 10px; border-radius: 12px; background: var(--surface-2); grid-template-columns: minmax(0, 1fr) auto auto; }
button.pill { border: 0; cursor: pointer; font: inherit; }
/* Location check at the top of the tardy and early release sheets */
.geo { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); font-size: 15px; line-height: 1.4; }
.geo > .i { margin-top: 1px; }
.geo .spin { width: 18px; height: 18px; border-width: 2px; flex: none; margin-top: 1px; }
.geo.ok { background: var(--ok-soft); color: var(--ok); align-items: center; }
.geo.bad { background: var(--danger-soft); color: var(--danger); }
.geo.bad b { color: inherit; }
.geo.bad .tiny { color: var(--ink-2); display: block; margin-top: 6px; }
.geo.bad .btn.soft { background: var(--surface); color: var(--ink); }
.geo.demo { background: var(--accent-soft); color: var(--accent-strong); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.btn .spin { width: 18px; height: 18px; border-width: 2px; border-color: color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; }
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; text-align: left; transition: background .12s, border-color .12s, transform .1s; }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.recent { border-style: dashed; }
.chip.grade { min-width: 52px; justify-content: center; font-variant-numeric: tabular-nums; }
.chip .sub { font-weight: 500; opacity: .75; font-size: 14px; }
.kid { display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); min-height: 54px; font-weight: 600; transition: border-color .12s, background .12s; }
.kid[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.kid .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.kid[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.av { --av: 40px; width: var(--av); height: var(--av); border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: calc(var(--av) * .38); background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) var(--av-fs) var(--av-fl)); letter-spacing: .02em; }
.shake { animation: shake .35s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.pill.TARDY { background: var(--tardy-soft); color: var(--tardy); }
.pill.EARLY { background: var(--early-soft); color: var(--early); }
.pill.ABSENT { background: var(--absent-soft); color: var(--absent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.pill.void { background: var(--surface-2); color: var(--ink-3); text-decoration: line-through; }
.c-flags .pill, .l3 .pill { white-space: normal; text-align: left; max-width: 100%; }

/* Action tiles */
.tiles { display: grid; gap: 12px; }
.tile { display: grid; grid-template-columns: 56px 1fr 22px; align-items: center; gap: 14px; width: 100%; min-height: 86px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-1); text-align: left; transition: transform .12s ease, box-shadow .2s ease; }
.tile:active { transform: scale(.985); }
.tile:hover { box-shadow: var(--shadow-2); }
.tile .ic { width: 56px; height: 56px; border-radius: 17px; display: grid; place-items: center; }
.tile.TARDY .ic { background: var(--tardy-soft); color: var(--tardy); }
.tile.EARLY .ic { background: var(--early-soft); color: var(--early); }
.tile.ABSENT .ic { background: var(--absent-soft); color: var(--absent); }
.tile .t1 { display: block; font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.tile .t2 { display: block; color: var(--ink-3); font-size: 15px; }
.tile .go { color: var(--ink-3); }

/* Entry rows */
.list { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.entry { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 14px 14px; background: var(--surface); }
.entry + .entry { border-top: 1px solid var(--line); }
.entry .l1 { font-weight: 650; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.entry .l2 { color: var(--ink-2); font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; }
.entry .l3 { color: var(--ink-3); font-size: 14px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.day-head { padding: 18px 4px 8px; }
.empty { padding: 22px 16px; text-align: center; color: var(--ink-3); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-lg); font-size: 15px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 2px 10px; }

/* Bottom sheet, a dialog on wide screens, a side panel on phones held sideways */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }

.sheet-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px)); position: relative; }
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--surface-3); }
.sheet-head h2 { flex: 1; padding-top: 14px; }

}

/* The confirmation slip, modeled on the front desk's paper slip */

/* Welcome and sign-in */

/* Keypad (school iPad and staff sign-in) */

/* Front office */
.office { min-height: 100%; }
.office .wrap { max-width: 1480px; }
.o-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }

.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--danger); color: var(--surface); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2.4s infinite; }
.live.off i { background: var(--warn); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.o-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 14px; }

.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-block: 4px 14px; }
.summary.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sum { border-radius: 16px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; text-align: left; }
.sum b { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sum span { font-size: 14px; color: var(--ink-3); }
.sum.TARDY b { color: var(--tardy); } .sum.EARLY b { color: var(--early); } .sum.ABSENT b { color: var(--absent); }
.lanes { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.lane { background: var(--surface-2); border-radius: 18px; padding: 10px; display: grid; gap: 8px; min-width: 0; }

.card.closed { opacity: .66; }

@keyframes fresh { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow-1); } }
.c-top { display: flex; gap: 10px; align-items: center; min-width: 0; }

@media (max-width: 819px) {

.split { display: grid; gap: 16px; }

.fam { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; width: 100%; }

.people { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }

th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }

tr:last-child td { border-bottom: 0; }

.admin-grid { display: grid; gap: 16px; }
@media (min-width: 1000px) { .admin-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; min-width: 0; }

.logo-preview { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

.swatch { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); }
.qr-sheet { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.qr-card { border: 2px solid var(--line); border-radius: 20px; padding: 20px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--surface); }
.qr-card svg { width: 100%; max-width: 220px; height: auto; background: #FFFFFF; border-radius: 10px; }
.qr-card .big { font-size: 24px; font-weight: 800; }
.temp-pin { font-family: var(--font-mono); font-size: 40px; font-weight: 700; letter-spacing: .2em; text-align: center; padding: 12px; border-radius: 16px; background: var(--surface-2); }

/* Patterns: the school year at a glance. Chart marks use the --viz-* colors (checked for color-blind separation in both themes). */
.pat { display: grid; gap: 16px; padding-top: 4px; transition: opacity .2s; }
.pat.loading { opacity: .55; }
.pat-bar select.input { width: auto; flex: 0 0 auto; min-height: 44px; max-width: 200px; }

.spread.flexwrap { flex-wrap: wrap; }

@media (max-width: 599px) {

.pat-two { display: grid; gap: 16px; }
@media (min-width: 900px) { .pat-two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.r-group { display: grid; gap: 8px; }

.r-row .n { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.r-row .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); }
.r-row .bar i { display: block; height: 100%; border-radius: 3px; min-width: 4px; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
th .sort { font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; align-items: center; gap: 4px; }
th[aria-sort] .sort { color: var(--ink); }
td .who { font-weight: 600; text-align: left; color: var(--ink); }
td .who:hover { color: var(--accent); }
.wd td.top { font-weight: 700; color: var(--ink); }

/* Roster check */
.sheet.wide { max-width: 880px; }

.rc-fam input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); }

.pat-tip .t-row i.TARDY, .r-row .bar i.TARDY { background: var(--viz-tardy); }

.pat-tip .t-row i.ABSENT, .r-row .bar i.ABSENT { background: var(--viz-absent); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Toasts */
body.lock #toasts { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

.toast { pointer-events: auto; max-width: 520px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow-2); font-size: 15px; font-weight: 550; display: flex; gap: 10px; align-items: center; animation: rise .2s ease; }
.toast.error { background: var(--danger); color: var(--surface); }
.splash { min-height: 70vh; display: grid; place-items: center; color: var(--ink-3); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Small cover screens (Galaxy Z Flip, Motorola Razr) and narrow split views: tighter, still thumb-sized */
@media (max-height: 480px) and (max-width: 600px), (max-width: 340px) {
  .topbar .wrap { min-height: 50px; gap: 8px; }
  .brand-name { font-size: 16px; }
  .nav-tab { padding: 6px 11px; font-size: 14px; }
  .main { padding-block: 4px 28px; }

/* Laptop and tabletop postures (a Fold half-open on its side, a Flip in Flex mode): read on the top half, tap on the bottom half */
@media (vertical-viewport-segments: 2) {

    --seg-t: env(viewport-segment-height 0 0, 50vh); --seg-b: env(viewport-segment-height 0 1, 50vh);

  .kiosk-signin .k-bottom { align-self: center; padding-block: 8px; }

@media print {
  body * { visibility: hidden; }
  .print-area, .print-area * { visibility: visible; }

}

}

  if (who.session.scope === 'recovery' && !route.recovery) {
    throw appError_('MUST_CHANGE_PIN', 'Please choose a new PIN first.');
  }
  if (route.role && (!ctx.staff || (STAFF_RANK[ctx.staff.Role] || 0) < STAFF_RANK[route.role])) {
    throw appError_('FORBIDDEN', route.role === 'Admin' ? 'Only admins can do this.' : 'This is for the Site Manager and admins.');

/**
 * Load shedding, not a lock-out: public sign-in style requests beyond a per-minute ceiling get BUSY.
 * The ceiling is far above a school's normal traffic; it protects the owner's Apps Script quota during a flood.
 * It counts every request, right or wrong, so it can never be used to switch off valid PINs on purpose.

  if (type === 'date') return !v || isDate_(v) ? { ok: true, value: v } : bad(spec[0] + ' must be a real date like 2027-08-16.');
  if (type === 'yesno') return v === 'Yes' || v === 'No' ? { ok: true, value: v } : bad(spec[0] + ' must be Yes or No.');

  if ((b.dc && b.dc !== dc) || (b.pc && b.pc !== pc)) throw appError_('BAD_INPUT', 'That recovery key is damaged.');
  var haveDc = setting_('DataKeyCheck'), havePc = setting_('PepperCheck'), uid = setting_('SystemUid');
  if (haveDc && haveDc !== dc) throw appError_('KEY_MISMATCH', 'That recovery key belongs to a different system.');
  if (havePc && havePc !== pc) throw appError_('KEY_MISMATCH', 'That recovery key belongs to a different system.');
  if (b.uid && uid && b.uid !== uid) throw appError_('KEY_MISMATCH', 'That recovery key belongs to a different system.');
  if (!haveDc && !havePc && !systemEmptyForKeys_() && !b.dc) {
    // A version 1 key for a sheet whose checks were lost: accept only if it opens this sheet's contact data.
    if (!keyOpensExistingData_(b.d)) throw appError_('KEY_MISMATCH', 'That recovery key does not open this sheet\'s protected data.');
  }
  var p = props_();
  p.setProperty('DATA_KEY', b.d);
  p.setProperty('PEPPER', b.p);
  if (!haveDc) setSetting_('DataKeyCheck', dc);
  if (!havePc) setSetting_('PepperCheck', pc);
  if (b.uid && !uid) setSetting_('SystemUid', b.uid);
  setSetting_('SessionEpoch', String((Number(setting_('SessionEpoch')) || 1) + 1));
  _keys = null;
  cacheRemove_('schema:' + systemId_());
  return true;
}

/** For a version 1 recovery key without check values: does it open at least one stored contact value? */
function keyOpensExistingData_(dataKey) {
  var k = deriveKeys_(dataKey), found = false, ok = false;
  db_().table('Adults').rows.forEach(function (a) {
    ['Phone', 'Email'].forEach(function (f) {
      var raw = a['_seal_' + f] && a['_seal_' + f].raw;
      if (!raw || found || raw.indexOf('enc1:') !== 0) return;
      found = true;
      var p = raw.slice(5).split('.');
      var tag = b64u_(Utilities.computeHmacSha256Signature('enc1|' + p[0] + '.' + p[1], k.mac)).slice(0, 22);
      ok = safeEqual_(tag, p[2]);
    });
  });
  return found && ok;
}

/* ============================================================================
 * Tabs, protection and the upgrade from version 1
 * ========================================================================== */

/** Adds missing tabs and missing columns (always at the end of a tab). Never moves or removes a column. */
function ensureTabs_(ss) {
  resumeSwaps_(ss);
  Object.keys(TABS).forEach(function (name) {
    var headers = TABS[name], sh = ss.getSheetByName(name), fresh = false;
    if (!sh) { sh = ss.insertSheet(name); fresh = true; }
    var lastCol = Math.max(1, sh.getLastColumn());
    var have = fresh ? [] : sh.getRange(1, 1, 1, lastCol).getValues()[0].map(function (h) { return String(h == null ? '' : h).trim(); });
    while (have.length && !have[have.length - 1]) have.pop();
    var missing = headers.filter(function (h) { return have.indexOf(h) < 0; });
    if (!missing.length && !fresh) return;
    var all = have.concat(missing);
    if (sh.getMaxColumns() < all.length) sh.insertColumnsAfter(sh.getMaxColumns(), all.length - sh.getMaxColumns());
    sh.getRange(1, have.length + 1, Math.max(1, sh.getMaxRows()), missing.length).setNumberFormat('@');
    sh.getRange(1, 1, 1, all.length).setValues([all]).setFontWeight('bold').setBackground('#eef1f6');
    sh.setFrozenRows(1);
    if (fresh) formatTab_(sh, all.length);
  });
}

function formatTab_(sh, cols) {
  sh.getRange(1, 1, Math.max(1, sh.getMaxRows()), Math.max(1, cols)).setNumberFormat('@');
  sh.getRange(1, 1, 1, cols).setFontWeight('bold').setBackground('#eef1f6');
  sh.setFrozenRows(1);
}

/** Tabs people may correct by hand in an emergency; every other tab can be edited only by the script's owner. */
var HAND_EDITABLE = { Settings: true, Teachers: true, Reasons: true, Calendar: true };

function protectTab_(sh) {
  try {
    var existing = sh.getProtections(SpreadsheetApp.ProtectionType.SHEET);
    var p = existing && existing.length ? existing[0] : sh.protect();
    p.setDescription('Change records through the School Check-In app or menu. Direct edits are refused (or warned) to keep records consistent.');
    if (HAND_EDITABLE[sh.getName()]) { p.setWarningOnly(true); return; }
    p.setWarningOnly(false);
    try { var eds = p.getEditors(); if (eds && eds.length) p.removeEditors(eds); } catch (e) { /* the owner always keeps access */ }
    try { if (p.canDomainEdit && p.canDomainEdit()) p.setDomainEdit(false); } catch (e) { /* consumer accounts */ }
  } catch (e) { console.error('Could not protect ' + sh.getName() + ': ' + e); }
}

function protectTabs_() {
  var ss = systemSs_();
  Object.keys(TABS).forEach(function (name) { var sh = ss.getSheetByName(name); if (sh) protectTab_(sh); });
}

function ensureSettingsRows_() {
  var have = {};
  db_().table('Settings').rows.forEach(function (r) { have[r.Key] = true; });
  var add = SETTINGS_SPEC.filter(function (s) { return !have[s[0]]; }).map(function (s) { return { Key: s[0], Value: s[1], About: s[2] }; });
  // A school upgrading from a version where absences were always on keeps them on if it has used them.
  add.forEach(function (r) {
    if (r.Key === 'AbsenceReports' && db_().table('Entries').rows.some(function (e) { return e.Type === 'ABSENT'; })) r.Value = 'Yes';
  });
  if (add.length) { db_().append('Settings', add); clearConfigCache_(); }
}

function schemaReady_() {
  var id = systemId_();
  if (!id) return false;
  if (cacheGet_('schema:' + id) === String(SCHEMA_VERSION)) return true;
  var ready = Number(props_().getProperty('SCHEMA') || 0) >= SCHEMA_VERSION;
  if (ready) cachePut_('schema:' + id, String(SCHEMA_VERSION), CACHE_MAX_TTL);
  return ready;
}

/** Inside the lock: make sure the system is set up, upgraded and its keys belong to it. */
function ensureReady_() {
  requireLock_();
  systemSs_();
  if (!schemaReady_()) upgrade_();
  checkKeys_();
}

/**
 * Brings a version 1 sheet up to this version, once. Every step can safely run again, so an interrupted
 * upgrade simply continues the next time anything runs.
 */
function upgrade_() {
  requireLock_();
  var ss = systemSs_();
  if (!ss.getSheetByName('Settings') || !ss.getSheetByName('Adults')) {
    throw appError_('NOT_SET_UP', 'This system is not set up yet. In the System sheet choose School Check-In > First-time setup.');
  }
  var job = jobStart_('upgrade', '');
  ensureTabs_(ss);
  resetRequestState_();
  ensureSettingsRows_();
  if (!setting_('SystemId')) setSetting_('SystemId', systemId_());
  checkSystemIdentity_();
  var counts = upgradeKeys_();
  resetRequestState_();
  counts.contacts = upgradeContacts_();
  counts.links = upgradeColumn_('Links', function (l) { var c = false; if (!l.Approval) { l.Approval = 'PENDING'; c = true; } if (!l.Version) { l.Version = '1'; c = true; } return c; });
  counts.invites = upgradeInvites_();
  counts.sessions = upgradeColumn_('Sessions', function (s) { if (s.AuthVersion) return false; s.Revoked = 'Y'; return true; });
  counts.adults = upgradeColumn_('Adults', function (a) {
    var c = false;
    if (!a.AuthVersion) { a.AuthVersion = '1'; c = true; }
    if (!a.Version) { a.Version = '1'; c = true; }
    if (!a.PinDigits) { a.PinDigits = '6'; c = true; }
    if (a.LockCount === '') { a.LockCount = '0'; c = true; }
    if (a.MustChangePin === 'Y' && !a.TempPinExpires) { a.TempPinExpires = String(Date.now() + 24 * 3600000); c = true; }
    return c;
  });
  counts.staff = upgradeStaff_();
  counts.students = upgradeColumn_('Students', function (k) { if (k.Version) return false; k.Version = '1'; return true; });
  counts.entries = upgradeEntries_();
  props_().setProperty('SCHEMA', String(SCHEMA_VERSION));
  setSetting_('SchemaVersion', String(SCHEMA_VERSION));
  cachePut_('schema:' + systemId_(), String(SCHEMA_VERSION), CACHE_MAX_TTL);
  startLogChain_();
  log_({ name: 'System', type: 'System', id: 'SYSTEM' }, 'Upgraded to version ' + VERSION, 'System', '', '', JSON.stringify(counts), 'Pickup permissions and older invites need school review after this upgrade');
  jobFinish_(job, 'OK', JSON.stringify(counts));
  return counts;
}

/** Keys for an upgraded sheet: never regenerated over existing data; PepperCheck is recorded for the PEPPER in use. */
function upgradeKeys_() {
  var p = props_(), out = { pepperCheck: false, dataKey: false };
  if (!setting_('SystemUid')) setSetting_('SystemUid', 'SYS-' + randomCode_(16));
  var hasData = !systemEmptyForKeys_();
  if (!p.getProperty('PEPPER')) {
    if (hasData) throw appError_('KEY_MISSING', 'The key that protects PINs and sign-ins is missing from this copy of the script. ' + KEY_HELP);
    createKeysIfEmpty_();
    return { created: true };
  }
  if (!setting_('PepperCheck')) { setSetting_('PepperCheck', pepperCheckOf_(p.getProperty('PEPPER'))); out.pepperCheck = true; }
  if (!p.getProperty('DATA_KEY')) {
    var anyEnc = db_().table('Adults').rows.some(function (a) { return ['Phone', 'Email'].some(function (f) { var st = a['_seal_' + f]; return st && /^enc/.test(st.raw); }); });
    if (setting_('DataKeyCheck') || anyEnc) throw appError_('KEY_MISSING', 'The key that protects parent contact details is missing from this copy of the script. ' + KEY_HELP);
    p.setProperty('DATA_KEY', b64u_(randomBytes_(32)));
    out.dataKey = true;
  }
  if (!setting_('DataKeyCheck')) setSetting_('DataKeyCheck', deriveKeys_(p.getProperty('DATA_KEY')).check);
  _keys = null;
  keys_();
  return out;
}

/** Version 1 contact values (enc1 or plain text) become enc2 bound to their row and field. Damaged ones are left as they are and counted. */
function upgradeContacts_() {
  _legacyOpen = true;
  var changed = [], damaged = 0;
  try {
    db_().table('Adults').rows.forEach(function (a) {
      var touch = false;
      ['Phone', 'Email'].forEach(function (f) {
        var st = a['_seal_' + f];
        if (!st || !st.raw || /^enc2:/.test(st.raw)) return;
        var v = a[f];
        if (st.bad) { damaged++; return; }
        a[f] = f === 'Phone' ? (normPhone_(v) || v) : (normEmail_(v) || v);
        touch = true;
      });
      if (touch) changed.push(a);
    });
    if (changed.length) db_().saveRows('Adults', changed);
  } finally { _legacyOpen = false; }
  return { converted: changed.length, damaged: damaged };
}

function upgradeColumn_(name, fn) {
  var changed = db_().table(name).rows.filter(fn);
  if (changed.length) db_().saveRows(name, changed);
  return changed.length;
}

/** Version 1 stored invite codes readable in the sheet. They are revoked and the codes blanked; families make new ones. */
function upgradeInvites_() {
  var t = db_().table('Invites'), n = 0;
  var reserved = {};
  var changed = t.rows.filter(function (r) { return !r.InviteID; });
  changed.forEach(function (r) {
    r.InviteID = newId_('Invites', 'I', reserved);
    r.Status = r.UsedBy ? 'USED' : 'REVOKED';
    r.RevokedReason = r.UsedBy ? '' : 'Upgrade: older invite codes were stored readable';
    r.CodeHash = '';
    n++;
  });
  if (changed.length) db_().saveRows('Invites', changed);
  clearLegacyColumn_('Invites', 'Code');
  return n;
}

function clearLegacyColumn_(name, header) {
  var t = db_().table(name), col = t.index[header];
  if (col === undefined) return;
  var last = t.sh.getLastRow();
  if (last > 1) t.sh.getRange(2, col + 1, last - 1, 1).clearContent();
  db_().tables[name] = null;
}

function upgradeStaff_() {
  var rows = db_().table('Staff').rows, used = {}, n = 0;
  rows.forEach(function (s) { if (s.Login) used[s.Login] = true; });
  var changed = rows.filter(function (s) {
    var c = false;
    if (!s.Login) { s.Login = uniqueLogin_(s.Name || s.Role || 'staff', used); used[s.Login] = true; c = true; }
    if (!s.AuthVersion) { s.AuthVersion = '1'; c = true; }
    if (!s.Version) { s.Version = '1'; c = true; }
    if (s.LockCount === '') { s.LockCount = '0'; c = true; }
    if (c) n++;
    return c;
  });
  if (changed.length) db_().saveRows('Staff', changed);
  return n;
}

function uniqueLogin_(name, used) {
  var base = normName_(name).replace(/\s+/g, '.').replace(/[^a-z0-9.]/g, '').slice(0, 30) || 'staff';
  var login = base, i = 2;
  while (used[login]) login = base + (i++);
  return login;
}

/**
 * Entries from version 1: Version, ReceivedAt and ReporterKind filled in; any EntryID used by more than one row gets
 * a new unique ID on EVERY row of that group (none is picked as "the" owner), recorded in Flags and the change log.
 */
function upgradeEntries_() {
  var rows = db_().table('Entries').rows, groups = {}, changed = [], reassigned = 0, reserved = {};
  rows.forEach(function (e) { (groups[e.EntryID] = groups[e.EntryID] || []).push(e); });
  rows.forEach(function (e) {
    var c = false;
    if (!e.Version) { e.Version = '1'; c = true; }
    if (!e.ReceivedAt) { e.ReceivedAt = e.CreatedAt; c = true; }
    if (!e.ReporterKind) { e.ReporterKind = e.Source === 'Office' ? 'Other' : 'Adult'; c = true; }
    if (c) changed.push(e);
  });
  Object.keys(groups).forEach(function (id) {
    if (groups[id].length < 2 && id) return;
    groups[id].forEach(function (e) {
      var nid = newEntryId_(e.Date || '2000-01-01', reserved);
      e.Flags = clean_((e.Flags ? e.Flags + '; ' : '') + 'ID reassigned from ' + (id || '(blank)') + ' (duplicate)', 200);
      log_({ name: 'System', type: 'System', id: 'SYSTEM' }, 'Reassigned a duplicated entry number', 'Entry', nid, id, nid, e.Student + ' ' + e.Date);
      e.EntryID = nid;
      if (changed.indexOf(e) < 0) changed.push(e);
      reassigned++;
    });
  });
  if (changed.length) db_().saveRows('Entries', changed);
  return { updated: changed.length, reassigned: reassigned };
}

/* ============================================================================
 * Change log: every change with who, what, before and after, in a hash chain
 *
 * Each row carries a sequence number and a SHA-256 digest of its own content plus the previous row's digest,
 * so an edited, deleted or reordered row is detected by verifyLogChain_. The owner of the script could rebuild
 * the whole chain, so the nightly checkpoint can be sent to a separately controlled mailbox (AuditAnchorEmail):
 * only a checkpoint held somewhere else makes tampering by the owner evident.
 * ========================================================================== */

var SECRET_FIELDS = { PinHash: 1, PinSalt: 1, TokenHash: 1, KeyHash: 1, PhoneIdx: 1, EmailIdx: 1, CodeHash: 1, Payload: 1, RecipientIdx: 1 };

/** A record for the change log: never secrets, and contact details masked. */
function strip_(o) {
  if (!o) return '';
  var c = {};
  Object.keys(o).forEach(function (k) {
    if (SECRET_FIELDS[k]) return;
    c[k] = k === 'Phone' || k === 'Email' ? mask_(k, o[k]) : o[k];
  });
  return JSON.stringify(c);
}

function actorOf_(ctx) {
  if (ctx && ctx.staff) return { name: ctx.staff.Name, type: ctx.staff.Role, id: ctx.staff.StaffID };
  if (ctx && ctx.adult) return { name: fullName_(ctx.adult), type: 'Parent/caregiver', id: ctx.adult.AdultID };
  if (ctx && ctx.actor) return ctx.actor;
  return { name: 'System', type: 'System', id: 'SYSTEM' };
}

function logDigest_(r) {
  return sha256Hex_(JSON.stringify([r.Seq, r.When, r.ActorID, r.Actor, r.ActorType, r.Action, r.Entity, r.EntityID, r.Before, r.After, r.Note, r.OpID, r.PrevDigest]));
}

/** The last chained row's sequence and digest, read from the last row only. Older unchained rows are folded into one digest. */
function logHead_() {
  var d = db_(), L = d.layout('ChangeLog'), last = L.sh.getLastRow();
  if (last < 2) return { seq: 0, digest: 'GENESIS' };
  var row = L.sh.getRange(last, 1, 1, L.headers.length).getValues()[0];
  var seq = String(row[L.index.Seq] || ''), dig = String(row[L.index.Digest] || '');
  if (seq && dig) return { seq: Number(seq), digest: dig };
  return { seq: 0, digest: legacyLogDigest_() };
}

function legacyLogDigest_() {
  var rows = db_().table('ChangeLog').rows.filter(function (r) { return !r.Seq; });
  if (!rows.length) return 'GENESIS';
  return 'LEGACY:' + sha256Hex_(JSON.stringify(rows.map(function (r) { return [r.When, r.Actor, r.ActorType, r.Action, r.Entity, r.EntityID, r.Before, r.After, r.Note]; })));
}

function log_(actor, action, entity, id, before, after, note, opId) {
  logMany_([{ actor: actor, action: action, entity: entity, id: id, before: before, after: after, note: note, opId: opId }]);
}

function logMany_(items) {
  if (!items || !items.length) return;
  requireLock_();
  var head = logHead_(), seq = head.seq, prev = head.digest, stamp = now_().stamp;
  var rows = items.map(function (it) {
    var a = it.actor || { name: 'System', type: 'System', id: 'SYSTEM' };
    var r = {
      Seq: String(++seq), When: stamp, ActorID: a.id || '', Actor: a.name || '', ActorType: a.type || '', Action: it.action || '',
      Entity: it.entity || '', EntityID: it.id || '',
      Before: typeof it.before === 'string' ? it.before : strip_(it.before), After: typeof it.after === 'string' ? it.after : strip_(it.after),
      Note: String(it.note || ''), OpID: it.opId || '', PrevDigest: prev
    };
    r.Before = String(r.Before).slice(0, 45000); r.After = String(r.After).slice(0, 45000);
    r.Digest = logDigest_(r);
    prev = r.Digest;
    return r;
  });
  db_().append('ChangeLog', rows);
}

function startLogChain_() { /* the chain starts with the first row written by this version (see logHead_) */ }

/** Re-computes the chain. Returns where it first breaks, if anywhere. */
function verifyLogChain_() {
  var rows = db_().table('ChangeLog').rows, legacy = [], i = 0;
  while (i < rows.length && !rows[i].Seq) { legacy.push(rows[i]); i++; }
  var prev = legacy.length ? 'LEGACY:' + sha256Hex_(JSON.stringify(legacy.map(function (r) { return [r.When, r.Actor, r.ActorType, r.Action, r.Entity, r.EntityID, r.Before, r.After, r.Note]; }))) : 'GENESIS';
  var expectSeq = 1, chained = 0;
  for (; i < rows.length; i++) {
    var r = rows[i];
    if (String(r.Seq) !== String(expectSeq) || r.PrevDigest !== prev || logDigest_(r) !== r.Digest) {
      return { ok: false, legacy: legacy.length, chained: chained, breakAt: Number(r.Seq) || null, row: r._row };
    }
    prev = r.Digest; expectSeq++; chained++;
  }
  return { ok: true, legacy: legacy.length, chained: chained, lastSeq: expectSeq - 1, lastDigest: prev };
}

/* ============================================================================
 * Sessions, sign-in, sign-in limits and account recovery
 *
 * Every session (phone, office and school iPad) is a row in Sessions holding a keyed hash of its token, the
 * person's AuthVersion when it was issued and, for the iPad, its DeviceID. A session is good only while its row is
 * not revoked or expired, the person is active with the same AuthVersion, the system's SessionEpoch is unchanged and,
 * on the iPad, the device is still registered. The cache only remembers which row to read; it never decides.
 * ========================================================================== */

function sessionMinutes_(req, device) {
  if (device === 'kiosk') return 20;
  var days = Number(setting_('RememberDays'));
  if (req.remember === false || !days) return 12 * 60;
  return days * 24 * 60;
}

function createSession_(kind, subject, device, minutes, opts) {
  requireLock_();
  opts = opts || {};
  var token = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '').toLowerCase();
  var hash = hmac_('t:' + token), n = now_();
  var row = {
    TokenHash: hash, Kind: kind, SubjectID: kind === 'staff' ? subject.StaffID : subject.AdultID, Device: device, DeviceID: opts.deviceId || '',
    AuthVersion: String(subject.AuthVersion || '1'), Epoch: String(setting_('SessionEpoch') || '1'), Scope: opts.scope || 'full',
    CreatedAt: n.stamp, LastSeen: n.stamp, ExpiresAt: String(n.ms + minutes * 60000), Revoked: ''
  };
  db_().append('Sessions', [row]);
  cachePut_('s:' + hash, String(row._row), CACHE_MAX_TTL);
  return token;
}

/** The session row for a token hash, using the cached row number only as a hint and checking it. */
function findSession_(hash) {
  var d = db_(), L = d.tables.Sessions || d.layout('Sessions'), last = L.sh.getLastRow();
  if (last < 2) return null;
  var hint = Number(cacheGet_('s:' + hash) || 0);
  if (hint >= 2 && hint <= last) {
    var vals = L.sh.getRange(hint, 1, 1, L.headers.length).getValues()[0];
    if (String(vals[L.index.TokenHash]) === hash) return rowToObj_('Sessions', L, vals, hint);
  }
  var col = L.sh.getRange(2, L.index.TokenHash + 1, last - 1, 1).getValues(), found = -1;
  for (var i = 0; i < col.length; i++) {
    if (String(col[i][0]) === hash) {
      if (found >= 0) throw appError_('SIGNED_OUT', 'Please sign in again.');
      found = i + 2;
    }
  }
  if (found < 0) return null;
  cachePut_('s:' + hash, String(found), CACHE_MAX_TTL);
  return rowToObj_('Sessions', L, L.sh.getRange(found, 1, 1, L.headers.length).getValues()[0], found);
}

function signedOut_() { return appError_('SIGNED_OUT', 'Please sign in again.'); }

/** Checks a request's session. Never writes: revocation decisions are made by the writers, under the lock. */
function auth_(req, level) {
  var token = req.token;
  if (!token || typeof token !== 'string' || !/^[0-9a-f]{64}$/.test(token)) throw signedOut_();
  var hash = hmac_('t:' + token), s = findSession_(hash);
  if (!s || s.Revoked === 'Y' || !(Number(s.ExpiresAt) > Date.now())) throw signedOut_();
  if (String(s.Epoch || '') !== String(setting_('SessionEpoch') || '1')) throw signedOut_();
  var kind = level === 'parent' ? 'parent' : 'staff';
  if (s.Kind !== kind) throw signedOut_();
  var session = { hash: hash, kind: s.Kind, id: s.SubjectID, device: s.Device, deviceId: s.DeviceID, scope: s.Scope || 'full', exp: Number(s.ExpiresAt), row: s };
  if (kind === 'parent') {
    var a = db_().byId('Adults', s.SubjectID);
    if (!a) throw signedOut_();
    if (a.Status !== 'Active') throw appError_('INACTIVE', 'This profile is no longer active. Please contact the front office.');
    if (String(a.AuthVersion || '1') !== String(s.AuthVersion)) throw signedOut_();
    if (s.Device === 'kiosk') {
      var dev = s.DeviceID ? db_().byId('Devices', s.DeviceID) : null;
      if (!dev || dev.Active !== 'Y') throw signedOut_();
    }
    return { adult: a, session: session };
  }
  var st = db_().byId('Staff', s.SubjectID);
  if (!st || st.Active === 'N' || String(st.AuthVersion || '1') !== String(s.AuthVersion)) throw signedOut_();
  return { staff: st, session: session };
}

/** Ends every session of one person by raising their AuthVersion (the caller saves the row). */
function bumpAuth_(subject) { subject.AuthVersion = String((Number(subject.AuthVersion) || 1) + 1); }

/** Marks one person's session rows revoked (housekeeping; AuthVersion is what actually ends them). Returns live ones ended. */
function revokeSessionRows_(subjectId, keepHash) {
  var t = db_().table('Sessions'), n = 0, now = Date.now(), changed = [];
  t.rows.forEach(function (r) {
    if (r.SubjectID !== subjectId || r.Revoked === 'Y' || r.TokenHash === keepHash) return;
    r.Revoked = 'Y'; changed.push(r); cacheRemove_('s:' + r.TokenHash);
    if (Number(r.ExpiresAt) > now) n++;
  });
  db_().saveRows('Sessions', changed);
  return n;
}

/** Keeps the current session after its owner's AuthVersion was raised (a PIN change on this phone). */
function restampSession_(session, subject) {
  var row = session.row;
  row.AuthVersion = String(subject.AuthVersion);
  db_().save('Sessions', row);
}

function revokeSession_(session) {
  var row = session.row;
  row.Revoked = 'Y';
  db_().save('Sessions', row);
  cacheRemove_('s:' + session.hash);
}

/* ---------- sign-in limits ---------- */

/** Attempts per canonical identifier in a window (right or wrong), the same for profiles that exist and ones that do not. */
function idBudget_(key, max, seconds) {
  var k = 'b:' + sha256Hex_(key).slice(0, 32), n = Number(cacheGet_(k) || 0) + 1;
  cachePut_(k, String(n), seconds);
  if (n > max) throw appError_('SLOW_DOWN', 'Too many tries. Please wait a few minutes and try again.');
}

function lockedMinutes_(acct) {
  var until = Number(acct.LockedUntil) || 0, now = Date.now();
  return until > now ? Math.ceil((until - now) / 60000) : 0;
}

function lockedError_(minutes) {
  return appError_('LOCKED', 'Too many wrong PINs. Try again in ' + minutes + ' minute' + (minutes === 1 ? '' : 's') + ', or ask the front office.');
}

/** A wrong PIN for a real account: counted on its row (survives cache loss); 5 in a row lock it, each lock twice as long (max 24 h). */
function recordFailure_(acct, table) {
  var fails = (Number(acct.FailedAttempts) || 0) + 1, locked = 0;
  acct.FailedAttempts = String(fails);
  if (fails >= LOCK_AFTER) {
    var count = (Number(acct.LockCount) || 0) + 1;
    locked = Math.min(LOCK_MAX_MIN, LOCK_BASE_MIN * Math.pow(2, count - 1));
    acct.LockCount = String(count); acct.FailedAttempts = '0';
    acct.LockedUntil = String(Date.now() + locked * 60000);
  }
  db_().save(table, acct);
  return locked;
}

function recordSuccess_(acct) { acct.FailedAttempts = '0'; acct.LockedUntil = ''; acct.LockCount = '0'; }

/** Wrong PINs for an identifier with no account behave the same way (in the cache: there is no account to protect). */
function unknownFailure_(key) {
  var k = 'u:' + sha256Hex_(key).slice(0, 32), n = Number(cacheGet_(k) || 0) + 1;
  cachePut_(k, String(n), LOCK_BASE_MIN * 60);
  return n >= LOCK_AFTER ? LOCK_BASE_MIN : 0;
}
function unknownLocked_(key) { return Number(cacheGet_('u:' + sha256Hex_(key).slice(0, 32)) || 0) >= LOCK_AFTER ? LOCK_BASE_MIN : 0; }

/** Counts failures across everyone, only to warn the admins. It never pauses anyone's sign-in. */
function noteFailureSurge_(kind, ctx, threshold) {
  var k = 'surge:' + kind + ':' + now_().date, n = Number(cacheGet_(k) || 0) + 1;
  cachePut_(k, String(n), CACHE_MAX_TTL);
  if (n === threshold) {
    alertAdmins_(ctx, kind, 'Many wrong ' + (kind === 'staff' ? 'staff' : 'family') + ' PINs today',
      '<p>There have been ' + n + ' wrong ' + (kind === 'staff' ? 'staff' : 'family') + ' PINs today. Accounts lock on their own after repeated wrong PINs; no one else is locked out.</p>' +
      '<p>If this looks like someone guessing, an admin can review the change log and reset PINs.</p>');
  }
}

/* ---------- PIN rules ---------- */

function validateNewPin_(pin) {
  pin = String(pin || '');
  if (!/^\d+$/.test(pin) || pin.length < PIN_MIN || pin.length > PIN_MAX) throw appError_('PIN_FORMAT', 'Your PIN must be ' + PIN_MIN + ' to ' + PIN_MAX + ' digits.');
  if (weakPin_(pin)) throw appError_('PIN_WEAK', 'Pick a PIN that is harder to guess: no repeats, runs, patterns or dates.');
  return pin;
}

function setPin_(acct, pin) {
  acct.PinSalt = randomCode_(16);
  acct.PinHash = hashPin_(pin, acct.PinSalt);
  acct.PinDigits = String(pin.length);
}

function pinMatches_(acct, pin) {
  pin = String(pin || '');
  return /^\d{6,12}$/.test(pin) && !!acct.PinSalt && safeEqual_(hashPin_(pin, acct.PinSalt), acct.PinHash);
}

/* ---------- families: sign in ---------- */

function hLogin_(req, ctx) {
  var canon = canonicalLogin_(req.id);
  idBudget_('login:' + (canon || 'raw:' + String(req.id || '').slice(0, 80)), 12, 900);
  var device = 'phone', ipad = null;
  if (req.device === 'kiosk') {
    ipad = kioskDevice_(req.kioskKey);
    if (!ipad) throw appError_('KIOSK_UNKNOWN', 'This iPad is not registered as the school iPad. Ask the office to set it up again.');
    device = 'kiosk';
  }
  var bad = appError_('BAD_LOGIN', 'That phone/email and PIN don\'t match.');
  if (!canon) throw bad;
  var a = findAdultByCanonical_(canon);
  if (!a) {
    var ul = unknownLocked_(canon) || unknownFailure_(canon);
    noteFailureSurge_('family', ctx, 300);
    if (ul) throw lockedError_(ul);
    throw bad;
  }
  var mins = lockedMinutes_(a);
  if (mins) throw lockedError_(mins);
  if (!pinMatches_(a, req.pin)) {
    var locked = recordFailure_(a, 'Adults');
    noteFailureSurge_('family', ctx, 300);
    if (locked) throw lockedError_(locked);
    throw bad;
  }
  if (a.Status !== 'Active') throw bad;
  var n = now_();
  if (a.MustChangePin === 'Y' && !(Number(a.TempPinExpires) > n.ms)) {
    throw appError_('PIN_EXPIRED', 'This temporary PIN has expired. Ask the front office for a new one.');
  }
  recordSuccess_(a);
  a.LastSignIn = n.stamp;
  db_().save('Adults', a);
  if (ipad) { ipad.LastSeen = n.stamp; db_().save('Devices', ipad); }
  var reason = a.MustChangePin === 'Y' ? 'TEMP' : (Number(a.PinDigits) || LEGACY_PIN) < PIN_MIN ? 'UPGRADE' : '';
  if (reason) {
    var rt = createSession_('parent', a, device, 30, { deviceId: ipad ? ipad.DeviceID : '', scope: 'recovery' });
    return { token: rt, mustChangePin: reason, me: { first: a.First, lang: a.Lang || 'en' } };
  }
  var token = createSession_('parent', a, device, sessionMinutes_(req, device), { deviceId: ipad ? ipad.DeviceID : '' });
  return { token: token, home: homePayload_(a) };
}

/** School iPads are registered by a manager; a family signed in on one skips the location check, bound to that device. */
function kioskDevice_(key) {
  key = String(key || '');
  if (!/^[0-9a-f]{64}$/.test(key)) return null;
  var hash = hmac_('kiosk:' + key);
  return db_().table('Devices').rows.filter(function (r) { return r.KeyHash === hash && r.Active === 'Y'; })[0] || null;
}

/* ---------- staff: sign in with a sign-in name and PIN ---------- */

function hStaffLogin_(req, ctx) {
  var login = normStaffLogin_(req.login);
  idBudget_('staff:' + (login || 'raw'), 12, 900);
  var bad = appError_('BAD_LOGIN', 'That staff sign-in name and PIN don\'t match.');
  var st = login ? db_().table('Staff').rows.filter(function (r) { return normStaffLogin_(r.Login) === login; })[0] : null;
  if (!st || st.Active === 'N') {
    var ul = login ? (unknownLocked_('staff:' + login) || unknownFailure_('staff:' + login)) : 0;
    noteFailureSurge_('staff', ctx, 15);
    if (ul) throw lockedError_(ul);
    throw bad;
  }
  var mins = lockedMinutes_(st);
  if (mins) throw lockedError_(mins);
  if (!pinMatches_(st, req.pin) || (Number(st.PinDigits) || 0) < PIN_MIN) {
    var legacyOk = pinMatches_(st, req.pin);
    if (!legacyOk) {
      var locked = recordFailure_(st, 'Staff');
      noteFailureSurge_('staff', ctx, 15);
      if (locked) throw lockedError_(locked);
      throw bad;
    }
    throw appError_('PIN_TOO_SHORT', 'This staff PIN is from an older version and is too short. An admin needs to give you a new one (Admin > Staff > New PIN).');
  }
  recordSuccess_(st);
  db_().save('Staff', st);
  var token = createSession_('staff', st, 'office', 12 * 60);
  log_({ name: st.Name, type: st.Role, id: st.StaffID }, 'Signed in to the office screen', 'Staff', st.StaffID, '', '', '');
  return { token: token, staff: { id: st.StaffID, name: st.Name, role: st.Role, login: st.Login } };
}

/* ---------- recovery by email code ---------- */

function openChallenge_(adult, kind) {
  var now = Date.now();
  var list = db_().table('Challenges').rows.filter(function (c) { return c.AdultID === adult.AdultID && c.Kind === kind && c.Status === 'OPEN' && Number(c.ExpiresAt) > now; });
  return list[list.length - 1] || null;
}

function closeChallenges_(adultId, kind, status) {
  var changed = db_().table('Challenges').rows.filter(function (c) { return c.AdultID === adultId && (!kind || c.Kind === kind) && c.Status === 'OPEN'; });
  changed.forEach(function (c) { c.Status = status; });
  db_().saveRows('Challenges', changed);
}

function hPinForgot_(req, ctx) {
  var canon = canonicalLogin_(req.id);
  idBudget_('forgot:' + (canon || 'raw:' + String(req.id || '').slice(0, 80)), 5, 3600);
  var a = canon ? findAdultByCanonical_(canon) : null;
  if (a && a.Status === 'Active' && a.Email && !contactDamaged_(a, 'Email')) {
    var n = now_(), day = n.ms - 24 * 3600000;
    var recent = db_().table('Challenges').rows.filter(function (c) { return c.AdultID === a.AdultID && c.Kind === 'RESET' && Number(c.ExpiresAt) > day; }).length;
    if (recent < 6) {
      closeChallenges_(a.AdultID, 'RESET', 'REPLACED');
      var code = randomDigits_(8);
      var ch = { ChallengeID: newId_('Challenges', 'C'), AdultID: a.AdultID, Kind: 'RESET', EmailIdx: a.EmailIdx, AuthVersion: String(a.AuthVersion || '1'), Payload: '',
        Attempts: '0', Status: 'OPEN', CreatedAt: n.stamp, ExpiresAt: String(n.ms + 15 * 60000), UsedAt: '', Delivery: 'QUEUED' };
      ch.CodeHash = hmac_('code:' + ch.ChallengeID + ':' + code);
      db_().append('Challenges', [ch]);
      var es = a.Lang === 'es', to = a.Email;
      ctx.after.push(function () {
        deliverChallenge_(ch.ChallengeID, to,
          es ? 'Tu código para cambiar el PIN' : 'Your code to reset your PIN',
          es ? '<p>Tu código es <b style="font-size:22px;letter-spacing:3px">' + code + '</b></p><p>Vence en 15 minutos y sirve una sola vez. Si no lo pediste, ignora este correo.</p>'
            : '<p>Your code is <b style="font-size:22px;letter-spacing:3px">' + code + '</b></p><p>It expires in 15 minutes and works once. If you didn\'t ask for it, you can ignore this email.</p>');
      });
    }
  }
  // The same answer whether or not a profile exists, has an email, or a message was actually sent.
  return { ok: true };
}

/** Sends a code by email after the reply is decided, then records what happened to it (under the lock, briefly). */
function deliverChallenge_(challengeId, to, subject, html) {
  var status = sendMail_(to, subject, html);
  try {
    withLock_(function () {
      var c = db_().byId('Challenges', challengeId);
      if (c) { c.Delivery = status; db_().save('Challenges', c); }
    }, 10000);
  } catch (e) { console.error('Could not record delivery state: ' + e); }
  return status;
}

function hPinReset_(req, ctx) {
  var canon = canonicalLogin_(req.id);
  idBudget_('reset:' + (canon || 'raw:' + String(req.id || '').slice(0, 80)), 8, 900);
  var bad = appError_('BAD_CODE', 'That code is not right or has expired.');
  var a = canon ? findAdultByCanonical_(canon) : null;
  var ch = a ? openChallenge_(a, 'RESET') : null;
  if (!a || !ch || a.Status !== 'Active' || ch.EmailIdx !== a.EmailIdx || String(ch.AuthVersion) !== String(a.AuthVersion || '1')) throw bad;
  var code = String(req.code || '').replace(/\D/g, '');
  if (!safeEqual_(ch.CodeHash, hmac_('code:' + ch.ChallengeID + ':' + code))) {
    ch.Attempts = String((Number(ch.Attempts) || 0) + 1);
    if (Number(ch.Attempts) >= 5) ch.Status = 'EXHAUSTED';
    db_().save('Challenges', ch);
    throw bad;
  }
  var pin = validateNewPin_(req.pin);
  var n = now_();
  ch.Status = 'USED'; ch.UsedAt = n.stamp;
  db_().save('Challenges', ch);
  setPin_(a, pin);
  recordSuccess_(a);
  a.MustChangePin = ''; a.TempPinExpires = ''; a.LastSignIn = n.stamp;
  bumpAuth_(a);
  db_().save('Adults', a);
  var ended = revokeSessionRows_(a.AdultID);
  log_({ name: fullName_(a), type: 'Parent/caregiver', id: a.AdultID }, 'Reset PIN with email code', 'Adult', a.AdultID, '', '', ended ? 'Signed out on ' + ended + ' other device(s)' : '');
  var token = createSession_('parent', a, 'phone', sessionMinutes_(req, 'phone'));
  return { token: token, home: homePayload_(a) };
}

/* ---------- families: PIN, email and sign-out ---------- */

function hPinChange_(req, ctx) {
  var a = ctx.adult, recovery = ctx.session.scope === 'recovery';
  if (!recovery) {
    var mins = lockedMinutes_(a);
    if (mins) throw lockedError_(mins);
    if (!pinMatches_(a, req.current)) {
      var locked = recordFailure_(a, 'Adults');
      if (locked) throw lockedError_(locked);
      throw appError_('BAD_PIN', 'Your current PIN is not right.');
    }
  }
  var pin = validateNewPin_(req.pin);
  setPin_(a, pin);
  recordSuccess_(a);
  a.MustChangePin = ''; a.TempPinExpires = '';
  bumpAuth_(a);
  db_().save('Adults', a);
  closeChallenges_(a.AdultID, '', 'REVOKED');
  var out = { ok: true };
  if (recovery) {
    revokeSession_(ctx.session);
    out.signedOutOthers = revokeSessionRows_(a.AdultID);
    out.token = createSession_('parent', a, ctx.session.device, sessionMinutes_(req, ctx.session.device), { deviceId: ctx.session.deviceId });
    out.home = homePayload_(a);
  } else {
    restampSession_(ctx.session, a);
    out.signedOutOthers = revokeSessionRows_(a.AdultID, ctx.session.hash);
  }
  log_(actorOf_(ctx), recovery ? 'Set a new PIN after a temporary or outdated PIN' : 'Changed PIN', 'Adult', a.AdultID, '', '', out.signedOutOthers ? 'Signed out on ' + out.signedOutOthers + ' other device(s)' : '');
  return out;
}

/**
 * Changing the recovery email needs the current PIN and a code sent to the NEW address; the old address is told.
 * Until the code is confirmed nothing changes. Confirming ends other sessions and sends the profile back for school review.
 */
function hEmailChange_(req, ctx) {
  var a = ctx.adult;
  requireContactIntact_(a);
  var mins = lockedMinutes_(a);
  if (mins) throw lockedError_(mins);
  if (!pinMatches_(a, req.current)) {
    var locked = recordFailure_(a, 'Adults');
    if (locked) throw lockedError_(locked);
    throw appError_('BAD_PIN', 'Your current PIN is not right.');
  }
  recordSuccess_(a); db_().save('Adults', a);
  var email = String(req.email || '').trim() ? normEmail_(req.email) : '';
  if (req.email && !email) throw appError_('BAD_EMAIL', 'Please check the email address.');
  if (!email) {
    if (!a.Phone) throw appError_('NEED_CONTACT', 'Keep at least a phone number or an email.');
    var before = strip_(a);
    a.Email = ''; a.Verified = 'N'; bump_(a); bumpAuth_(a);
    db_().save('Adults', a);
    restampSession_(ctx.session, a);
    revokeSessionRows_(a.AdultID, ctx.session.hash);
    closeChallenges_(a.AdultID, '', 'REVOKED');
    log_(actorOf_(ctx), 'Removed recovery email', 'Adult', a.AdultID, before, a, 'Profile sent back for school review');
    return { removed: true, home: homePayload_(a) };
  }
  if (email === a.Email) throw appError_('BAD_EMAIL', 'That is already your email.');
  if (adultWith_('Email', email, a.AdultID)) throw appError_('ACCOUNT_EXISTS', 'That email is used by another profile.');
  idBudget_('emailchange:' + a.AdultID, 4, 3600);
  closeChallenges_(a.AdultID, 'EMAIL', 'REPLACED');
  var n = now_(), code = randomDigits_(8);
  var ch = { ChallengeID: newId_('Challenges', 'C'), AdultID: a.AdultID, Kind: 'EMAIL', EmailIdx: a.EmailIdx, AuthVersion: String(a.AuthVersion || '1'),
    Attempts: '0', Status: 'OPEN', CreatedAt: n.stamp, ExpiresAt: String(n.ms + 30 * 60000), UsedAt: '', Delivery: 'QUEUED' };
  ch.CodeHash = hmac_('code:' + ch.ChallengeID + ':' + code);
  ch.Payload = seal_(email, 'Challenges|' + ch.ChallengeID + '|Payload');
  db_().append('Challenges', [ch]);
  var es = a.Lang === 'es', old = a.Email;
  ctx.after.push(function () {
    deliverChallenge_(ch.ChallengeID, email, es ? 'Confirma tu nuevo correo' : 'Confirm your new email',
      es ? '<p>Tu código es <b style="font-size:22px;letter-spacing:3px">' + code + '</b></p><p>Escríbelo en la aplicación para usar este correo. Vence en 30 minutos.</p>'
        : '<p>Your code is <b style="font-size:22px;letter-spacing:3px">' + code + '</b></p><p>Type it in the app to start using this email. It expires in 30 minutes.</p>');
    if (old) sendMail_(old, es ? 'Se pidió cambiar tu correo' : 'A change of email was requested',
      es ? '<p>Alguien con tu PIN pidió cambiar el correo de tu perfil. Si no fuiste tú, llama a la oficina.</p>'
        : '<p>Someone with your PIN asked to change the email on your profile. If this was not you, call the front office.</p>');
  });
  log_(actorOf_(ctx), 'Asked to change recovery email', 'Adult', a.AdultID, '', mask_('Email', email), 'Code sent to the new address');
  return { sent: true };
}

function hEmailConfirm_(req, ctx) {
  var a = ctx.adult, ch = openChallenge_(a, 'EMAIL');
  var bad = appError_('BAD_CODE', 'That code is not right or has expired.');
  if (!ch || String(ch.AuthVersion) !== String(a.AuthVersion || '1') || ch.EmailIdx !== a.EmailIdx) throw bad;
  var code = String(req.code || '').replace(/\D/g, '');
  if (!safeEqual_(ch.CodeHash, hmac_('code:' + ch.ChallengeID + ':' + code))) {
    ch.Attempts = String((Number(ch.Attempts) || 0) + 1);
    if (Number(ch.Attempts) >= 5) ch.Status = 'EXHAUSTED';
    db_().save('Challenges', ch);
    throw bad;
  }
  var email = open_(ch.Payload, 'Challenges|' + ch.ChallengeID + '|Payload');
  if (adultWith_('Email', email, a.AdultID)) throw appError_('ACCOUNT_EXISTS', 'That email is used by another profile.');
  var before = strip_(a);
  ch.Status = 'USED'; ch.UsedAt = now_().stamp; ch.Payload = '';
  db_().save('Challenges', ch);
  a.Email = email; a.Verified = 'N'; bump_(a); bumpAuth_(a);
  db_().save('Adults', a);
  restampSession_(ctx.session, a);
  var ended = revokeSessionRows_(a.AdultID, ctx.session.hash);
  closeChallenges_(a.AdultID, 'RESET', 'REVOKED');
  log_(actorOf_(ctx), 'Changed recovery email', 'Adult', a.AdultID, before, a, 'Confirmed by code; profile sent back for school review' + (ended ? '; signed out on ' + ended + ' other device(s)' : ''));
  return { ok: true, home: homePayload_(a) };
}

function hLogoutAll_(req, ctx) {
  var a = ctx.adult;
  bumpAuth_(a);
  db_().save('Adults', a);
  var n = revokeSessionRows_(a.AdultID);
  closeChallenges_(a.AdultID, '', 'REVOKED');
  log_(actorOf_(ctx), 'Signed out on all devices', 'Adult', a.AdultID, '', '', n + ' sign-in(s) ended');
  return { ok: true, ended: n };
}

function hLogout_(req, ctx) {
  revokeSession_(ctx.session);
  return { ok: true };
}

/* ---------- email ---------- */

function canEmail_(email) {
  return !!email && !/@example\.(com|org|net)$/i.test(email) && !/\.(test|invalid|example|localhost)$/i.test(email);
}

/**
 * Sends one email as the script's owner. Returns what happened: SENT, SUPPRESSED (reserved demo address),
 * DEMO_INBOX (a demo system keeps it in its own inbox), QUOTA (daily limit reached) or FAILED. Never throws.
 */
function sendMail_(to, subject, innerHtml) {
  try {
    var ext = demoExt_();
    var s = getConfig_().settings;
    var html = '<div style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;color:#12161c;max-width:520px">' +
      '<div style="font-weight:600;color:' + safeColor_(s.AccentColor) + ';margin-bottom:12px">' + escHtml_(s.SchoolName || 'School') + '</div>' +
      innerHtml + '<p style="color:#5b6472;font-size:13px;margin-top:24px">' + escHtml_(s.ShortName || s.SchoolName || 'School') + ' Check-In</p></div>';
    if (ext && ext.deliver) { ext.deliver(to, subject, html); return 'DEMO_INBOX'; }
    if (!canEmail_(to)) return 'SUPPRESSED';
    if (MailApp.getRemainingDailyQuota() < 3) return 'QUOTA';
    var logo = readLogo_(), inline = {}, img = '';
    var m = /^data:(image\/(png|jpeg|webp));base64,([A-Za-z0-9+\/=]+)$/.exec(logo || '');
    if (m) { inline.logo = Utilities.newBlob(Utilities.base64Decode(m[3]), m[1], 'logo'); img = '<img src="cid:logo" alt="" style="height:44px;width:auto;margin-bottom:10px">'; }
    MailApp.sendEmail({ to: to, subject: subject, htmlBody: img + html, inlineImages: inline, name: (s.ShortName || 'School') + ' Check-In' });
    return 'SENT';
  } catch (e) {
    console.error('Email failed: ' + e);
    return 'FAILED';
  }
}

function safeColor_(c) { return /^#[0-9a-fA-F]{6}$/.test(String(c || '')) ? c : '#2F5BEA'; }

function escHtml_(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}

/** One email a day per kind of warning, to the Site Manager and the owner, sent after the reply. */
function alertAdmins_(ctx, kind, subject, html) {
  var flag = 'alert:' + kind + ':' + now_().date;
  if (cacheGet_(flag)) return;
  cachePut_(flag, '1', CACHE_MAX_TTL);
  var to = [setting_('SiteManagerEmail')];
  try { to.push(Session.getEffectiveUser().getEmail()); } catch (e) { /* not available */ }
  to = uniq_(to.map(normEmail_).filter(Boolean));
  var task = function () { to.forEach(function (addr) { sendMail_(addr, subject, html); }); };
  task.evenOnFailure = true;
  if (ctx && ctx.after) ctx.after.push(task); else task();
}

/* ============================================================================
 * Families: who may do what for which child
 *
 * Permission is per adult AND per child, through one Links row: Role (Guardian or Pickup), Status (Active or
 * Inactive) and Approval (PENDING, APPROVED, DENIED). A child's identity, an adult's identity and each link are
 * reviewed separately by the school. Nothing is granted to an adult because of who else shares a child.
 * ========================================================================== */

var AUTH_REASON_TEXT = {
  ADULT_MISSING: 'Adult not found', CHILD_MISSING: 'Child not found', ADULT_INACTIVE: 'Adult deactivated', CHILD_INACTIVE: 'Child inactive',
  NO_PERMISSION: 'No current permission for this child', PERMISSION_DENIED: 'Permission refused by the school', PICKUP_ONLY: 'Pickup-only caregiver',
  ADULT_NOT_VERIFIED: 'Adult not verified', CHILD_NOT_VERIFIED: 'Child not verified', PERMISSION_PENDING: 'Permission not approved yet',
  CONTACT_DAMAGED: 'Contact details need checking', OTHER_ADULT: 'Adult not in the system'
};

function activeLinkFor_(adultId, studentId) {
  var links = db_().where('Links', function (l) { return l.AdultID === adultId && l.StudentID === studentId && l.Status === 'Active'; });
  return links.filter(function (l) { return l.Role === 'Guardian'; })[0] || links[0] || null;
}

/**
 * The current authority of one adult for one child, from fresh rows.
 * purpose: 'release' (the desk handing the child over) or 'report:TARDY|EARLY|ABSENT'.
 * DENIED: the adult may not do this at all. PENDING: allowed to report, but the school has not finished reviewing

  db_().saveRows('Invites', changed);

  if (!inviter || inviter.Status !== 'Active') throw bad;
  var versions = {};
  try { versions = JSON.parse(inv.LinkVersions || '{}'); } catch (e) { throw bad; }

    if (!k || k.Status !== 'Active' || !l || l.Role !== 'Guardian' || l.Approval === 'DENIED' || String(l.Version) !== String(versions[sid])) throw bad;
    return k;

  if (!kids.length) throw bad;

/* ============================================================================
 * Operations journal: retries that are safe after a lost reply or an interruption
 *
 * A write that creates several rows records an Operations row first (PENDING, with every ID it will create),
 * then writes, then marks it DONE. The same person retrying with the same request key and the same request gets
 * the same result (rebuilt from the current rows, after their current permission is checked again); a different
 * request under the same key is refused; an interrupted one resumes and creates only what is missing.
 * The journal is in the sheet, so losing the cache loses nothing.
 * ========================================================================== */

function opDigest_(action, payload) { return hmac_('op:' + action + ':' + JSON.stringify(payload)); }

function findOp_(actorId, action, key) {
  if (!key) return null;
  var hits = db_().where('Operations', function (o) { return o.ActorID === actorId && o.Action === action && o.RequestKey === key; });
  return hits[0] || null;
}

function validRequestKey_(k) { k = String(k || ''); return /^[A-Za-z0-9_\-]{8,64}$/.test(k) ? k : ''; }

/** A finished earlier run of exactly this request, if there is one. A different request under the same key is an error. */
function opDone_(actorId, action, key, payload) {
  key = validRequestKey_(key);
  var op = findOp_(actorId, action, key);
  if (!op) return null;
  if (op.Digest !== opDigest_(action, payload)) throw appError_('IDEMPOTENCY_CONFLICT', 'This request was already used for something else. Please start again.');
  return op.Status === 'DONE' ? JSON.parse(op.Plan || '{}') : null;
}

function opRun_(actorId, action, key, payload, build, apply) {
  requireLock_();
  key = validRequestKey_(key);
  var digest = opDigest_(action, payload), op = key ? findOp_(actorId, action, key) : null, plan, n = now_();
  if (op) {
    if (op.Digest !== digest) throw appError_('IDEMPOTENCY_CONFLICT', 'This request was already used for something else. Please start again.');
    plan = JSON.parse(op.Plan || '{}');
    if (op.Status === 'DONE') return { plan: plan, result: JSON.parse(op.Result || '{}'), replay: true };
  } else {
    plan = build();
    op = { OpID: newId_('Operations', 'O'), ActorID: actorId, Action: action, RequestKey: key || ('srv-' + randomCode_(12)), Digest: digest, Status: 'PENDING',
      Plan: JSON.stringify(plan), Result: '', CreatedAt: n.stamp, UpdatedAt: n.stamp };
    db_().append('Operations', [op]);
  }
  plan.opId = op.OpID;
  var result = apply(plan, op) || {};
  op.Status = 'DONE'; op.Result = JSON.stringify(result).slice(0, 40000); op.UpdatedAt = now_().stamp;
  db_().save('Operations', op);
  return { plan: plan, result: result, replay: false };
}

/* ============================================================================
 * Being at school: tardies and early releases are sent from campus only
 * ========================================================================== */

function distanceM_(lat1, lng1, lat2, lng2) {
  var rad = Math.PI / 180, dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/** Feet up close, miles further out: how people here talk about distance. */
function fmtDist_(m) {
  var ft = m * 3.28084;
  if (ft < 1000) return (Math.max(10, Math.round(ft / 10) * 10)) + ' ft';
  var mi = m / 1609.344;
  return (mi < 10 ? mi.toFixed(1) : String(Math.round(mi))) + ' mi';
}

function campus_() {
  var s = getConfig_().settings;
  if (s.SchoolLat === '' || s.SchoolLng === '') return null;
  var lat = parseFloat(s.SchoolLat), lng = parseFloat(s.SchoolLng), feet = parseFloat(s.CampusRadiusFeet) || 800;
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat: lat, lng: lng, radiusM: feet * 0.3048, radiusFt: feet };
}

/**
 * Checks the phone's reported position against the campus. The position comes from the phone's browser, so this
 * only stops casual reporting from home; it is not proof of presence. Every entry keeps the distance it was sent from,
 * and the desk still checks the adult in person before a release.
 */
function locationCheck_(loc) {
  var c = campus_();
  if (!c) return { ok: false, code: 'NO_CAMPUS', message: 'The school location is not set up yet. Please check in at the front office.' };
  var lat = loc ? Number(loc.lat) : NaN, lng = loc ? Number(loc.lng) : NaN, acc = loc ? Math.max(0, Number(loc.acc) || 0) : 0;
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
    return { ok: false, code: 'NEED_LOCATION', message: 'Turn on location to send a tardy or early release from school.' };
  }
  var d = distanceM_(lat, lng, c.lat, c.lng);
  var label = fmtDist_(d) + ' from school' + (acc ? ' (±' + fmtDist_(acc) + ')' : '');
  if (acc > 1000) return { ok: false, distance: d, label: label, code: 'LOCATION_IMPRECISE', message: 'Your phone is sharing an approximate location. Turn on Precise Location and try again.' };
  if (d - Math.min(acc, 100) <= c.radiusM) return { ok: true, distance: d, label: 'Phone reported on campus · ' + label };
  return { ok: false, distance: d, label: label, code: 'NOT_ON_CAMPUS', message: 'You need to be at school to send a tardy or early release. You are about ' + fmtDist_(d) + ' away.' };
}

/** Absence dates: both ends real dates, in order, inside the allowed window, school days only, never silently cut short. */
function absenceDates_(dateIn, endIn, today) {
  var date = dateIn ? String(dateIn) : today, end = endIn ? String(endIn) : date;
  if (!isDate_(date) || !isDate_(end)) throw appError_('BAD_DATE', 'Please choose a real date.');
  if (end < date) { var tmp = end; end = date; date = tmp; }
  if (date < addDays_(today, -14)) throw appError_('BAD_DATE', 'Absences can be reported up to two weeks back.');
  if (end > addDays_(today, 60)) throw appError_('BAD_DATE', 'Please choose dates in the next two months.');
  var days = schoolDays_(date, end, 16);
  if (days.length > 15) throw appError_('BAD_DATE', 'Report at most 15 school days at a time.');
  if (!days.length) throw appError_('NO_SCHOOL', 'There is no school on ' + (date === end ? 'that date' : 'those dates') + ' (weekend or school closure).');
  return days;
}

function reasonFor_(type, key, noteIn) {
  var cfg = getConfig_(), reason = '', note = '';

    var r = (cfg.reasons[type] || []).filter(function (x) { return x.key === key; })[0];
    if (!r) throw appError_('PICK_REASON', 'Please choose a reason.');
    reason = r.en;
  } else {
    note = clean_(noteIn, 140);
    if (!note) throw appError_('PICK_REASON', 'Choose or type a reason.');
    reason = 'Other';
  }
  return { reason: reason, note: note };
}

function hEntryCreate_(req, ctx) {

  var ids = uniq_((req.studentIds || []).map(String)).slice(0, 9);
  if (!ids.length) throw appError_('PICK_KID', 'Choose at least one child.');
  if (ids.length > 8) throw appError_('TOO_MANY', 'Choose up to 8 children at a time.');
  // Permission first, for every child, from current rows: a retry never gets past this if access has ended.
  var kids = ids.map(function (sid) {

        Student: fullName_(k), Grade: k.Grade, Teacher: k.Teacher, Time: time, Reason: rs.reason, Note: rs.note, Location: where,
        ReporterID: a.AdultID, ReporterKind: 'Adult', Reporter: fullName_(a), Relationship: a.Relationship,
        Source: ctx.session && ctx.session.device === 'kiosk' ? 'School iPad' : 'Parent app', Status: 'REPORTED', StatusAt: '', StatusBy: '', StatusByID: '',
        ReleaseCheck: '', ReleaseNote: '', ReleaseAuthority: '', MinutesLate: late, VoidReason: '', ClientID: validRequestKey_(req.clientId), Version: '1', Flags: ''
      });

/* ---------- the day handed to PowerSchool ---------- */

/** A fingerprint of a day's records: changes whenever an entry of that day is added, changed or voided. */
function dayDigest_(date) {
  var rows = db_().where('Entries', function (e) { return e.Date === date; })
    .map(function (e) { return [e.EntryID, e.Status, e.Version, e.Type, e.StudentID].join('|'); }).sort();
  return { count: rows.length, digest: sha256Hex_(rows.join('\n')).slice(0, 16) };
}

function dayCloseState_(date) {
  var closes = db_().where('DayClose', function (r) { return r.Date === date; });
  var last = closes[closes.length - 1];
  if (!last) return { closed: false };
  var cur = dayDigest_(date);
  return { closed: true, by: last.ClosedBy, at: last.ClosedAt, changedSince: cur.digest !== last.Digest, count: Number(last.EntryCount) || 0 };
}

/** The desk records that a day was entered in PowerSchool. If the day changed since they looked, they must look again. */
function hOfficeDayClose_(req, ctx) {
  var date = String(req.date || '');
  if (!isDate_(date)) throw appError_('BAD_DATE', 'Choose a day.');
  var cur = dayDigest_(date);
  if (String(req.digest || '') !== cur.digest) throw appError_('CONFLICT', 'This day changed since you copied it. Reload, copy it again and check it before marking it entered.');
  var n = now_();
  db_().append('DayClose', [{ Date: date, ClosedAt: n.stamp, ClosedBy: ctx.staff.Name, ClosedByID: ctx.staff.StaffID, EntryCount: String(cur.count), Digest: cur.digest, Note: clean_(req.note, 200) }]);
  log_(actorOf_(ctx), 'Marked day entered in PowerSchool', 'Day', date, '', '', cur.count + ' entr' + (cur.count === 1 ? 'y' : 'ies'));
  return { dayClose: dayCloseState_(date) };
}

  if (e.ReporterKind !== 'Adult') au = { state: 'DENIED', reasons: ['OTHER_ADULT'] };
  else au = authority_(e.ReporterID, e.StudentID, e.Type === 'EARLY' ? 'release' : 'report:' + e.Type);
  o.authority = authorityOut_(au);

function pendingReviewCount_() {
  return familyGroups_().filter(function (g) { var f = groupFlags_(g); return f.active && f.pending; }).length;
}

function hOfficeBoard_(req, ctx) {
  var n = now_(), date = isDate_(req.date) ? req.date : n.date, nowOut = { date: n.date, time: n.time, ms: n.ms };
  var key = 'board:' + systemId_() + ':' + date, ver = dataVersion_(), b = null;
  try { b = JSON.parse(cacheGet_(key) || 'null'); } catch (e) { b = null; }
  if (!b || b.v !== ver) {
    var entries = db_().where('Entries', function (e) { return e.Date === date; }).map(boardEntry_);
    var dd = dayDigest_(date);
    b = {
      v: ver, date: date, entries: entries, pendingReview: pendingReviewCount_(), schoolDay: schoolDay_(date), bellStart: setting_('BellStart'),
      dayClose: dayCloseState_(date), dayDigest: dd.digest, environment: environment_(),
      viewNotes: setting_('ViewNotes') === 'Yes', pickupExceptions: setting_('PickupExceptions')
    };

/**
 * Check in a tardy, record a pickup, or undo. A pickup is decided here, inside the lock, from the current rows:

    var by = req.pickedUpBy ? String(req.pickedUpBy) : (e.ReporterKind === 'Adult' ? e.ReporterID : '');
    var au = by ? authority_(by, e.StudentID, 'release') : { state: 'DENIED', reasons: ['OTHER_ADULT'] };
    var byAdult = by ? db_().byId('Adults', by) : null;

          '). Check the school\'s pickup records. Record an exception only if the school\'s process allows this release.', { authority: authorityOut_(au) });
      }

      var managersOnly = setting_('PickupExceptions') === 'Managers only' || au.state === 'DENIED';

        throw appError_('MANAGER_NEEDED', au.state === 'DENIED' ? 'This adult\'s permission for this child was refused or has ended. A Site Manager or admin must decide this release.' : 'A Site Manager or admin must record this exception.');
      }

    e.Student + (status === 'PICKED_UP' ? ' · ' + RELEASE_CHECKS[e.ReleaseCheck] + (e.ReleaseCheck === 'EXCEPTION' ? ' — ' + e.ReleaseNote : '') : ''));

/**
 * The office logs a call, a walk-in, or a report copied from the paper log while the app was down.

function hOfficeAddEntry_(req, ctx) {
  var type = String(req.type || '').toUpperCase(), d = db_();

  var kids = uniq_((req.studentIds || []).map(String)).slice(0, 12).map(function (id) {
    var k = d.byId('Students', id);

    return k;
  });
  if (!kids.length) throw appError_('PICK_KID', 'Choose at least one student.');
  var rcv = receivedAt_(ctx), dates, time = '', late = '', source = 'Office', flags = '';
  if (type === 'ABSENT') {

    if (!isDate_(date) || !isDate_(end)) throw appError_('BAD_DATE', 'Choose a real date.');

    time = rcv.time;
    if (req.manualTime) {

      time = hhmm_(mt); source = 'Manual record'; flags = 'Entered at ' + rcv.time + ' from a manual record';
    }

  }
  var adult = null, otherName = '';
  if (req.adultId) {
    adult = d.byId('Adults', String(req.adultId));
    if (!adult) throw appError_('NOT_FOUND', 'That adult was not found.');
    kids.forEach(function (k) { if (!activeLinkFor_(adult.AdultID, k.StudentID)) throw appError_('NOT_LINKED', fullName_(adult) + ' has no permission on record for ' + fullName_(k) + '. Choose "another adult" and write their name.'); });
  } else {
    otherName = clean_(req.reportedBy, 60);

    if (!otherName) otherName = 'Front office';
  }
  var rs = reasonFor_(type, req.reasonKey || 'other', req.note || (req.reasonKey ? '' : 'Logged by the office'));
  var payload = { t: type, k: kids.map(function (k) { return k.StudentID; }).sort(), d: dates, a: adult ? adult.AdultID : '', o: otherName, r: rs, m: req.manualTime || '' };
  var run = opRun_(ctx.staff.StaffID, 'office.addEntry', req.clientId, payload, function () {
    var reserved = {}, planned = [], already = [];
    dates.forEach(function (dt) {
      kids.forEach(function (k) {
        var dup = liveEntriesFor_(k.StudentID, dt, type)[0];
        if (dup) { already.push(dup.EntryID); return; }
        planned.push({ id: newEntryId_(dt, reserved), sid: k.StudentID, date: dt });
      });

    return { created: planned, already: already, batch: 'B-' + randomCode_(10) };
  }, function (plan) {
    var rows = [], n = now_();
    plan.created.forEach(function (p) {

      var k = d.byId('Students', p.sid);

        Student: fullName_(k), Grade: k.Grade, Teacher: k.Teacher, Time: type === 'ABSENT' ? '' : time, Reason: rs.reason, Note: rs.note,
        Location: type === 'ABSENT' ? '' : 'Front office', ReporterID: adult ? adult.AdultID : '', ReporterKind: adult ? 'Adult' : 'Other',
        Reporter: adult ? fullName_(adult) : otherName, Relationship: adult ? adult.Relationship : 'Logged by ' + ctx.staff.Name, Source: source,
        Status: 'REPORTED', StatusAt: '', StatusBy: '', StatusByID: '', ReleaseCheck: '', ReleaseNote: '', ReleaseAuthority: '', MinutesLate: late,
        VoidReason: '', ClientID: validRequestKey_(req.clientId), Version: '1', Flags: flags
