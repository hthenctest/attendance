/* ---------- families (staff view) ---------- */

/** Adults and children connected through links. Only a way to show related records together: never a unit of permission. */
function familyGroups_() {
  var d = db_(), adults = d.table('Adults').rows, kids = d.table('Students').rows, links = d.table('Links').rows;
  var parent = {};
  function find(x) { while (parent[x] && parent[x] !== x) { parent[x] = parent[parent[x]] || parent[x]; x = parent[x]; } return x; }
  function union(a, b) { parent[a] = parent[a] || a; parent[b] = parent[b] || b; var ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; }
  adults.forEach(function (a) { parent[a.AdultID] = parent[a.AdultID] || a.AdultID; });
  kids.forEach(function (k) { parent[k.StudentID] = parent[k.StudentID] || k.StudentID; });
  links.forEach(function (l) { if (l.Status === 'Active') union(l.AdultID, l.StudentID); });
  var groups = {};
  function g(id) { var r = find(id); return groups[r] || (groups[r] = { key: r, adults: [], kids: [], links: [] }); }
  adults.forEach(function (a) { g(a.AdultID).adults.push(a); });
  kids.forEach(function (k) { if (k.Status !== 'Merged') g(k.StudentID).kids.push(k); });
  links.forEach(function (l) { if (l.Status === 'Active') g(l.AdultID).links.push(l); });
  return Object.keys(groups).map(function (k) { return groups[k]; });
}

/** What still needs the school's review in a group, from plain flags only (no contact is decrypted). */
function groupFlags_(gr) {

    pending: gr.adults.some(function (a) { return a.Status === 'Active' && a.Verified !== 'Y'; }) ||

    dupes: gr.kids.some(function (k) { return k.PossibleDuplicateOf && k.Status === 'Active'; }),

    .map(function (i) { return { id: i.InviteID, inviter: i.InviterID, name: i.Name, role: i.Role, kids: list_(i.StudentIDs), expires: Number(i.ExpiresAt) }; });
  return {

      var phone = '', email = '';
      try { phone = prettyPhone_(a.Phone); email = a.Email; } catch (e) { /* damaged */ }
      return {
        id: a.AdultID, first: a.First, last: a.Last, phone: phone, email: email, relationship: a.Relationship, version: a.Version,
        status: a.Status, verified: a.Verified === 'Y', verifiedBy: a.VerifiedBy, createdAt: a.CreatedAt, lastSignIn: a.LastSignIn, lang: a.Lang,
        locked: lockedMinutes_(a) > 0, contactDamaged: contactDamaged_(a), tempPin: a.MustChangePin === 'Y',
        links: gr.links.filter(function (l) { return l.AdultID === a.AdultID; }).map(function (l) {
          return { id: l.LinkID, studentId: l.StudentID, role: l.Role, approval: l.Approval, approvedBy: l.ApprovedBy, version: l.Version,
            authority: authorityOut_(authority_(a.AdultID, l.StudentID, 'release')) };

function hOfficeFamilies_(req, ctx) {
  var q = clean_(req.q, 60).toLowerCase(), digits = q.replace(/\D/g, ''), emailish = /[@.]/.test(q);

    list = groups.filter(function (x) {

        x.g.adults.some(function (a) {

/**

      if (x.dec === 'deny') revokeInvites_({ inviterId: r.AdultID, studentId: r.StudentID }, 'Permission refused by the school');
    } else {

/**

 *  - an adult's identity: at least one of their permissions has that evidence.

  var hasContacts = roster.some(function (r) { return r.phones.length || r.emails.length; });
  var byName = {};
  roster.forEach(function (r) { (byName[r.first + '|' + r.last] = byName[r.first + '|' + r.last] || []).push(r); });

    var f = normName_(k.First), l = normName_(k.Last), g = normGrade_(k.Grade), same = byName[f + '|' + l] || [];

  var rowHits = {};
  db_().where('Students', function (k) { return k.Status === 'Active'; }).forEach(function (k) {
    var m = match(k);
    if (m.how === 'exact') rowHits[m.r.i] = (rowHits[m.r.i] || 0) + 1;
  });
  var reviewId = 'R-' + randomCode_(10), n = now_(), exp = String(n.ms + 15 * 60000), items = [], families = [], appStudents = 0, matched = 0;
  var addItem = function (kind, rec, evidence) {
    var it = { ItemID: 'RI-' + randomCode_(12), ReviewID: reviewId, StaffID: ctx.staff.StaffID, ItemKind: kind, EntityID: rec[kind === 'adult' ? 'AdultID' : kind === 'student' ? 'StudentID' : 'LinkID'],
      EntityVersion: String(rec.Version), Evidence: evidence, Detail: '', CreatedAt: n.stamp, ExpiresAt: exp, Status: 'OPEN' };
    items.push(it);
    return it.ItemID;
  };
  familyGroups_().forEach(function (gr) {
    var kids = gr.kids.filter(function (k) { return k.Status === 'Active'; });
    var adults = gr.adults.filter(function (a) { return a.Status === 'Active'; });
    if (!kids.length || !adults.length) return;
    var kidMatch = {};
    var kidsOut = kids.map(function (k) {

      if (m.how === 'exact' && (rowHits[m.r.i] > 1 || k.PossibleDuplicateOf)) m = { how: 'shared', r: m.r, count: rowHits[m.r.i] };
      kidMatch[k.StudentID] = m;
      if (m.how === 'exact' || m.how === 'shared') { matched++; m.r.used = true; }
      var item = m.how === 'exact' && k.Verified !== 'Y' ? addItem('student', k, 'Same name and grade on the roster') : '';

        roster: m.r ? { name: m.r.name, grade: m.r.grade, teacher: m.r.teacher } : null, count: m.count || 0,

      var evidenced = mine.some(function (l) { return linkEvidence[l.LinkID]; });
      var item = evidenced && a.Verified !== 'Y' ? addItem('adult', a, 'Phone or email listed on their child\'s roster row') : '';
      return {
        id: a.AdultID, name: fullName_(a), relationship: a.Relationship, verified: a.Verified === 'Y', evidence: evidenced, item: item,
        links: mine.map(function (l) {
          var ev = linkEvidence[l.LinkID];
          return { id: l.LinkID, studentId: l.StudentID, role: l.Role, approval: l.Approval, evidence: ev,
            item: ev && l.Approval === 'PENDING' ? addItem('link', l, 'Adult\'s contact on this child\'s roster row') : '' };
        })

    });
    var flags = groupFlags_(gr);
    var unsupported = adultsOut.some(function (a) { return (!a.verified && !a.item) || a.links.some(function (l) { return l.approval === 'PENDING' && !l.item; }); }) ||

    });
  });
  var rank = { ready: 0, check: 1, missing: 2 };
  families.sort(function (a, b) { return (a.pending === b.pending ? 0 : a.pending ? -1 : 1) || rank[a.state] - rank[b.state] || a.kids[0].name.localeCompare(b.kids[0].name); });
  if (items.length) db_().append('Reviews', items);
  return {
    reviewId: reviewId, expires: Number(exp), items: items.length, rosterStudents: roster.length, appStudents: appStudents, matched: matched, hasContacts: hasContacts,
    rosterWithoutFamily: roster.filter(function (r) { return !r.used; }).length, families: families.slice(0, 800)

  if (!start) { var m = /^(\d{4})/.exec(String(s.SchoolYear || '')); start = m ? m[1] + '-08-01' : ''; }
  if (!start || start > today) start = addDays_(today, -364);

    if (dw >= 1 && dw <= 5) weekdays[t][dw - 1]++;

    reasons[t][r] = (reasons[t][r] || 0) + 1;
    if (t === 'TARDY' && e.MinutesLate !== '' && isFinite(Number(e.MinutesLate))) {
      var m = Number(e.MinutesLate);
      p.lateMins += m; totals.lateMins += m; totals.lateCount++;
      if (m > flag) { p.over++; totals.over++; }
    }
  });
  var weekList = [];
  for (var d = weekStart_(from), guard = 0; d <= to && guard < 60; d = addDays_(d, 7), guard++) {
    weekList.push(weeks[d] || { start: d, TARDY: 0, EARLY: 0, ABSENT: 0 });
  }
  var top = function (t) {
    return Object.keys(reasons[t]).map(function (r) { return { reason: r, n: reasons[t][r] }; })
      .sort(function (a, b) { return b.n - a.n || a.reason.localeCompare(b.reason); }).slice(0, 6);
  };
  var list = Object.keys(people).map(function (id) { return people[id]; });
  list.sort(function (a, b) { return b.TARDY - a.TARDY || b.ABSENT - a.ABSENT || b.EARLY - a.EARLY || a.name.localeCompare(b.name); });
  return {
    from: from, to: to, yearStart: start, schoolYear: s.SchoolYear, flag: flag, grade: grade,
    totals: {
      TARDY: totals.TARDY, EARLY: totals.EARLY, ABSENT: totals.ABSENT, over: totals.over,
      avgLate: totals.lateCount ? Math.round(totals.lateMins / totals.lateCount) : null,
      students: { TARDY: Object.keys(students.TARDY).length, EARLY: Object.keys(students.EARLY).length, ABSENT: Object.keys(students.ABSENT).length }
    },
    weeks: weekList, weekdays: weekdays,
    reasons: { TARDY: top('TARDY'), EARLY: top('EARLY'), ABSENT: top('ABSENT') },
    students: list.slice(0, 600), studentCount: list.length

}

/** Names compared without accents, case or punctuation: "Lucía Martínez-López" and "lucia martinez lopez" are the same. */
function normName_(s) {
  return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

/** "Kindergarten", "KG" and "0" are K; "-1" and "TK" are TK; "03" and "3rd" are 3. */
function normGrade_(g) {
  var s = String(g == null ? '' : g).trim().toUpperCase().replace(/^GRADE\s*/, '').replace(/(ST|ND|RD|TH)$/, '');

  if (/^(TK|-1|TRANSITIONAL.*)$/.test(s)) return 'TK';
  var m = /^0*(\d{1,2})$/.exec(s);

}

/**

  });

  if (!calc.closuresAhead) warnings.push('The school calendar has no holidays or breaks in the next four months. Add them in Admin > School calendar, so tardies, early releases and absences follow the school\'s real calendar.');
  if (getConfig_().invalid.length) warnings.push('Some settings are not valid and use their defaults: ' + getConfig_().invalid.join(', ') + '.');
  return {

    staffLocked: db_().table('Staff').rows.filter(function (r) { return lockedMinutes_(r) > 0; }).map(function (r) { return r.Name; }),

    jobs: {

    },
    viewSheet: !!s.ViewSheetId, viewAccess: access.map(function (r) { return { email: r.Email, role: r.Role }; }),
    viewUnmanagedEditors: editors.filter(function (e) { return !access.some(function (r) { return r.Email === e; }) && e !== String(effectiveUser_()).toLowerCase(); }),
    siteManagerEmail: !!normEmail_(s.SiteManagerEmail), appUrl: !!s.AppUrl, campus: !!campus_(),
    mailLeft: mailLeft, mailProblems: mailProblems,

    logChain: { ok: chain.ok, chained: chain.chained, legacy: chain.legacy, breakAt: chain.breakAt || null },

function effectiveUser_() { try { return Session.getEffectiveUser().getEmail() || ''; } catch (e) { return ''; } }

/* ---------- new school year: resumable, after a backup ---------- */

function nextYearLabel_(label) {
  var m = /^(\d{4})\s*[-–\/]\s*(\d{2,4})$/.exec(String(label || '').trim());
  if (!m) { var y = Number(String(now_().date).slice(0, 4)); return y + '-' + String(y + 1).slice(2); }
  var a = Number(m[1]) + 1, b = Number(m[2].slice(-2)) + 1;
  return a + '-' + pad2_(b % 100);
}

/** Who moves where. A child already moved to the target year (an interrupted run) is never moved again. */
function newYearPlan_() {
  var s = getConfig_().settings, grades = list_(s.Grades), target = nextYearLabel_(s.SchoolYear);
  var kids = db_().where('Students', function (k) { return k.Status === 'Active' && k.YearOp !== target; });
  var advance = [], graduate = [], unknown = [];
  kids.forEach(function (k) {
    var i = grades.indexOf(k.Grade);
    if (i < 0) unknown.push(k);
    else if (i === grades.length - 1) graduate.push(k);
    else advance.push({ kid: k, to: grades[i + 1] });
  });
  var leaving = {};
  graduate.forEach(function (k) { leaving[k.StudentID] = true; });
  var links = db_().where('Links', function (l) { return l.Status === 'Active'; });
  var adultsLeaving = db_().where('Adults', function (a) {
    if (a.Status !== 'Active') return false;
    var mine = links.filter(function (l) { return l.AdultID === a.AdultID; }).map(function (l) { return db_().byId('Students', l.StudentID); })
      .filter(function (k) { return k && (k.Status === 'Active' || k.YearOp === target); });
    return mine.length > 0 && mine.every(function (k) { return leaving[k.StudentID] || (k.Status === 'Graduated' && k.YearOp === target); });
  });
  return { from: s.SchoolYear, to: target, advance: advance, graduate: graduate, unknown: unknown, adultsLeaving: adultsLeaving };
}

function hAdminNewYearPreview_() {
  var p = newYearPlan_(), teachers = getConfig_().teachers || {}, missing = {};
  p.advance.forEach(function (x) { if (!(teachers[x.to] && teachers[x.to].length)) missing[x.to] = (missing[x.to] || 0) + 1; });
  return {
    from: p.from, to: p.to, advanceCount: p.advance.length, graduateCount: p.graduate.length, adultsLeavingCount: p.adultsLeaving.length,
    gradesWithoutTeacher: Object.keys(missing).map(function (g) { return { grade: g, children: missing[g] }; }),
    graduates: p.graduate.map(fullName_).slice(0, 200), unknown: p.unknown.map(function (k) { return fullName_(k) + ' (' + k.Grade + ')'; }),
    lastBackup: (db_().table('Backups').rows.slice(-1)[0] || {}).CreatedAt || ''
  };
}

function hAdminNewYearRun_(req, ctx) {
  var p = newYearPlan_();
  if (String(req.confirm || '') !== p.to) throw appError_('CONFIRM', 'Type ' + p.to + ' to confirm.');
  var backup = backupNow_(actorOf_(ctx), 'Before starting ' + p.to);
  var r = runNewYear_(p, actorOf_(ctx));
  r.backup = backup;
  return r;
}

/**
 * Moves everyone up once. Each child carries the target year in YearOp, so a run interrupted half way and then
 * started again moves only the children not yet moved; the school-year settings change last.
 */
function runNewYear_(p, actor) {
  requireLock_();
  var n = now_(), d = db_(), job = jobStart_('newyear', p.to), logs = [], changed = [];
  p.advance.forEach(function (x) {
    var k = x.kid, b = strip_(k);
    k.Grade = x.to; k.Teacher = ''; k.SchoolYear = p.to; k.YearOp = p.to; k.UpdatedAt = n.stamp; bump_(k);
    changed.push(k);
    logs.push({ actor: actor, action: 'Moved up a grade (new school year)', entity: 'Student', id: k.StudentID, before: b, after: k, note: p.from + ' → ' + p.to });
  });
  p.graduate.forEach(function (k) {
    var b = strip_(k);
    k.Status = 'Graduated'; k.YearOp = p.to; k.UpdatedAt = n.stamp; bump_(k);
    changed.push(k);
    logs.push({ actor: actor, action: 'Finished top grade (new school year)', entity: 'Student', id: k.StudentID, before: b, after: k, note: '' });
  });
  d.saveRows('Students', changed);
  var adults = p.adultsLeaving.map(function (a) {
    var b = strip_(a);
    a.Status = 'Inactive'; bumpAuth_(a); bump_(a);
    logs.push({ actor: actor, action: 'Deactivated (no children left at school)', entity: 'Adult', id: a.AdultID, before: b, after: a, note: '' });
    return a;
  });
  d.saveRows('Adults', adults);
  adults.forEach(function (a) { revokeSessionRows_(a.AdultID); revokeInvites_({ inviterId: a.AdultID }, 'No children left at school'); });
  logMany_(logs);
  var start = setting_('NextYearStart'), last = setting_('LastNewYear');
  if (setting_('SchoolYear') !== p.to) {
    setSetting_('SchoolYear', p.to);
    setSetting_('LastNewYear', n.date);
    if (isDate_(start) && (!last || last < start)) setSetting_('NextYearStart', addDays_(start, 364));
  }
  log_(actor, 'Started new school year', 'Settings', 'SchoolYear', p.from, p.to, p.advance.length + ' moved up, ' + p.graduate.length + ' finished, ' + adults.length + ' adult(s) deactivated');
  jobFinish_(job, 'OK', p.advance.length + '/' + p.graduate.length + '/' + adults.length);
  return { from: p.from, to: p.to, advanced: p.advance.length, graduated: p.graduate.length, adultsDeactivated: adults.length };
}

/* ---------- backups ---------- */

/**
 * A full copy of the System spreadsheet in the owner's Drive, recorded in the Backups tab. It holds the encrypted
 * contacts but not the keys: restoring it needs the recovery key too (see DEPLOYMENT_GUIDE.md, Restore).
 */
function backupNow_(actor, why) {
  requireLock_();
  SpreadsheetApp.flush();
  var ss = systemSs_(), n = now_();
  var name = (setting_('ShortName') || setting_('SchoolName') || 'School') + ' Check-In backup ' + n.stamp.slice(0, 16);
  var copy = ss.copy(name);
  var counts = {};
  ['Entries', 'Students', 'Adults', 'Links', 'Staff', 'ChangeLog'].forEach(function (t) { counts[t] = db_().table(t).rows.length; });
  var rec = { BackupID: newId_('Backups', 'K'), SpreadsheetID: copy.getId(), Name: name, CreatedAt: n.stamp, CreatedBy: actor.name + (actor.id ? ' (' + actor.id + ')' : ''), Version: VERSION, Counts: JSON.stringify(counts) };
  db_().append('Backups', [rec]);
  log_(actor, 'Made a backup copy', 'Backup', rec.BackupID, '', JSON.stringify(counts), why || '');
  return { id: rec.BackupID, name: name, url: 'https://docs.google.com/spreadsheets/d/' + rec.SpreadsheetID + '/edit', counts: counts };
}

function hAdminBackup_(req, ctx) { return backupNow_(actorOf_(ctx), clean_(req.note, 120) || 'Made from the admin screen'); }

/* ---------- retention and holds ---------- */

function heldIds_() {
  var held = {};
  db_().where('Holds', function (h) { return h.Status === 'Active'; }).forEach(function (h) { held[h.EntityKind + ':' + h.EntityID] = true; });
  return held;
}

/** What retention would remove today, by the school's settings, minus anything on hold. Nothing is changed. */
function retentionPlan_() {
  var s = getConfig_().settings, today = now_().date, held = heldIds_(), d = db_();
  var keepEntries = Number(s.RetainEntriesDays) || 0, keepNotes = Number(s.RetainNotesDays) || 0, house = Number(s.RetainHousekeepingDays) || 90;
  var entryCut = keepEntries ? addDays_(today, -keepEntries) : '', noteCut = keepNotes ? addDays_(today, -keepNotes) : '', houseCut = addDays_(today, -house);
  var isHeld = function (e) { return held['entry:' + e.EntryID] || held['student:' + e.StudentID]; };
  var entries = entryCut ? d.where('Entries', function (e) { return e.Date < entryCut && !isHeld(e) && e.Status !== 'REPORTED'; }) : [];
  var gone = {};
  entries.forEach(function (e) { gone[e.EntryID] = true; });
  var notes = noteCut ? d.where('Entries', function (e) { return e.Note && e.Date < noteCut && !gone[e.EntryID] && !isHeld(e); }) : [];
  var old = function (stamp) { return String(stamp).slice(0, 10) < houseCut; };
  return {
    cutoffs: { entries: entryCut, notes: noteCut, housekeeping: houseCut },
    entries: entries.map(function (e) { return e.EntryID; }), notes: notes.map(function (e) { return e.EntryID; }),
    invites: d.where('Invites', function (i) { return i.Status !== 'OPEN' && old(i.CreatedAt); }).map(function (i) { return i.InviteID; }),
    challenges: d.where('Challenges', function (c) { return c.Status !== 'OPEN' && old(c.CreatedAt); }).map(function (c) { return c.ChallengeID; }),
    operations: d.where('Operations', function (o) { return o.Status === 'DONE' && old(o.CreatedAt); }).map(function (o) { return o.OpID; }),
    reviews: d.where('Reviews', function (r) { return old(r.CreatedAt); }).map(function (r) { return r.ItemID; }),
    held: Object.keys(held).length
  };
}

function hAdminRetentionPlan_(req, ctx) {
  var plan = retentionPlan_(), n = now_();
  var counts = { entries: plan.entries.length, notes: plan.notes.length, invites: plan.invites.length, challenges: plan.challenges.length, operations: plan.operations.length, reviews: plan.reviews.length };
  var op = { OpID: newId_('Operations', 'O'), ActorID: ctx.staff.StaffID, Action: 'retention.plan', RequestKey: 'ret-' + randomCode_(12), Digest: '', Status: 'DONE',
    Plan: JSON.stringify({ cutoffs: plan.cutoffs, counts: counts }), Result: '', CreatedAt: n.stamp, UpdatedAt: n.stamp };
  db_().append('Operations', [op]);
  return { planId: op.OpID, cutoffs: plan.cutoffs, counts: counts, held: plan.held, policy: { entriesDays: setting_('RetainEntriesDays'), notesDays: setting_('RetainNotesDays'), housekeepingDays: setting_('RetainHousekeepingDays') } };
}

/** Applies a dry run made in the last hour, after a backup, with the same cutoffs. Each tab is rewritten by a verified swap. */
function hAdminRetentionApply_(req, ctx) {
  var d = db_(), op = d.byId('Operations', String(req.planId || ''));
  if (!op || op.Action !== 'retention.plan' || op.ActorID !== ctx.staff.StaffID) throw appError_('BAD_INPUT', 'Make a dry run first.');
  if (Date.now() - Date.parse(String(op.CreatedAt).replace(' ', 'T')) > 3600000 && !isNaN(Date.parse(String(op.CreatedAt).replace(' ', 'T')))) throw appError_('EXPIRED', 'That dry run is more than an hour old. Make a new one.');
  if (op.Result) throw appError_('BAD_INPUT', 'That dry run was already applied.');
  var saved = JSON.parse(op.Plan), plan = retentionPlan_();
  if (JSON.stringify(plan.cutoffs) !== JSON.stringify(saved.cutoffs)) throw appError_('CONFLICT', 'The retention settings or the date changed. Make a new dry run.');
  var backup = backupNow_(actorOf_(ctx), 'Before applying retention');
  var drop = function (table, ids) {
    if (!ids.length) return 0;
    var gone = {}; ids.forEach(function (id) { gone[id] = true; });
    var f = ID_FIELD[table];
    var keep = d.table(table).rows.filter(function (r) { return !gone[r[f]]; });
    d.replaceTable(table, keep);
    return ids.length;
  };
  var noteRows = plan.notes.map(function (id) { return d.byId('Entries', id); }).filter(Boolean);
  noteRows.forEach(function (e) { e.Note = ''; e.Flags = clean_((e.Flags ? e.Flags + '; ' : '') + 'Note removed by retention ' + now_().date, 200); bump_(e); });
  d.saveRows('Entries', noteRows);
  var out = { entries: drop('Entries', plan.entries), notes: noteRows.length, invites: drop('Invites', plan.invites), challenges: drop('Challenges', plan.challenges),
    operations: drop('Operations', plan.operations.filter(function (id) { return id !== op.OpID; })), reviews: drop('Reviews', plan.reviews) };
  db_().tables = {};
  var op2 = db_().byId('Operations', op.OpID);
  op2.Result = JSON.stringify(out); op2.UpdatedAt = now_().stamp;
  db_().save('Operations', op2);
  log_(actorOf_(ctx), 'Applied retention', 'System', op.OpID, JSON.stringify(saved.counts), JSON.stringify(out), 'Policy days: entries ' + setting_('RetainEntriesDays') + ', notes ' + setting_('RetainNotesDays') + ', housekeeping ' + setting_('RetainHousekeepingDays') + '; backup ' + backup.id);
  props_().setProperty('VIEW_DIRTY', '1');
  return { applied: out, backup: backup };
}

/** Places or releases a hold that keeps records out of retention (a records request, an incident, a dispute). */
function hAdminHold_(req, ctx) {
  var n = now_();
  if (req.release) {
    var h = db_().byId('Holds', String(req.release));
    if (!h) throw appError_('NOT_FOUND', 'Hold not found.');
    h.Status = 'Released'; h.ReleasedAt = n.stamp; h.ReleasedBy = ctx.staff.Name;
    db_().save('Holds', h);
    log_(actorOf_(ctx), 'Released hold', 'Hold', h.HoldID, '', '', h.EntityKind + ' ' + h.EntityID);
    return hAdminGet_(req, ctx);
  }
  var kind = String(req.kind || ''), id = String(req.id || ''), reason = clean_(req.reason, 200);
  var table = kind === 'student' ? 'Students' : kind === 'entry' ? 'Entries' : kind === 'adult' ? 'Adults' : '';
  if (!table || !db_().byId(table, id)) throw appError_('NOT_FOUND', 'Choose a student, adult or entry that exists.');
  if (!reason) throw appError_('BAD_INPUT', 'Write the reason for the hold.');
  var rec = { HoldID: newId_('Holds', 'H'), EntityKind: kind, EntityID: id, Reason: reason, PlacedBy: ctx.staff.Name, PlacedAt: n.stamp, Status: 'Active', ReleasedAt: '', ReleasedBy: '' };
  db_().append('Holds', [rec]);
  log_(actorOf_(ctx), 'Placed hold', 'Hold', rec.HoldID, '', rec, '');
  return hAdminGet_(req, ctx);
}

/* ============================================================================
 * Office View sheet: a read-only copy for the Site Manager
 *
 * The View is rebuilt completely from the System on every sync (a staged tab is written, its row count checked,
 * then swapped in), so a changed name, an extra row or a duplicate in the View never survives a sync; how many
 * such differences were overwritten is recorded. It shows the last ViewDays days plus future absences, and leaves
 * family notes out unless ViewNotes is Yes. Access is managed by the app: the Site Manager gets Viewer access by
 * default, and a former Site Manager's app-granted access is removed when the setting changes.
 * ========================================================================== */

var VIEW_HEADERS = ['Date', 'Student', 'Grade', 'Teacher', 'Type', 'Time', 'Reason', 'Comment', 'Reported by', 'Relationship', 'Submitted', 'Status', 'Review', 'Location', 'Entry ID'];
var VIEW_ID_COL = 15;

function viewSs_() {
  var id = setting_('ViewSheetId');
  if (!id) return null;
  try { return SpreadsheetApp.openById(id); } catch (e) { console.error('View sheet not reachable: ' + e); return null; }
}

function mdY_(dateStr) {
  var p = String(dateStr || '').split('-');
  return p.length === 3 ? Number(p[1]) + '/' + Number(p[2]) + '/' + p[0] : '';
}

/** One View row. The Review column shows the CURRENT state, the same function the board uses. */
function viewRow_(e, showNotes) {
  var reason = e.Reason === 'Other' ? (showNotes ? e.Note : 'Other (see the app)') : e.Reason;
  var reporter = withRel_(e.Reporter, e.ReporterKind === 'Adult' ? e.Relationship : '');
  var submittedTime = time12_(String(e.ReceivedAt || e.CreatedAt).slice(11, 16));
  var left = e.Type === 'EARLY' && e.Status === 'PICKED_UP' && e.StatusAt ? time12_(String(e.StatusAt).slice(11, 16)) : '';
  var timeCol = e.Type === 'TARDY' ? time12_(e.Time) : e.Type === 'EARLY' ? (left || time12_(e.Time)) : '';
  var comment;
  if (e.Type === 'EARLY') comment = reason + ' – signed out ' + time12_(e.Time) + ' by ' + reporter + (left ? ' – left ' + left : '');
  else if (e.Type === 'ABSENT') comment = reason + ' – reported by ' + reporter + ' on ' + mdY_(String(e.ReceivedAt || e.CreatedAt).slice(0, 10)).replace(/\/\d{4}$/, '') + ' ' + submittedTime;
  else comment = reason + ' – arrived ' + time12_(e.Time) + (e.MinutesLate !== '' && e.MinutesLate !== undefined ? ', ' + e.MinutesLate + ' min late' : '') + ' – reported by ' + reporter;
  var status = STATUS_LABEL[e.Status] || e.Status;
  if (e.Status === 'VOIDED' && e.VoidReason) status += ' (' + e.VoidReason + ')';
  var au = e.ReporterKind === 'Adult' ? authority_(e.ReporterID, e.StudentID, e.Type === 'EARLY' ? 'release' : 'report:' + e.Type) : { state: 'DENIED', reasons: ['OTHER_ADULT'] };
  var review = au.state === 'AUTHORIZED' ? 'Approved' : e.ReporterKind === 'Adult' ? 'Pending: ' + au.reasons.map(function (r) { return AUTH_REASON_TEXT[r] || r; }).join(', ') : 'Office entry';
  if (e.Status === 'PICKED_UP' && e.ReleaseCheck) review = RELEASE_CHECKS[e.ReleaseCheck] + (e.ReleaseCheck === 'EXCEPTION' ? ' (exception)' : '') + ' · ' + review;
  return [
    mdY_(e.Date), e.Student, e.Grade, e.Teacher, TYPE_LABEL[e.Type] || e.Type, timeCol, reason, comment,
    e.Reporter, e.ReporterKind === 'Adult' ? e.Relationship : 'Office entry', mdY_(String(e.ReceivedAt || e.CreatedAt).slice(0, 10)) + ' ' + submittedTime,
    status, review, e.Location || '', e.EntryID
  ].map(guardCell_);
}

function viewEntries_() {
  var today = now_().date, from = addDays_(today, -(Number(setting_('ViewDays')) || 30));
  return db_().where('Entries', function (e) { return e.Date >= from; })
    .sort(function (a, b) { return (a.Date + (a.ReceivedAt || a.CreatedAt) + a.EntryID).localeCompare(b.Date + (b.ReceivedAt || b.CreatedAt) + b.EntryID); });
}

/** Replaces one tab of the View with new values through a verified staging tab. Returns what the old tab had. */
function swapViewTab_(ss, name, values, headerRow, prepare) {
  var stagingName = name + ' (new)', leftover = ss.getSheetByName(stagingName);
  if (leftover) ss.deleteSheet(leftover);
  var st = ss.insertSheet(stagingName), cols = VIEW_HEADERS.length;
  var need = headerRow + values.length;
  if (st.getMaxRows() < need) st.insertRowsAfter(st.getMaxRows(), need - st.getMaxRows() + 20);
  st.getRange(1, 1, Math.max(1, st.getMaxRows()), cols).setNumberFormat('@');
  if (prepare) prepare(st);
  st.getRange(headerRow, 1, 1, cols).setValues([VIEW_HEADERS]).setFontWeight('bold').setBackground('#eef1f6');
  st.setFrozenRows(headerRow);
  if (values.length) st.getRange(headerRow + 1, 1, values.length, cols).setValues(values);
  SpreadsheetApp.flush();
  if (st.getLastRow() !== headerRow + values.length && !(values.length === 0 && st.getLastRow() <= headerRow)) {
    ss.deleteSheet(st);
    throw appError_('WRITE_CHECK', 'The Office View could not be verified. The previous copy was kept.');
  }
  var cur = ss.getSheetByName(name), old = [];
  if (cur) {
    var last = cur.getLastRow();
    if (last > headerRow) old = cur.getRange(headerRow + 1, 1, last - headerRow, cols).getValues().map(function (r) { return r.map(String); });
    cur.setName(name + ' (old)');
  }
  st.setName(name);
  if (cur) ss.deleteSheet(cur);
  var widths = [88, 150, 54, 110, 104, 78, 190, 360, 140, 110, 150, 120, 220, 200, 150];
  for (var i = 0; i < widths.length; i++) st.setColumnWidth(i + 1, widths[i]);
  return old;
}

/** Rebuilds the whole View. Counts the rows that had been changed, added or duplicated by hand and were put right. */
function rebuildView_() {
  requireLock_();
  var ss = viewSs_();
  if (!ss) return { ok: false, reason: 'No Office View sheet yet' };
  var showNotes = setting_('ViewNotes') === 'Yes';
  var rows = viewEntries_().map(function (e) { return viewRow_(e, showNotes); });
  var old = swapViewTab_(ss, 'All Entries', rows, 1);
  var want = {};
  rows.forEach(function (r) { want[r[VIEW_ID_COL - 1]] = r.map(function (v) { return String(v).charAt(0) === "'" ? String(v).slice(1) : String(v); }).join('\u0001'); });
  var seen = {}, altered = 0, orphans = 0, duplicates = 0;
  old.forEach(function (r) {
    var id = r[VIEW_ID_COL - 1];
    if (seen[id]) { duplicates++; return; }
    seen[id] = true;
    if (!want.hasOwnProperty(id)) orphans++;
    else if (want[id] !== r.join('\u0001')) altered++;
  });
  rebuildToday_(ss);
  props_().deleteProperty('VIEW_DIRTY');
  return { ok: true, rows: rows.length, altered: altered, orphans: orphans, duplicates: duplicates };
}

function rebuildToday_(ss) {
  var n = now_(), s = getConfig_().settings, showNotes = s.ViewNotes === 'Yes';
  var order = { TARDY: 0, EARLY: 1, ABSENT: 2 };
  var rows = db_().where('Entries', function (e) { return e.Date === n.date && e.Status !== 'VOIDED'; });
  rows.sort(function (a, b) { return (order[a.Type] - order[b.Type]) || String(a.Time).localeCompare(String(b.Time)) || a.Student.localeCompare(b.Student); });
  var values = rows.map(function (e) { return viewRow_(e, showNotes); });
  var d = new Date(Date.UTC(Number(n.date.slice(0, 4)), Number(n.date.slice(5, 7)) - 1, Number(n.date.slice(8, 10)), 12));
  swapViewTab_(ss, 'Today', values, 4, function (st) {
    st.getRange(1, 2).setValue(guardCell_((s.SchoolName || 'School') + ' – Today')).setFontSize(14).setFontWeight('bold');

/**
 * Makes the View's sharing match the settings: the Site Manager (if set) with ViewAccessRole; any access this app
 * granted earlier to someone else is removed. Access granted by hand in Drive is not touched, but the system check
 * lists it. Failures are recorded, never hidden.
 */
function reconcileViewAccess_(actor) {
  requireLock_();
  var ss = viewSs_();
  if (!ss) return { ok: false };
  var want = normEmail_(setting_('SiteManagerEmail')), role = setting_('ViewAccessRole') === 'Editor' ? 'Editor' : 'Viewer', n = now_();
  var rows = db_().table('ViewAccess').rows, changed = [], added = [], logs = [];
  rows.filter(function (r) { return r.Status === 'Active' && (r.Email !== want || r.Role !== role); }).forEach(function (r) {
    try {
      if (r.Role === 'Editor') ss.removeEditor(r.Email); else ss.removeViewer(r.Email);
      r.Status = 'Revoked'; r.RevokedAt = n.stamp; r.Note = '';
      logs.push({ actor: actor, action: 'Removed Office View access', entity: 'View', id: r.Email, note: r.Role });
    } catch (e) { r.Note = clean_('Could not remove: ' + e, 200); }
    changed.push(r);
  });
  db_().saveRows('ViewAccess', changed);
  if (want && !rows.some(function (r) { return r.Status === 'Active' && r.Email === want && r.Role === role; })) {
    var rec = { Email: want, Role: role, GrantedAt: n.stamp, GrantedBy: actor.name, Status: 'Active', RevokedAt: '', Note: '' };
    try {
      if (role === 'Editor') ss.addEditor(want); else ss.addViewer(want);
      logs.push({ actor: actor, action: 'Gave Office View access', entity: 'View', id: want, note: role });
    } catch (e) { rec.Status = 'Failed'; rec.Note = clean_('Could not share: ' + e, 200); }
    added.push(rec);
  }
  db_().append('ViewAccess', added);
  logMany_(logs);
  return { ok: true, removed: changed.filter(function (r) { return r.Status === 'Revoked'; }).length, added: added.filter(function (r) { return r.Status === 'Active'; }).length };
}

function hAdminRebuildView_(req, ctx) {

}

/* ============================================================================
 * Scheduled jobs. Every run is recorded in the Jobs tab (started, finished, OK / PARTIAL / FAILED, what it did),
 * so the system check can show a job that stopped running or keeps failing.
 * ========================================================================== */

function jobStart_(kind, cursor) {
  requireLock_();
  var j = { JobID: 'J-' + randomCode_(10), Kind: kind, StartedAt: now_().stamp, FinishedAt: '', Status: 'RUNNING', Cursor: cursor || '', Processed: '', Expected: '', Message: '' };
  db_().append('Jobs', [j]);
  return j;
}

function jobFinish_(j, status, message, processed) {
  j.FinishedAt = clockAt_(Date.now()).stamp; j.Status = status; j.Message = clean_(message, 1000);
  if (processed !== undefined) j.Processed = String(processed);
  db_().save('Jobs', j);
}

function jobRecord_(kind, status, message) { var j = jobStart_(kind); jobFinish_(j, status, message); return j; }

function minutesSince_(stamp) {
  var t = Date.parse(String(stamp || '').replace(' ', 'T'));
  return isFinite(t) ? (Date.now() - t) / 60000 : Infinity;
}

function installTriggers_() {
  var have = {};
  ScriptApp.getProjectTriggers().forEach(function (t) {
    var fn = t.getHandlerFunction();
    if (have[fn] && ScriptApp.deleteTrigger) ScriptApp.deleteTrigger(t);
    have[fn] = true;
  });
  if (!have.syncTick) ScriptApp.newTrigger('syncTick').timeBased().everyMinutes(15).create();
  if (!have.nightly) ScriptApp.newTrigger('nightly').timeBased().everyDays(1).atHour(2).create();
}

/** Every 15 minutes: rebuild the Office View when something changed (and at least hourly, to undo edits made in it). */
function syncTick() {
  resetRequestState_();
  try {
    withLock_(function () {
      ensureReady_();
      var job = jobStart_('sync');
      try {
        var ext = demoExt_();
        if (ext && ext.syncTopUp) ext.syncTopUp();
        var lastView = db_().where('Jobs', function (j) { return j.Kind === 'view' && j.Status === 'OK'; }).pop();
        var due = props_().getProperty('VIEW_DIRTY') === '1' || !lastView || minutesSince_(lastView.FinishedAt) >= 55;
        var r = { skipped: true };
        if (due && viewSs_()) {
          r = rebuildView_();
          jobRecord_('view', r.ok ? 'OK' : 'FAILED', JSON.stringify(r));
        }
        jobFinish_(job, r.ok === false ? 'PARTIAL' : 'OK', JSON.stringify(r));
      } catch (e) {
        jobFinish_(job, 'FAILED', (e && e.message) || String(e));
        throw e;
      }
    }, 20000);
    bumpData_();
  } catch (e) {
    console.error('syncTick: ' + ((e && e.stack) || e));
  }
}

/**
 * Nightly: flags tardies and early releases the office never closed (all of them, from the complete tab),
 * expires codes, invites and reviews, tidies old sign-ins and job rows, starts the new year when the school
 * turned that on, writes a change-log checkpoint and rebuilds the Office View.
 */
function nightly() {
  resetRequestState_();
  var anchor = null;
  try {
    withLock_(function () {
      ensureReady_();
      var job = jobStart_('nightly'), out = {};
      try {
        var n = now_(), d = db_(), actor = { name: 'System (nightly)', type: 'System', id: 'SYSTEM' };
        var stale = d.where('Entries', function (e) { return e.Date < n.date && e.Status === 'REPORTED' && (e.Type === 'TARDY' || e.Type === 'EARLY'); });
        stale.forEach(function (e) { e.Status = e.Type === 'TARDY' ? 'NOT_CHECKED_IN' : 'NOT_PICKED_UP'; e.StatusAt = n.stamp; e.StatusBy = 'System'; e.StatusByID = 'SYSTEM'; bump_(e); });
        d.saveRows('Entries', stale);
        out.flagged = stale.length;
        if (stale.length) log_(actor, 'Flagged entries the office never closed', 'Entry', '', '', '', stale.length + ' entr' + (stale.length === 1 ? 'y' : 'ies'));
        var expire = function (table, test, status) { var rows = d.where(table, test); rows.forEach(function (r) { r.Status = status; }); d.saveRows(table, rows); return rows.length; };
        out.invites = expire('Invites', function (i) { return i.Status === 'OPEN' && !(Number(i.ExpiresAt) > n.ms); }, 'EXPIRED');
        out.codes = expire('Challenges', function (c) { return c.Status === 'OPEN' && !(Number(c.ExpiresAt) > n.ms); }, 'EXPIRED');
        out.reviews = expire('Reviews', function (r) { return r.Status === 'OPEN' && !(Number(r.ExpiresAt) > n.ms); }, 'EXPIRED');
        var cutoff = n.ms - 7 * 864e5, sessions = d.table('Sessions').rows;
        var keep = sessions.filter(function (r) { return !(Number(r.ExpiresAt) < cutoff || (r.Revoked === 'Y' && Number(r.ExpiresAt) < n.ms)); });
        if (keep.length !== sessions.length) { d.replaceTable('Sessions', keep); out.sessionsRemoved = sessions.length - keep.length; }
        var jobs = d.table('Jobs').rows, jobCut = addDays_(n.date, -30);
        if (jobs.length > 3000) {
          d.replaceTable('Jobs', jobs.filter(function (j) { return j === job || String(j.StartedAt).slice(0, 10) >= jobCut || (j.Kind !== 'sync' && j.Kind !== 'view'); }));
          d.tables.Jobs = null;
        }
        var s = getConfig_().settings;
        if (s.AutoNewYear === 'Yes' && isDate_(s.NextYearStart) && n.date >= s.NextYearStart && (!s.LastNewYear || s.LastNewYear < s.NextYearStart)) {
          backupNow_(actor, 'Before the automatic new school year');
          out.newYear = runNewYear_(newYearPlan_(), actor);
        }
        var chain = verifyLogChain_();
        out.logChain = chain.ok ? 'ok' : 'BROKEN at ' + chain.breakAt;
        anchor = { ok: chain.ok, seq: chain.lastSeq || 0, digest: chain.lastDigest || '', date: n.date, breakAt: chain.breakAt || null };
        if (viewSs_()) { var v = rebuildView_(); jobRecord_('view', v.ok ? 'OK' : 'FAILED', JSON.stringify(v)); out.view = v; }
        jobFinish_(job, chain.ok ? 'OK' : 'PARTIAL', JSON.stringify(out));
      } catch (e) {
        jobFinish_(job, 'FAILED', (e && e.message) || String(e));
        throw e;
      }
    }, 30000);
    bumpData_();
  } catch (e) {
    console.error('nightly: ' + ((e && e.stack) || e));
  }
  if (anchor) sendLogAnchor_(anchor);
}

/** Sends the change-log checkpoint to the separately controlled mailbox, if the school set one. */
function sendLogAnchor_(anchor) {
  try {
    var to = setting_('AuditAnchorEmail');
    if (!to) return;
    sendMail_(to, 'Check-In change log checkpoint ' + anchor.date,
      '<p>Change log checkpoint for ' + escHtml_(anchor.date) + '.</p><p>Rows: ' + anchor.seq + '<br>Digest: <code>' + escHtml_(anchor.digest) + '</code></p>' +
      (anchor.ok ? '<p>The chain checked out.</p>' : '<p><b>The chain is broken at row ' + escHtml_(anchor.breakAt) + '.</b> Someone changed or removed change-log rows. Tell the school\'s administrator.</p>') +
      '<p>Keep these emails. If the log is ever disputed, these checkpoints show what it said on each night.</p>');
  } catch (e) { console.error('anchor mail: ' + e); }
}

/** Binds the active spreadsheet as the System (or checks it already is), then sets everything up inside the lock. */
function setupCore_(opts) {
  opts = opts || {};
  resetRequestState_();
  var active = SpreadsheetApp.getActive();
  if (!active) throw new Error('This script is not attached to a Google Sheet. Open the System sheet, choose Extensions > Apps Script from there, and run setup in that project.');
  var p = props_(), bound = p.getProperty('SYSTEM_ID');
  if (bound && bound !== active.getId()) {
    throw new Error('This script is already set up for another spreadsheet. If this sheet is a restored copy, use School Check-In > Use this copy as the System.');
  }
  if (!bound) p.setProperty('SYSTEM_ID', active.getId());
  return withLock_(function () {
    var ss = systemSs_();
    ensureTabs_(ss);
    resetRequestState_();
    ensureSettingsRows_();
    if (!setting_('SystemId')) setSetting_('SystemId', ss.getId());
    checkSystemIdentity_();
    var wasEmpty = systemEmptyForKeys_();
    // A new system takes the school's time zone from the script project (appsscript.json), so dates and timers agree.
    var stz = scriptTimeZone_();
    if (wasEmpty && stz && stz !== setting_('TimeZone')) setSetting_('TimeZone', stz);
    if (opts.environment === 'DEMO') {
      if (environment_() !== 'DEMO' && !wasEmpty) throw appError_('NOT_EMPTY', 'A demo can only be set up in a new, empty spreadsheet.');
      if (environment_() !== 'DEMO') setSetting_('Environment', 'DEMO');
    }
    if (wasEmpty) createKeysIfEmpty_();
    if (Number(p.getProperty('SCHEMA') || 0) < SCHEMA_VERSION) {
      if (wasEmpty) { p.setProperty('SCHEMA', String(SCHEMA_VERSION)); setSetting_('SchemaVersion', String(SCHEMA_VERSION)); }
      else upgrade_();
    } else if (!wasEmpty) {
      upgradeEntries_();   // numbers entry rows that lost their number (or share one) in a hand edit
    }
    checkKeys_();
    if (!db_().table('Reasons').rows.length) db_().append('Reasons', DEFAULT_REASONS.map(function (r, i) { return { Type: r[0], Key: r[1], English: r[2], Spanish: r[3], Order: String(i + 1), Active: 'Y' }; }));
    var firstAdmin = null;
    if (!db_().table('Staff').rows.length) {
      var pin = newStaffPin_(), n = now_();
      var rec = { StaffID: newId_('Staff', 'T'), Name: clean_(opts.adminName, 60) || 'Administrator', Login: 'admin', Role: 'Admin', Email: '', Active: 'Y',
        FailedAttempts: '0', LockedUntil: '', LockCount: '0', AuthVersion: '1', CreatedAt: n.stamp, Version: '1' };
      setPin_(rec, pin);
      db_().append('Staff', [rec]);
      p.setProperty('PENDING_ADMIN', seal_(JSON.stringify({ login: rec.Login, pin: pin }), 'Setup|PENDING_ADMIN|' + rec.StaffID));
      p.setProperty('PENDING_ADMIN_ID', rec.StaffID);
      firstAdmin = { login: rec.Login };
    }
    var actor = opts.actor || menuActorSafe_();
    if (!viewSs_() && opts.createView !== false) createViewSheet_();
    if (viewSs_()) { reconcileViewAccess_(actor); rebuildView_(); }
    if (opts.triggers !== false) installTriggers_();
    if (opts.protect !== false) protectTabs_();
    clearConfigCache_();
    log_(actor, 'Ran setup', 'System', '', '', '', 'Version ' + VERSION + ', environment ' + environment_());
    jobRecord_('setup', 'OK', 'Version ' + VERSION);
    var v = viewSs_();
    return { firstAdmin: firstAdmin, viewUrl: v ? v.getUrl() : '', environment: environment_() };
  });
}

  one(nth(Y1, 2, 1, 3), 'Presidents\' Day');
  var spring = lastOf(Y1, 3, 1);
  closed(spring, addDays_(spring, 4), 'Spring break');
  one(lastOf(Y1, 5, 1), 'Memorial Day');
  return out;
}

/** The school year (its first calendar year) that a date belongs to: August to July. */
function demoYearOf_(date) { var y = Number(date.slice(0, 4)), m = Number(date.slice(5, 7)); return m >= 8 ? y : y - 1; }

/**
 * School settings, teachers and calendar for the demo. Settings are set the first time only (a presenter's changes
 * stay through a reset); holidays are added for the reference's school year where a date is not in the calendar yet.
 */
function demoConfigure_(refMs) {
  var ref = clockAt_(refMs), Y = demoYearOf_(ref.date);
  var label = Y + '-' + String(Y + 1).slice(2);
  var aug = (Y + 1) + '-08-01', nextStart = addDays_(aug, (1 - dow_(aug) + 7) % 7 + 14);   // third Monday of August
  var first = !demoOption_('DemoConfigured');
  var settings = {
    SchoolName: 'Demo Elementary School', ShortName: 'Demo Elementary', OfficePhone: '(555) 010-0100', SchoolYear: label, NextYearStart: nextStart,
    BellStart: '08:15', BellEnd: '14:55', ShortDays: 'Wed', ShortDayEnd: '12:45', AccentColor: '#2F6B4F', AbsenceReports: 'Yes'
  };
  var changed = 0;
  Object.keys(settings).forEach(function (k) {
    if (first || !setting_(k) || (k === 'SchoolName' && setting_(k) !== settings[k])) { setSetting_(k, settings[k]); changed++; }
  });
  if (first) { setSetting_('DemoAnywhere', 'Yes'); setSetting_('DemoConfigured', DEMO_SEED_VERSION); }
  var d = db_();
  if (!d.table('Teachers').rows.length) {
    d.append('Teachers', [['K', 'Ms. Alvarez', 'Y'], ['1', 'Mr. Brooks', 'Y'], ['2', 'Ms. Chen', 'Y'], ['3', 'Mr. Daniels', 'Y'], ['4', 'Mr. Ford', 'N'], ['5', 'Ms. Evans', 'Y']]
      .map(function (t) { return { Grade: t[0], Teacher: t[1], Active: t[2] }; }));
    changed++;
  }
  var have = {};
  d.table('Calendar').rows.forEach(function (r) { have[String(r.Date)] = true; });
  var cal = demoHolidays_(Y);
  if (ref.date.slice(5, 7) === '07' || ref.date.slice(5, 7) === '06') cal = cal.concat(demoHolidays_(Y + 1));
  // One extra school day on a Saturday (an example of an OPEN day), clear of any break.
  var mon = addDays_(ref.date, -((dow_(ref.date) + 6) % 7)), sat = addDays_(mon, 12), busy = {};
  cal.forEach(function (c) { busy[c[0]] = true; });
  for (var i = 0; i < 6 && (busy[addDays_(sat, -1)] || busy[addDays_(sat, 2)]); i++) sat = addDays_(sat, 7);
  cal.push([sat, 'OPEN', 'Family Science Saturday', '']);
  var rows = cal.filter(function (c) { if (have[c[0]]) return false; have[c[0]] = true; return true; })
    .map(function (c) { return { Date: c[0], Kind: c[1], Label: c[2], EndTime: c[3] }; });
  if (rows.length) { d.append('Calendar', rows); changed++; }
  clearConfigCache_();
  resetRequestState_();
  return changed;
}

/* ---------- seed ---------- */

/**
 * Loads the demo data. Safe to run again, and safe after a run that stopped half way: provenance (the Fixtures row)
 * is written before each record, and a record whose ID already exists is left as it is.
 * opts.reference: the moment the demo is built around (milliseconds); defaults to now.
 */
function seedDemo_(opts) {
  opts = opts || {};
  demoTabs_();
  return withLock_(function () {
    requireDemo_();
    ensureTabs_(systemSs_());
    resetRequestState_();
    var refMs = Number(opts.reference) || Date.now();
    demoConfigure_(refMs);
    var plan = demoPlan_(refMs), d = db_(), n = now_();
    // 1. provenance first
    var fx = {};
    d.table('Fixtures').rows.forEach(function (f) { fx[f.FixtureID] = true; });
    var prov = [];
    plan.records.forEach(function (r) {
      var fid = demoId_('F', r.tab + '|' + r.id);
      if (!fx[fid]) { fx[fid] = true; prov.push({ FixtureID: fid, Tab: r.tab, EntityID: r.id, ScenarioID: r.scenario, SeedVersion: DEMO_SEED_VERSION, SeededAt: n.stamp }); }
    });
    d.append('Fixtures', prov);
    // 2. records, tab by tab, skipping any that exist
    var created = 0, existing = 0, order = ['Staff', 'Adults', 'Students', 'Links', 'Invites', 'Challenges', 'DemoInbox', 'Devices', 'Sessions', 'Entries'];
    order.forEach(function (tab) {
      var mine = plan.records.filter(function (r) { return r.tab === tab; });
      if (!mine.length) return;
      var have = {}, idf = ID_FIELD[tab];
      d.table(tab).rows.forEach(function (row) { have[String(row[idf])] = true; });
      var rows = [];
      mine.forEach(function (r) { if (have[r.id]) existing++; else { have[r.id] = true; rows.push(r.row); } });
      d.append(tab, rows);
      d.tables[tab] = null;
      created += rows.length;
    });
    if (created) log_({ name: 'Demo seed', type: 'System', id: 'DEMO' }, 'Loaded demo data', 'System', '', '', '', created + ' record(s) for reference day ' + plan.d0);
    setSetting_('DemoSeededAt', n.stamp);
    bumpData_();
    markViewDirty_();
    clearConfigCache_();
    return { created: created, existing: existing, reference: plan.d0, referenceStamp: plan.reference.stamp, todayNote: plan.todayNote };
  });
}

/* ---------- reset ---------- */

/**
 * Removes the demo's own rows and the rows that refer to them, and nothing else:
 *  - every row listed in Fixtures;
 *  - children added during the demo by a demo adult (their CreatedBy is that adult);
 *  - rows that refer to a demo adult, child or staff member: their permissions, entries they reported or that are
 *    about their children, sign-ins, codes, invites they made, retry records, roster checks, day closes,
 *    iPads a demo staff member registered, and holds on removed records;
 *  - the demo inbox.
 * The change log is never rewritten; the reset is added to it. Settings, teachers, reasons and the calendar stay.
 * opts.reseed: load the demo again afterwards (opts.reference as for seedDemo_).
 */
function resetDemo_(opts) {
  opts = opts || {};
  demoTabs_();
  var out = withLock_(function () {
    requireDemo_();
    ensureTabs_(systemSs_());
    resetRequestState_();
    var d = db_(), ids = {};
    d.table('Fixtures').rows.forEach(function (f) { (ids[f.Tab] = ids[f.Tab] || {})[String(f.EntityID)] = true; });
    var of = function (tab) { return ids[tab] || {}; };
    var A = of('Adults'), S = of('Students'), T = of('Staff');
    d.table('Students').rows.forEach(function (k) { if (A[k.CreatedBy]) S[k.StudentID] = true; });
    var staffIdIn = function (s) { var m = /\(([^()]+)\)\s*$/.exec(String(s || '')); return m ? m[1] : ''; };
    var removedEntries = {};
    var rules = {
      Entries: function (e) { var gone = of('Entries')[e.EntryID] || S[e.StudentID] || A[e.ReporterID]; if (gone) removedEntries[e.EntryID] = true; return gone; },
      Links: function (l) { return of('Links')[l.LinkID] || A[l.AdultID] || S[l.StudentID]; },
      Students: function (k) { return S[k.StudentID]; },
      Adults: function (a) { return A[a.AdultID]; },
      Staff: function (s) { return T[s.StaffID]; },
      Invites: function (i) { return of('Invites')[i.InviteID] || A[i.InviterID] || list_(i.StudentIDs).some(function (sid) { return S[sid]; }); },
      Challenges: function (c) { return of('Challenges')[c.ChallengeID] || A[c.AdultID]; },
      Sessions: function (s) { return of('Sessions')[s.TokenHash] || A[s.SubjectID] || T[s.SubjectID]; },
      Devices: function (v) { return of('Devices')[v.DeviceID] || T[staffIdIn(v.CreatedBy)]; },
      Operations: function (o) { return A[o.ActorID] || T[o.ActorID]; },
      Reviews: function (r) { return T[r.StaffID]; },
      DayClose: function (x) { return T[x.ClosedByID]; },
      Holds: function (h) { return (h.EntityKind === 'entry' && removedEntries[h.EntityID]) || (h.EntityKind === 'student' && S[h.EntityID]); },
      DemoInbox: function () { return true; },
      Fixtures: function () { return true; }
    };
    var removed = 0, kept = 0, byTab = {};
    ['Entries', 'Links', 'Students', 'Adults', 'Staff', 'Invites', 'Challenges', 'Sessions', 'Devices', 'Operations', 'Reviews', 'DayClose', 'Holds', 'DemoInbox', 'Fixtures']
      .forEach(function (tab) {
        var rows = d.table(tab).rows, keep = rows.filter(function (r) { return !rules[tab](r); });
        var gone = rows.length - keep.length;
        if (tab !== 'DemoInbox' && tab !== 'Fixtures') kept += keep.length;
        if (gone) { d.replaceTable(tab, keep); removed += gone; byTab[tab] = gone; }
      });
    log_({ name: 'Demo reset', type: 'System', id: 'DEMO' }, 'Reset demo data', 'System', '', '', JSON.stringify(byTab), removed + ' row(s) removed; ' + kept + ' row(s) not made by the demo kept');
    bumpData_();
    markViewDirty_();
    return { removed: removed, kept: kept, byTab: byTab };
  });
  if (opts.reseed) out.seed = seedDemo_({ reference: opts.reference });
  return out;
}

/** What the local demo's panel and the tests read: the demo inbox, newest first. */
function demoInbox_() {
  demoTabs_();
  resetRequestState_();
  if (!systemSs_().getSheetByName('DemoInbox')) return [];
  // Newest first: by time, and for the same second, the row written last.
  return db_().table('DemoInbox').rows.map(function (m, i) { return { i: i, at: String(m.At), to: m.To, subject: m.Subject, text: m.Text }; })
    .sort(function (a, b) { return b.at.localeCompare(a.at) || b.i - a.i; })
    .map(function (m) { return { at: m.at, to: m.to, subject: m.subject, text: m.text }; });
}

<script>// Local demo bridge. Runs the real backend (Code.gs and Demo.gs, loaded just before this file) inside the page, on the
// in-memory Apps Script stand-in (gas-mock.js), with a demo clock. The page's requests to /demo-api are answered here;
// nothing leaves the browser. Only built into dist/demo.html, never into the production page.
(function () {
  'use strict';
  var STORE = 'sci-demo-db-v3', CLOCK = 'sci-demo-clock-v3', PAGE_NS = 'sci:demo:';
  var REF = Date.parse(DEMO_REFERENCE);
  var RealDate = Date;

  function readJson(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function writeJson(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  /* ---------- demo clock: starts at the demo reference and runs at normal speed ---------- */
  var clock = readJson(CLOCK);
  if (!clock || !isFinite(clock.real) || !isFinite(clock.demo)) { clock = { real: RealDate.now(), demo: REF }; writeJson(CLOCK, clock); }
  function demoNow() { return clock.demo + (RealDate.now() - clock.real); }
  function FakeDate() {
    var a = Array.prototype.slice.call(arguments);
    if (!(this instanceof FakeDate)) return new RealDate(demoNow()).toString();
    if (!a.length) return new RealDate(demoNow());
    return new (Function.prototype.bind.apply(RealDate, [null].concat(a)))();
  }
  FakeDate.now = demoNow;
  FakeDate.UTC = RealDate.UTC;
  FakeDate.parse = RealDate.parse;
  FakeDate.prototype = RealDate.prototype;
  window.Date = FakeDate;

  /* ---------- storage: the whole demo system, saved once per request ---------- */
  var pending = null, storageOk = true;
  var env = GasMock.makeEnv({ now: demoNow, persist: { load: function () { return readJson(STORE); }, save: function (s) { pending = s; } } });
  function flush() { if (pending) { storageOk = writeJson(STORE, pending) && storageOk; pending = null; } }
  Object.keys(env).forEach(function (k) { if (/^[A-Z]/.test(k)) window[k] = env[k]; });
  function asUser(fn) { env.__activeContext = true; try { return fn(); } finally { env.__activeContext = null; } }

  if (!env.__store.props.SYSTEM_ID) {
    asUser(function () {
      demoTabs_();
      setupCore_({ adminName: 'Setup admin', environment: 'DEMO', triggers: false });
      seedDemo_({ reference: demoNow() });
    });
    flush();
  }

  /* ---------- the page's requests ---------- */
  var realFetch = window.fetch ? window.fetch.bind(window) : null;
  function answer(body) {
    var out;
    try {
      resetRequestState_();
      out = doPost({ postData: { contents: body || '{}' } }).getContent();
    } catch (e) {
      out = JSON.stringify({ ok: false, error: { code: 'DEMO_ERROR', message: 'The local demo hit an error: ' + (e && e.message || e) } });
    }
    flush();
    return out;
  }
  window.fetch = function (url, init) {
    var u = String(url && url.url ? url.url : url);
    if (u === '/demo-api' || /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?\/demo-api$/.test(u)) {
      var body = init && init.body ? String(init.body) : '{}';
      return new Promise(function (resolve) {
        setTimeout(function () { resolve(new Response(answer(body), { status: 200, headers: { 'Content-Type': 'application/json' } })); }, 90);
      });
    }
    return realFetch ? realFetch(url, init) : Promise.reject(new Error('No network in the local demo'));
  };

  /* ---------- what the demo panel uses ---------- */
  function clearPage() {
    try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf(PAGE_NS) === 0) localStorage.removeItem(k); }); } catch (e) { /* private window */ }
  }
  window.__DEMO__ = {
    reference: REF,
    now: demoNow,
    storageOk: function () { return storageOk; },
    inbox: function () { resetRequestState_(); return demoInbox_(); },
    staff: DEMO_STAFF.filter(function (s) { return !s.inactive; }).map(function (s) { return { name: s.name, login: s.login, role: s.role, pin: s.pin }; }),
    familyPin: DEMO_FAMILY_PIN,
    /** Starts over: new demo data built around the given moment (default: the demo reference), everyone signed out. */
    reset: function (refMs) {
      try { localStorage.removeItem(STORE); } catch (e) { /* ignore */ }
      writeJson(CLOCK, { real: RealDate.now(), demo: refMs || REF });
      clearPage();
      location.hash = '';
      location.reload();
    },
    /** Moves the clock forward (minutes), keeping the data. */
    advance: function (minutes) {
      clock = { real: RealDate.now(), demo: demoNow() + minutes * 60000 };
      writeJson(CLOCK, clock);
    }
  };
})();
</script>

/* ---------- QR codes, made on the device (no outside service sees the school's links) ----------
   Byte mode, error correction level M, versions 1 to 40, best mask by the standard penalty rules. */
const QR = (() => {
  const ECC_M = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const BLOCKS_M = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
  const rawModules = v => {

  if (S.kiosk && !opt.staff) payload.kioskKey = store.get('kioskKey', '');

function form(name, init) { return S.forms[name] || (S.forms[name] = init); }
function fieldInput(id, label, path, attrs, help) {
  const p = path.split('.'), v = (S.forms[p[0]] || {})[p[1]];
  const helpId = help ? id + '-help' : '';
  return `<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" data-f="${path}" value="${esc(v == null ? '' : v)}" ${helpId ? `aria-describedby="${helpId}"` : ''} ${attrs || ''}>${help ? `<span class="tiny muted" id="${helpId}">${help}</span>` : ''}</div>`;
}
function pinInput(id, label, path, current) {
  const p = path.split('.'), v = (S.forms[p[0]] || {})[p[1]];
  return `<div class="field"><label for="${id}">${label}</label><input class="input pin" id="${id}" data-f="${path}" value="${esc(v || '')}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="${pinMax()}" autocomplete="${current ? 'current-password' : 'new-password'}"></div>`;
}
function langBtn() { return `<button class="lang-btn" data-a="lang" lang="${S.lang === 'es' ? 'en' : 'es'}">${T('otherLang')}</button>`; }
function topBarOut() {
  return `<header class="topbar"><div class="wrap"><a class="brand" href="#home">${logoTag()}<span class="brand-name">${esc(schoolShort())} Check-In</span></a>${langBtn()}</div></header>`;
}
function errLine(f) { return f && f.error ? `<p class="error" role="alert">${esc(f.error)}</p>` : ''; }
function busyBtn(f, label, busyLabel, attrs) {
  return `<button class="btn block" ${attrs || 'type="submit"'} ${f && f.busy ? 'disabled aria-busy="true"' : ''}>${f && f.busy ? busyLabel : label}</button>`;
}
/** A request key for one submission, kept while the form is open so a retry after a lost reply is recognised. */
function requestKey(prefix) { return prefix + '-' + uid() + uid(); }

function WelcomeView() {
  const sc = S.cfg.school, f = form('login', { mode: 'phone', id: '', pin: '', remember: true });
  const email = f.mode === 'email';
  return `${topBarOut()}<main class="wrap main welcome">
  <div class="hero welcome-hero">${logoTag()}<h1>${esc(sc.name)}</h1><p class="muted">${T(absencesOn() ? 'tagline' : 'taglineNoAbs')}</p></div>
  <div class="welcome-form">
  <form class="stack" data-submit="login" novalidate>
    <div class="seg" role="group" aria-label="${T('signIn')}">
      <button type="button" data-a="login-mode" data-v="phone" aria-pressed="${!email}">${icon('phone', 18)} ${T('usePhone')}</button>
      <button type="button" data-a="login-mode" data-v="email" aria-pressed="${email}">${icon('mail', 18)} ${T('useEmail')}</button>
    </div>
    ${fieldInput('login-id', email ? T('emailLabel') : T('phoneLabel'), 'login.id', email ? 'type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false"' : 'type="tel" inputmode="tel" autocomplete="username"')}
    ${pinInput('login-pin', T('pinLabel'), 'login.pin', true)}
    <label class="check"><input type="checkbox" id="login-remember" data-f="login.remember" ${f.remember ? 'checked' : ''}> ${T('remember')}</label>
    ${errLine(f)}
    ${busyBtn(f, T('signIn'), T('signingIn'))}
  </form>
  <div class="stack" style="margin-top:14px">${sc.signupOpen === false ? `<p class="small muted">${T('signupClosed')}</p>` : `<a class="btn ghost block" href="#signup">${icon('plus', 20)} ${T('newFamily')}</a>`}</div>
  <div class="foot-links"><a class="link-btn" href="#forgot">${T('forgot')}</a><a class="link-btn" href="#office" lang="en">School staff</a></div>
  </div></main>`;
}
ACT['login-mode'] = el => { const f = form('login', {}); f.mode = el.dataset.v; f.id = ''; f.error = ''; render(); const i = $('#login-id'); if (i) i.focus(); };
ACT.login = async () => {
  const f = S.forms.login;
  if (f.busy) return;
  f.error = '';
  if (!String(f.id || '').trim()) { f.error = t('err_NEED_CONTACT'); render(); return; }
  if (!signInPinOk(f.pin)) { f.error = t('err_PIN_FORMAT'); render(); return; }
  f.busy = true; render();
  const gen = S.gen;
  try {
    const d = await api('login', { id: f.id, pin: f.pin, remember: f.remember !== false, token: undefined });
    f.busy = false; f.pin = '';
    if (gen !== S.gen) { api('logout', { token: d.token }).catch(() => {}); return; }
    afterSignIn(d, f.remember !== false);
  } catch (e) {
    f.busy = false; f.pin = ''; f.error = errText(e); render();
    const p = $('#login-pin'); if (p) p.focus();
  }
};
/** A full sign-in goes home; a temporary or 6-digit PIN only gets the screen to choose a new PIN. */
function afterSignIn(d, remember) {
  if (d.mustChangePin) {
    S.recovery = { token: d.token, reason: d.mustChangePin, first: (d.me && d.me.first) || '', remember: remember !== false };
    if (d.me && d.me.lang && !store.get('langChosen', false)) S.lang = d.me.lang;
    S.forms.newpin = { pin: '', pin2: '' };
    go('home');
    return;
  }
  setSession(d.token, d.home, remember);
  go('home');
  if (S.pendingInvite) joinPendingInvite();
  else maybeYearPrompt();
}

/* Choosing a new PIN after a temporary PIN from the office, or after signing in with an old 6-digit PIN */
function RecoveryView() {
  const r = S.recovery, f = form('newpin', { pin: '', pin2: '' });
  return `${topBarOut()}<main class="wrap main"><form class="stack" data-submit="newpin-save" novalidate>
    <h1>${T('mustChange')}</h1>
    <p class="muted">${r.reason === 'UPGRADE' ? T('upgradeBody', { name: r.first }) : T('mustChangeBody')}</p>
    ${pinInput('np-pin', T('newPin'), 'newpin.pin')}${pinInput('np-pin2', T('pinAgain'), 'newpin.pin2')}
    <p class="small muted">${T('pinRule')}</p>${errLine(f)}
    ${busyBtn(f, T('setPin'), T('saving'))}
    <button type="button" class="btn quiet block" data-a="newpin-cancel">${T('cancel')}</button>
  </form></main>`;
}
ACT['newpin-save'] = async () => {
  const f = S.forms.newpin, r = S.recovery;
  if (!f || !r || f.busy) return;
  f.error = '';
  if (!newPinOk(f.pin)) { f.error = t('err_PIN_FORMAT'); render(); return; }
  if (f.pin !== f.pin2) { f.error = t('pinMismatch'); render(); return; }
  f.busy = true; render();
  const gen = S.gen;
  try {
    const d = await api('pin.change', { token: r.token, pin: f.pin });
    if (gen !== S.gen) { api('logout', { token: d.token }).catch(() => {}); return; }
    S.forms.newpin = null;
    setSession(d.token, d.home, r.remember && !S.kiosk);
    toast(t('pinChanged'));
    if (S.kiosk) { S.k = { step: 'home' }; kioskIdleTimer(); }
    go('home');
    if (!S.kiosk) { if (S.pendingInvite) joinPendingInvite(); else maybeYearPrompt(); }
  } catch (e) {
    f.busy = false; f.error = errText(e);
    if (e.code === 'SIGNED_OUT') { S.recovery = null; S.forms.newpin = null; toast(t('signedOut'), 'error'); if (S.kiosk) kioskSignOut(); else go('home'); return; }
    if (e.code === 'PIN_WEAK' || e.code === 'PIN_FORMAT') { f.pin = ''; f.pin2 = ''; }
    render();
  }
};
ACT['newpin-cancel'] = () => {
  const r = S.recovery;
  if (r) api('logout', { token: r.token }).catch(() => {});
  S.recovery = null; S.forms.newpin = null;
  if (S.kiosk) kioskSignOut(); else go('home');
};

/* Sign up */
function blankKid(last) { return { first: '', last: last || '', grade: '', teacher: '', custom: false }; }
function SignupView() {
  if (S.cfg.school.signupOpen === false) return `${topBarOut()}<main class="wrap main stack"><h1>${T('signupTitle')}</h1><p class="muted">${T('signupClosed')}</p><a class="btn block" href="#home">${T('back')}</a></main>`;
  const f = form('signup', { step: 1, first: '', last: '', phone: '', email: '', relationship: 'Mother', kids: [blankKid()], pin: '', pin2: '', remember: true, key: requestKey('su') });
  const steps = `<div class="steps" aria-hidden="true">${[1, 2, 3].map(n => `<span class="${n <= f.step ? 'on' : ''}"></span>`).join('')}</div>`;
  let body = '';
  if (f.step === 1) {
    const rels = ['Mother', 'Father', 'Guardian', 'Grandparent', 'Aunt/Uncle', 'Nanny/Caregiver', 'Other'];
    body = `<h2>${T('step1')}</h2>
      <div class="two">${fieldInput('su-first', T('firstName'), 'signup.first', 'autocomplete="given-name" autocapitalize="words"')}${fieldInput('su-last', T('lastName'), 'signup.last', 'autocomplete="family-name" autocapitalize="words"')}</div>
      ${fieldInput('su-phone', T('phoneLabel'), 'signup.phone', 'type="tel" inputmode="tel" autocomplete="tel-national"')}
      ${fieldInput('su-email', T('emailOpt'), 'signup.email', 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"', T('emailWhy'))}
      <div class="group stack-sm"><span class="label" id="su-rel-label">${T('relationship')}</span><div class="chips" role="group" aria-labelledby="su-rel-label">${rels.map(r => `<button type="button" class="chip" data-a="su-rel" data-v="${esc(r)}" aria-pressed="${f.relationship === r}">${esc(relLabel(r))}</button>`).join('')}</div></div>`;
  } else if (f.step === 2) {
    body = `<h2>${T('step2', { school: schoolShort() })}</h2>${f.kids.map((k, i) => kidEditor('signup', i, k, f.kids.length > 1)).join('')}
      <button type="button" class="btn ghost block" data-a="su-addkid">${icon('plus', 20)} ${T('addAnother')}</button>`;
  } else {
    body = `<h2>${T('step3')}</h2>
      ${pinInput('su-pin', T('pinLabel'), 'signup.pin')}${pinInput('su-pin2', T('pinAgain'), 'signup.pin2')}
      <p class="small muted">${T('pinRule')}</p>
      ${S.kiosk ? '' : `<label class="check"><input type="checkbox" id="su-remember" data-f="signup.remember" ${f.remember ? 'checked' : ''}> ${T('remember')}</label>`}
      <div class="note">${icon('shield', 20)}<span>${T('verifyNote')}</span></div>`;
  }
  return `${topBarOut()}<main class="wrap main"><form class="stack" data-submit="su-next" novalidate>
    <div class="spread"><span class="eyebrow">${T('signupTitle')}</span><span class="tiny muted num">${f.step}/3</span></div>${steps}
    ${body}${errLine(f)}
    <div class="two">${f.step > 1 ? `<button type="button" class="btn soft" data-a="su-back">${T('back')}</button>` : `<a class="btn soft" href="#home">${T('cancel')}</a>`}
    ${f.step < 3 ? `<button class="btn" type="submit">${T('next')}</button>` : `<button class="btn" type="submit" ${f.busy ? 'disabled aria-busy="true"' : ''}>${f.busy ? T('creating') : T('createProfile')}</button>`}</div>
  </form></main>`;
}
function kidEditor(formName, i, k, removable) {
  const grades = S.cfg.school.grades || [];
  const teachers = (k.grade && S.cfg.teachers[k.grade]) || [];
  const p = `${formName}.kids.${i}`;
  return `<div class="kid-card">
    <div class="spread"><span class="label">${T('childN', { n: i + 1 })}</span>${removable ? `<button type="button" class="link-btn" data-a="kid-remove" data-form="${formName}" data-i="${i}">${T('remove')}</button>` : ''}</div>
    <div class="two">
      <div class="field"><label for="${formName}-k${i}-first">${T('firstName')}</label><input class="input" id="${formName}-k${i}-first" data-f="${p}.first" value="${esc(k.first)}" autocapitalize="words" autocomplete="off"></div>
      <div class="field"><label for="${formName}-k${i}-last">${T('lastName')}</label><input class="input" id="${formName}-k${i}-last" data-f="${p}.last" value="${esc(k.last)}" autocapitalize="words" autocomplete="off"></div>
    </div>
    <div class="group stack-sm"><span class="label" id="${formName}-k${i}-gl">${T('grade')}</span><div class="chips" role="group" aria-labelledby="${formName}-k${i}-gl">${grades.map(g => `<button type="button" class="chip grade" data-a="kid-grade" data-form="${formName}" data-i="${i}" data-v="${esc(g)}" aria-pressed="${k.grade === g}">${esc(g)}</button>`).join('')}</div></div>
    <div class="group stack-sm"><span class="label" id="${formName}-k${i}-tl">${T('teacher')}</span>${k.grade ? `<div class="chips" role="group" aria-labelledby="${formName}-k${i}-tl">${teachers.map(n => `<button type="button" class="chip" data-a="kid-teacher" data-form="${formName}" data-i="${i}" data-v="${esc(n)}" aria-pressed="${!k.custom && k.teacher === n}">${esc(n)}</button>`).join('')}<button type="button" class="chip" data-a="kid-teacher" data-form="${formName}" data-i="${i}" data-v="" aria-pressed="${!!k.custom}">${T('notListed')}</button></div>
      ${k.custom ? `<label class="sr" for="${formName}-k${i}-teacher">${T('teacherName')}</label><input class="input" id="${formName}-k${i}-teacher" data-f="${p}.teacher" value="${esc(k.teacher)}" placeholder="${T('teacherName')}" autocapitalize="words">` : ''}` : `<p class="small muted">${T('pickGradeFirst')}</p>`}</div>
  </div>`;
}
function kidAt(el) { const f = S.forms[el.dataset.form]; return f.kids[+el.dataset.i]; }
ACT['kid-grade'] = el => { const k = kidAt(el); if (k.grade !== el.dataset.v) { k.grade = el.dataset.v; if (!k.custom) k.teacher = ''; } rerenderForm(el); };
ACT['kid-teacher'] = el => { const k = kidAt(el); if (el.dataset.v) { k.teacher = el.dataset.v; k.custom = false; } else { k.custom = true; k.teacher = ''; } rerenderForm(el, k.custom ? `#${el.dataset.form}-k${el.dataset.i}-teacher` : null); };
ACT['kid-remove'] = el => { const f = S.forms[el.dataset.form]; f.kids.splice(+el.dataset.i, 1); rerenderForm(el); };
function rerenderForm(el, focusSel) { if (S.sheet) renderSheet(); else render(); if (focusSel) { const x = $(focusSel); if (x) x.focus(); } }
ACT['su-rel'] = el => { S.forms.signup.relationship = el.dataset.v; render(); };
ACT['su-addkid'] = () => { const f = S.forms.signup; f.kids.push(blankKid(f.last)); render(); const x = $(`#signup-k${f.kids.length - 1}-first`); if (x) x.focus(); };
ACT['su-back'] = () => { const f = S.forms.signup; f.error = ''; f.step = Math.max(1, f.step - 1); render(); window.scrollTo(0, 0); };
function kidsProblem(kids) {
  for (const k of kids) {
    if (!String(k.first || '').trim()) return t('err_NEED_KID_NAME');
    if (!k.grade) return t('err_NEED_GRADE');
  }
  return '';
}
ACT['su-next'] = async () => {
  const f = S.forms.signup;
  f.error = '';
  if (f.step === 1) {
    if (!f.first.trim() || !f.last.trim()) f.error = t('err_NEED_NAME');
    else if (!f.phone.trim() && !f.email.trim()) f.error = t('err_NEED_CONTACT');
    else if (f.phone.trim() && f.phone.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '').length !== 10) f.error = t('err_BAD_PHONE');
    else if (f.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) f.error = t('err_BAD_EMAIL');
    if (!f.error) { f.step = 2; f.kids.forEach(k => { if (!k.last) k.last = f.last.trim(); }); }
    render(); window.scrollTo(0, 0); return;
  }
  if (f.step === 2) {
    f.error = kidsProblem(f.kids);
    if (!f.error) f.step = 3;
    render(); window.scrollTo(0, 0); return;
  }
  if (!newPinOk(f.pin)) { f.error = t('err_PIN_FORMAT'); render(); return; }
  if (f.pin !== f.pin2) { f.error = t('pinMismatch'); render(); return; }
  if (f.busy) return;
  f.busy = true; render();
  const gen = S.gen;
  try {
    const d = await api('signup', {
      token: undefined, pin: f.pin, remember: f.remember !== false, clientId: f.key,
      adult: { first: f.first, last: f.last, phone: f.phone, email: f.email, relationship: f.relationship, lang: S.lang },
      kids: f.kids.map(k => ({ first: k.first, last: k.last, grade: k.grade, teacher: k.teacher }))
    });
    if (gen !== S.gen) { api('logout', { token: d.token }).catch(() => {}); return; }
    S.forms.signup = null;
    afterSignIn(d, f.remember !== false);
  } catch (e) {
    f.busy = false; f.error = errText(e);
    if (e.code === 'PIN_WEAK' || e.code === 'PIN_FORMAT') { f.pin = ''; f.pin2 = ''; }
    if (/NEED_NAME|NEED_CONTACT|BAD_PHONE|BAD_EMAIL|ACCOUNT_EXISTS/.test(e.code)) f.step = 1;
    if (/NEED_KID|NEED_GRADE|TOO_MANY/.test(e.code)) f.step = 2;
    // A changed request needs a new key; a lost reply keeps the old one so the retry is recognised.
    if (e.code !== 'NETWORK' && e.code !== 'BUSY') f.key = requestKey('su');
    render();
  }
};

/* Forgot PIN */
function ForgotView() {
  const f = form('forgot', { stage: 'ask', id: '', code: '', pin: '', pin2: '' });
  const phone = S.cfg.school.phone;
  const ask = `<p class="muted">${T('forgotBody')}</p>${fieldInput('fg-id', T('phoneOrEmail'), 'forgot.id', 'autocomplete="username" autocapitalize="off" spellcheck="false"')}${errLine(f)}${busyBtn(f, T('sendCode'), T('sendCode'))}`;
  const code = `<div class="note accent" role="status">${icon('mail', 20)}<span>${T('codeSent', { phone })}</span></div>
    ${fieldInput('fg-code', T('code'), 'forgot.code', 'inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code"')}
    ${pinInput('fg-pin', T('newPin'), 'forgot.pin')}${pinInput('fg-pin2', T('pinAgain'), 'forgot.pin2')}
    <p class="small muted">${T('pinRule')}</p>${errLine(f)}${busyBtn(f, T('setPin'), T('setPin'))}`;
  return `${topBarOut()}<main class="wrap main"><form class="stack" data-submit="forgot" novalidate>
    <h1>${T('forgotTitle')}</h1>${f.stage === 'ask' ? ask : code}
    <a class="btn quiet block" href="#home">${T('back')}</a></form></main>`;
}
ACT.forgot = async () => {
  const f = S.forms.forgot;
  if (f.busy) return;
  f.error = '';
  try {
    if (f.stage === 'ask') {
      if (!f.id.trim()) { f.error = t('err_NEED_CONTACT'); render(); return; }
      f.busy = true; render();
      await api('pin.forgot', { id: f.id, token: undefined });
      f.busy = false; f.stage = 'code'; render();
      return;
    }
    if (!newPinOk(f.pin)) { f.error = t('err_PIN_FORMAT'); render(); return; }
    if (f.pin !== f.pin2) { f.error = t('pinMismatch'); render(); return; }
    f.busy = true; render();
    const d = await api('pin.reset', { id: f.id, code: f.code, pin: f.pin, token: undefined });
    S.forms.forgot = null;
    toast(t('pinChanged'));
    afterSignIn(d, true);
  } catch (e) { f.busy = false; f.error = errText(e); render(); }
};

/* Invites */
function InviteView() {
  const code = S.pendingInvite;
  const info = S.inviteInfo;
  if (!info || info.code !== code) {
    if (!S.inviteLoading) {
      S.inviteLoading = true;
      api('invite.info', { code, token: undefined })
        .then(d => { S.inviteInfo = Object.assign({ code }, d); S.inviteErr = null; })
        .catch(e => { S.inviteErr = errText(e); S.inviteInfo = { code }; })
        .finally(() => { S.inviteLoading = false; if (S.route === 'invite') render(); });
    }
    return `${topBarOut()}<div class="splash"><div class="spin" role="status" aria-label="${T('loading')}"></div></div>`;
  }
  if (S.inviteErr) return `${topBarOut()}<main class="wrap main stack"><div class="hero">${logoTag()}<h1>${esc(S.inviteErr)}</h1></div><a class="btn block" href="#home">${T('done')}</a></main>`;
  const role = info.role === 'Pickup' ? t('Pickup') : t('Guardian');
  const head = `<div class="hero">${logoTag()}<h1>${T('inviteTitle', { name: info.inviter })}</h1><p class="muted">${T('inviteBody', { kids: listNames(info.kids), school: schoolShort(), role: role.toLowerCase() })}</p>
    <p class="small muted">${info.role === 'Pickup' ? T('pickupHelp') : T('guardianHelp')}</p>
    <p class="small muted">${info.contact === 'email' ? T('inviteForEmail') : T('inviteForPhone')}</p></div>`;
  if (S.token) {
    return `${topBarOut()}<main class="wrap main stack">${head}<button class="btn block" data-a="invite-join">${T('inviteJoin')}</button><a class="btn quiet block" href="#home">${T('cancel')}</a></main>`;
  }
  const f = form('invite', { first: (info.name || '').split(' ')[0] || '', last: (info.name || '').split(' ').slice(1).join(' '), phone: '', email: '', pin: '', pin2: '', key: requestKey('ia') });
  return `${topBarOut()}<main class="wrap main"><form class="stack" data-submit="invite-accept" novalidate>${head}
    <div class="two">${fieldInput('iv-first', T('firstName'), 'invite.first', 'autocomplete="given-name"')}${fieldInput('iv-last', T('lastName'), 'invite.last', 'autocomplete="family-name"')}</div>
    ${fieldInput('iv-phone', T('phoneLabel'), 'invite.phone', 'type="tel" inputmode="tel" autocomplete="tel-national"')}
    ${fieldInput('iv-email', T('emailOpt'), 'invite.email', 'type="email" inputmode="email" autocomplete="email" autocapitalize="off"', T('emailWhy'))}
    ${pinInput('iv-pin', T('pinLabel'), 'invite.pin')}${pinInput('iv-pin2', T('pinAgain'), 'invite.pin2')}
    <p class="small muted">${T('pinRule')}</p>${errLine(f)}${busyBtn(f, T('inviteJoin'), T('creating'))}
    <p class="small muted">${T('inviteHave')}</p><a class="btn ghost block" href="#home">${T('signIn')}</a>
  </form></main>`;
}
ACT['invite-accept'] = async () => {
  const f = S.forms.invite;
  if (f.busy) return;
  f.error = '';
  if (!newPinOk(f.pin)) { f.error = t('err_PIN_FORMAT'); render(); return; }
  if (f.pin !== f.pin2) { f.error = t('pinMismatch'); render(); return; }
  f.busy = true; render();
  try {
    const d = await api('invite.accept', { token: undefined, code: S.pendingInvite, first: f.first, last: f.last, phone: f.phone, email: f.email, pin: f.pin, lang: S.lang, clientId: f.key });
