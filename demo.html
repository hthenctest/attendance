    if (!S.geo || S.geo.state === 'pending' || (S.geo.fix && Date.now() - S.geo.fix.at > 60000)) {
      f.locating = true; renderSheet();
      await startGeo(S.geo && S.geo.state !== 'pending');
      f.locating = false;
      if (S.flow !== f) return;
    }
    if (geoBlocked(f)) { renderSheet(); shake('#g-geo'); return; }
  }
  // The request belongs to the person signed in now: same token on every retry, and no retry once they are gone.
  const token = S.token, gen = S.gen, owner = S.home && S.home.me && S.home.me.id;
  const payload = Object.assign(flowPayload(f), { token });
  f.payload = payload; f.step = 'done'; f.status = 'saving'; f.busy = true; f.sentAt = schoolNow();
  renderSheet(); haptic(); startUndoCountdown(f);
  // Tardy and early release carry the moment they were sent, so they never wait in an outbox: retry briefly, then say so.
  const tries = f.type === 'ABSENT' && !S.kiosk ? 1 : 3;
  for (let i = 0; i < tries; i++) {
    if (gen !== S.gen || S.token !== token) return;
    try {
      const res = await api('entry.create', payload);
      if (gen !== S.gen || S.token !== token) return;
      f.busy = false; f.result = res; f.status = 'saved';
      mergeCreated(res);
      if (f.undoRequested) { undoFlow(); return; }
      if (S.flow === f) { renderSheet(); scheduleFlowClose(f); }
      return;
    } catch (e) {
      if (gen !== S.gen || S.token !== token) return;
      if (e.code === 'NETWORK' && i < tries - 1) { await new Promise(r => setTimeout(r, 1500 * (i + 1))); continue; }
      f.busy = false;
      if (e.code === 'NETWORK' && f.type === 'ABSENT' && !S.kiosk && owner) {
        outboxAdd({ payload, at: Date.now(), owner }); f.status = 'queued';
        if (f.undoRequested) { undoFlow(); return; }
        if (S.flow === f) { renderSheet(); scheduleFlowClose(f); }
      } else if (e.code === 'SIGNED_OUT' || e.code === 'INACTIVE') {
        closeSheet(); if (S.kiosk) kioskSignOut(); else signOutLocal(e.code === 'INACTIVE' ? t('err_INACTIVE') : t('signedOut'));
      } else {
        f.step = 'form'; f.error = ''; clearInterval(S.undoTimer);
        const geoCodes = { NEED_LOCATION: 'off', NOT_ON_CAMPUS: 'far', LOCATION_IMPRECISE: 'imprecise', NO_CAMPUS: 'nocampus' };
        if (geoCodes[e.code]) S.geo = Object.assign({}, S.geo || {}, { state: geoCodes[e.code] });
        if (S.flow === f) { renderSheet(); if (!geoCodes[e.code]) toast(e.code === 'NETWORK' ? t('noSignal') : errText(e), 'error'); }
      }
      return;
    }
  }
}
function startUndoCountdown(f) {

}
function scheduleFlowClose(f) {

}
async function undoFlow() {

/* ---------- Offline outbox: absences sent with no signal go out later, from the same person's phone only ---------- */
const OUTBOX_HOURS = 12;
let flushTimer = null, flushDelay = 2000;
function outboxAdd(item) {
  if (S.kiosk) return;
  S.outbox.push(item); store.set('outbox', S.outbox); scheduleFlush(flushDelay);
}
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flushOutbox, ms); }
/** Keeps only what the person signed in now queued, from the last few hours. Anything else is dropped unsent. */
function pruneOutbox() {
  const me = S.home && S.home.me && S.home.me.id, cut = Date.now() - OUTBOX_HOURS * 3600000;
  const keep = S.outbox.filter(x => x && x.owner && x.owner === me && x.at > cut);
  if (keep.length !== S.outbox.length) { const dropped = S.outbox.length - keep.length; S.outbox = keep; store.set('outbox', keep); if (dropped && me) toast(t('outboxDropped'), 'error'); }
}
async function flushOutbox() {
  if (S.kiosk) { S.outbox = []; return; }
  pruneOutbox();
  if (!S.outbox.length || !S.token) return;
  const item = S.outbox[0], token = S.token, gen = S.gen;
  try {
    const res = await api('entry.create', Object.assign({}, item.payload, { token }));
    if (gen !== S.gen || S.token !== token) return;
    S.outbox.shift(); store.set('outbox', S.outbox); flushDelay = 2000;
    mergeCreated(res); toast(t('sentLater'));
    if (S.flow && S.flow.clientId === item.payload.clientId) { S.flow.status = 'saved'; S.flow.result = res; renderSheet(); }
    if (S.outbox.length) scheduleFlush(300); else render();
  } catch (e) {
    if (gen !== S.gen || S.token !== token) return;
    if (e.code === 'NETWORK') { flushDelay = Math.min(flushDelay * 2, 30000); scheduleFlush(flushDelay); return; }
    S.outbox.shift(); store.set('outbox', S.outbox);
    toast(t('failed', { msg: errText(e) }), 'error'); render();
  }
}

/** Signs a family in on the iPad. A reply that comes back after they left (or after "Start over") is signed out at once. */
async function kioskLogin() {
  const k = S.k, gen = S.gen;
  k.busy = true; render();
  try {
    const d = await api('login', { id: k.mode === 'email' ? k.email : k.phone, pin: k.pin, remember: false, device: 'kiosk', token: undefined });
    if (gen !== S.gen || !S.kiosk || S.k !== k) { api('logout', { token: d.token }).catch(() => {}); return; }
    if (d.mustChangePin) {
      S.recovery = { token: d.token, reason: d.mustChangePin, first: (d.me && d.me.first) || '', remember: false };
      S.forms.newpin = { pin: '', pin2: '' };
      if (d.me && d.me.lang && !store.get('langChosen', false)) S.lang = d.me.lang;
      S.k = { step: 'recovery' };
      render(); kioskIdleTimer();
      return;
    }
    S.token = d.token; S.home = d.home;
    S.k = { step: 'home' };
    if (d.home.me.lang && !store.get('langChosen', false)) S.lang = d.home.me.lang;
    render(); kioskIdleTimer();
    const only = guardianKids().length ? null : 'EARLY';
    if (only) startFlow(only);
  } catch (e) {
    if (gen !== S.gen || S.k !== k) return;
    k.busy = false; k.pin = ''; k.error = errText(e);
    if (e.code === 'BAD_LOGIN') k.step = 'id';
    render();
  }
}
/** Everything about the family who just used the iPad is forgotten: sign-in, family, forms, anything queued. */
function kioskSignOut() {
  bumpGen();
  clearTimeout(S.kioskTimer); clearTimeout(S.kioskWarnTimer);
  S.kioskWarn = null; S.kioskExtends = 0;
  const tok = S.token, rec = S.recovery && S.recovery.token;
  if (tok) api('logout', { token: tok }).catch(() => {});
  if (rec && rec !== tok) api('logout', { token: rec }).catch(() => {});
  S.token = null; S.home = null; S.recovery = null; S.k = { step: 'idle' }; S.forms = {}; S.flow = null; S.hist = null;
  S.outbox = []; store.del('outbox'); store.del('token'); store.del('home');
  if (S.sheet) closeSheet();
  if (store.get('langChosen', false) === false) S.lang = store.get('lang', S.lang);
  render();
}
/* Idle sign-out with a warning first: the person can ask for more time (WCAG 2.2.1), up to 10 times. */
const KIOSK_WARN_SECONDS = 20, KIOSK_MAX_EXTENDS = 10;
function kioskIdleTimer() {
  clearTimeout(S.kioskTimer); clearTimeout(S.kioskWarnTimer);
  if (S.kioskWarn) { S.kioskWarn = null; const b = $('#k-idle'); if (b) b.remove(); }
  if (!S.kiosk || S.k.step === 'idle') return;
  const secs = Math.max(45, (S.cfg && S.cfg.school.kioskTimeout) || 90);
  S.kioskWarnTimer = setTimeout(kioskShowWarning, (secs - KIOSK_WARN_SECONDS) * 1000);
  S.kioskTimer = setTimeout(() => { if (S.kiosk && S.k.step !== 'idle') kioskSignOut(); }, secs * 1000);
}
function kioskShowWarning() {
  if (!S.kiosk || S.k.step === 'idle') return;
  S.kioskWarn = { left: KIOSK_WARN_SECONDS };
  const show = () => {
    const html = idleBanner(), cur = $('#k-idle');
    if (cur) cur.outerHTML = html;
    else { const top = $('.kiosk .topbar') || $('#sheet .sheet-head'); if (top) top.insertAdjacentHTML('afterend', html); }
  };
  show();
  const tick = setInterval(() => {
    if (!S.kioskWarn) { clearInterval(tick); return; }
    S.kioskWarn.left--;
    const n = $('#k-idle-n'); if (n) n.textContent = String(Math.max(0, S.kioskWarn.left));
    if (S.kioskWarn.left <= 0) clearInterval(tick);
  }, 1000);
}
function idleBanner() {
  if (!S.kioskWarn) return '';
  const more = (S.kioskExtends || 0) < KIOSK_MAX_EXTENDS;
  const text = esc(t('kioskBye', { n: '\u0000' })).replace('\u0000', `<b id="k-idle-n">${S.kioskWarn.left}</b>`);
  return `<div class="note warn k-idle" id="k-idle" role="alert">${icon('clock', 20)}<span>${text}</span>
    ${more ? `<button class="btn sm" data-a="k-more">${T('kioskMore')}</button>` : ''}</div>`;
}
ACT['k-more'] = () => { S.kioskExtends = (S.kioskExtends || 0) + 1; kioskIdleTimer(); };

/* Arrival alerts: a chime, the waiting count in the tab title, and a notification when the tab is in the background */
const ALERTS = { sound: store.get('alertSound', true) !== false, notify: store.get('alertNotify', false) === true };
let audioCtx = null;
function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!audioCtx && AC) audioCtx = new AC();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* no sound on this device */ }
}
/** Two rising notes when a parent is waiting to pick up, one note for a late arrival. */
function chime(type) {
  if (!ALERTS.sound || !audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + 0.03;
    (type === 'EARLY' ? [659.25, 987.77] : [880]).forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), at = t0 + i * 0.2;
      o.type = 'sine'; o.frequency.setValueAtTime(f, at);
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.2, at + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, at + 1.1);
      o.connect(g); g.connect(audioCtx.destination); o.start(at); o.stop(at + 1.15);
    });
  } catch (e) { /* ignore */ }
}
function notifyArrivals(list) {
  if (!ALERTS.notify || typeof Notification === 'undefined' || Notification.permission !== 'granted' || document.visibilityState === 'visible') return;
  const e = list[0], more = list.length - 1;
  const title = (e.type === 'EARLY' ? 'Early release: ' : 'Tardy: ') + e.student + (more ? ` and ${more} more` : '');
  const body = e.type === 'EARLY' ? `${e.reporter} sent an early release` : `Arrived ${enTime(e.time)}, reported by ${e.reporter}`;
  try { const n = new Notification(title, { body, tag: 'arrival-' + e.id, icon: (S.logo && S.logo.dataUrl) || undefined }); n.onclick = () => { window.focus(); n.close(); }; }
  catch (err) { /* this browser only notifies from a service worker */ }
}
/** Runs on every fresh copy of today's board: alerts for people who arrived since the last look, never for the ones already there. */
function checkArrivals(d) {
  const o = S.office;
  if (!d || d.date !== schoolNow().date) return;
  const waiting = d.entries.filter(e => (e.type === 'TARDY' || e.type === 'EARLY') && e.status === 'REPORTED');
  o.waiting = waiting.length;
  if (o.seen) {
    const fresh = waiting.filter(e => !o.seen.has(e.id) && e.source !== 'Office');
    if (fresh.length) { chime(fresh.some(e => e.type === 'EARLY') ? 'EARLY' : 'TARDY'); notifyArrivals(fresh); }
  } else o.seen = new Set();
  d.entries.forEach(e => o.seen.add(e.id));
  applyTitle();
}
ACT['al-sound'] = el => { ALERTS.sound = el.checked; store.set('alertSound', el.checked); if (el.checked) { unlockAudio(); chime('TARDY'); } };
ACT['al-notify'] = async el => {
  if (!el.checked) { ALERTS.notify = false; store.set('alertNotify', false); return; }
  let p = Notification.permission;
  if (p === 'default') { try { p = await Notification.requestPermission(); } catch (e) { p = 'denied'; } }
  ALERTS.notify = p === 'granted'; store.set('alertNotify', ALERTS.notify);

/* Live board */
function boardHome() { let d = schoolNow().date, n = 0; while (!schoolOpen(d) && n++ < 14) d = addDays(d, -1); return d; }
function boardDate() { return S.office.date || boardHome(); }
async function loadBoard(force) {
  const o = S.office;
  if (!S.staffToken || o.loadingBoard) return;
  o.loadingBoard = true;
  try {
    const d = await oapi('office.board', { date: boardDate(), etag: force ? '' : o.etag });
    o.syncErr = false; o.lastSync = Date.now();
    if (!d.same) {
      const prev = o.board ? new Set(o.board.entries.map(e => e.id + ':' + e.status)) : null;
      o.fresh = prev ? new Set(d.entries.filter(e => !prev.has(e.id + ':' + e.status)).map(e => e.id)) : new Set();
      o.board = d; o.etag = d.etag;
      if (d.date === schoolNow().date) o.todayEtag = d.etag;
      checkArrivals(d);
      if (S.unverified !== d.pendingReview) { S.unverified = d.pendingReview; updateVerifyBadge(); }
      if (o.tab === 'today') updateBoard();
    }
  } catch (e) { o.syncErr = true; }
  o.loadingBoard = false;
  updateLive();
}
function updateLive() {
  const l = $('#o-live');
  if (!l) return;
  const o = S.office;
  l.className = 'live' + (o.syncErr ? ' off' : '');
  l.lastElementChild.textContent = o.syncErr ? 'Reconnecting' : (o.lastSync ? 'Live · ' + enTime(hhmm(schoolNow().mins)) : 'Live');
}

function updateVerifyBadge() {

  else if (badge) badge.remove();

/** From an hour before the bell to half an hour after dismissal on school days, the board checks for new arrivals often. */
function officeBusy() {
  const n = schoolNow(), sc = (S.cfg && S.cfg.school) || {};
  if (!schoolOpen(n.date)) return false;
  return n.mins >= (mins(sc.bellStart) || 495) - 60 && n.mins <= (mins(dismissalFor(n.date)) || 900) + 30;
}
function pollOffice(force) {
  const o = S.office;
  if (S.route !== 'office' || S.kiosk || !S.staffToken || !S.cfg) return;
  const onToday = o.tab === 'today' && !o.date;
  // A tab in the background still listens for arrivals; browsers may slow its timer to about once a minute.
  const every = document.visibilityState !== 'visible' ? 20000 : onToday ? (officeBusy() ? 8000 : 20000) : 30000;
  const now = performance.now();
  if (!force && now - (o.lastPoll || -1e9) < every - 400) return;
  o.lastPoll = now;
  if (onToday) loadBoard(false); else pollToday();
}
/** Today's arrivals while the office is looking at another day or another tab. */
async function pollToday() {
  const o = S.office;
  if (o.pollingToday) return;
  o.pollingToday = true;
  try {
    const d = await oapi('office.board', { date: schoolNow().date, etag: o.todayEtag || '' });
    o.syncErr = false; o.lastSync = Date.now();
    if (!d.same) {
      o.todayEtag = d.etag; checkArrivals(d);
      if (S.unverified !== d.pendingReview) { S.unverified = d.pendingReview; updateVerifyBadge(); }
    }
  } catch (e) { o.syncErr = true; }
  o.pollingToday = false;

}

let oaddTimer = null;
function oaddSearch() {

/** Every open review item in one family: who each adult is, who each child is, and each adult's permission for each child. */
function reviewItems(g) {

    a.links.filter(l => l.approval === 'PENDING').forEach(l => items.push({ kind: 'link', id: l.id, version: l.version, label: `${a.first} ${a.last} → ${kidName(l.studentId)}`, detail: l.role === 'Guardian' ? 'Guardian: reports and picks up' : 'Pickup only', deny: true }));

/* Weekly chart: three small charts that share the week axis, one per kind of entry */
function niceMax(v) {
  if (v <= 5) return Math.max(1, Math.ceil(v));
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function colPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h), f = n => Math.round(n * 10) / 10;
  return `M${f(x)},${f(y + h)}V${f(y + r)}Q${f(x)},${f(y)} ${f(x + r)},${f(y)}H${f(x + w - r)}Q${f(x + w)},${f(y)} ${f(x + w)},${f(y + r)}V${f(y + h)}Z`;
}
const monthShort = d => new Intl.DateTimeFormat('en-US', { month: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, 15)));
let patRO = null;
function drawPatChart() {
  const box = $('#pat-chart'), p = S.office.pat;
  if (!box || !p || !p.data) return;
  const weeks = p.data.weeks, W = Math.max(260, Math.floor(box.clientWidth || 600));
  const rowH = 70, labelH = 26, gapY = 18, axisH = 22, padL = 34, padR = 4;
  const H = TYPES.length * (labelH + rowH + gapY) - gapY + axisH;
  const n = Math.max(1, weeks.length), slot = (W - padL - padR) / n;
  const bw = Math.max(2, Math.min(24, slot - Math.max(2, slot * 0.36)));
  const out = [`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`,
    `<rect class="pat-hl" x="0" y="${labelH - 6}" width="${slot}" height="${H - axisH - labelH + 10}" rx="6" visibility="hidden"/>`];
  TYPES.forEach((tp, ti) => {
    const top = ti * (labelH + rowH + gapY), y0 = top + labelH, base = y0 + rowH;
    const nice = niceMax(Math.max(0, ...weeks.map(w => w[tp])));
    out.push(`<rect x="0" y="${top + 3}" width="10" height="10" rx="3" class="pat-col ${tp}"/><text class="pat-lbl" x="16" y="${top + 12}">${TYPE_PLURAL[tp]}</text>`);
    out.push(`<line class="pat-grid" x1="${padL}" x2="${W - padR}" y1="${y0 + 0.5}" y2="${y0 + 0.5}"/><text x="${padL - 8}" y="${y0 + 4}" text-anchor="end">${nice}</text>`);
    out.push(`<line class="pat-grid" x1="${padL}" x2="${W - padR}" y1="${base + 0.5}" y2="${base + 0.5}"/><text x="${padL - 8}" y="${base + 4}" text-anchor="end">0</text>`);
    weeks.forEach((w, i) => {
      if (!w[tp]) return;
      const h = Math.max(3, w[tp] / nice * rowH);
      out.push(`<path class="pat-col ${tp}" d="${colPath(padL + i * slot + (slot - bw) / 2, base - h, bw, h)}"/>`);
    });
  });
  let lastM = '', lastX = -99;
  weeks.forEach((w, i) => {
    const m = w.start.slice(0, 7), x = padL + i * slot;
    if (m === lastM) return;
    lastM = m;
    if (x - lastX < 36) return;
    lastX = x;
    out.push(`<text x="${(x + 1).toFixed(1)}" y="${H - 5}">${monthShort(w.start)}</text>`);
  });
  out.push('</svg>');
  box.innerHTML = out.join('') + '<div class="pat-tip" hidden></div>';
  box._geo = { padL, slot, n, H, axisH };
  box._w = box.clientWidth;
  box.onpointermove = box.onpointerdown = e => {
    const r = box.getBoundingClientRect(), g = box._geo, x = e.clientX - r.left, y = e.clientY - r.top;
    if (x < g.padL - 4 || y > g.H - g.axisH + 6) { hidePatTip(); return; }
    const i = Math.max(0, Math.min(g.n - 1, Math.floor((x - g.padL) / g.slot)));
    if (i !== S.office.pat.hl || $('.pat-tip', box).hidden) showPatTip(i);
  };

    });

}
function showPatTip(i) {

function splitRow(line, delim) {
  if (delim === '\t') return line.split('\t');
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
/** Reads a pasted list from a spreadsheet (tabs) or a CSV file. Columns are recognised by their header names. */
function parseRoster(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim());
  if (lines.length < 2) return { error: 'Paste the header row and at least one student.' };
  const top = lines[0];
  const delim = top.indexOf('\t') >= 0 ? '\t' : (top.split(';').length > top.split(',').length ? ';' : ',');
  const head = splitRow(top, delim).map(h => h.trim().toLowerCase().replace(/[_.]+/g, ' ').replace(/\s+/g, ' '));
  const adult = /(mother|father|mom|dad|parent|guardian|contact|emerg|caregiver|household|teacher|staff)/;
  const col = re => head.findIndex(h => re.test(h) && !adult.test(h));
  const fi = col(/^(student )?(first|given|preferred first)( ?name)?$|^student first/);
  const li = col(/^(student )?(last|family|sur)( ?name)?$|^student last/);
  const ni = fi < 0 || li < 0 ? col(/^(student|student name|name|full name|student full name|lastfirst|last first|last, first)$/) : -1;
  const gi = head.findIndex(h => /^(grade|gr|grd|grade level|grade lvl)$/.test(h) || /^grade\b/.test(h));
  const ti = head.findIndex(h => /(teacher|homeroom)/.test(h) && !/(mother|father|parent|guardian)/.test(h));
  const pis = head.map((h, i) => (/(phone|cell|mobile|tel)/.test(h) && !/teacher/.test(h) ? i : -1)).filter(i => i >= 0);
  const eis = head.map((h, i) => (/e-?mail/.test(h) && !/teacher/.test(h) ? i : -1)).filter(i => i >= 0);
  if ((fi < 0 || li < 0) && ni < 0) return { error: 'The first row needs column names such as First Name and Last Name, or Student Name.' };
  const rows = [];
  lines.slice(1).forEach(l => {
    const c = splitRow(l, delim).map(x => x.trim());
    let first = '', last = '';
    if (fi >= 0 && li >= 0) { first = c[fi] || ''; last = c[li] || ''; }
    else {
      const full = c[ni] || '';
      if (full.indexOf(',') >= 0) { last = full.split(',')[0].trim(); first = full.split(',').slice(1).join(' ').trim(); }
      else { const parts = full.split(/\s+/); first = parts[0] || ''; last = parts.slice(1).join(' '); }
    }
    if (!first || !last) return;
    rows.push({
      first, last, grade: gi >= 0 ? c[gi] || '' : '', teacher: ti >= 0 ? c[ti] || '' : '',
      phones: pis.map(i => c[i] || '').join(';').split(/[;\/,]|\s{2,}/).map(x => x.trim()).filter(x => x.replace(/\D/g, '').length >= 10),
      emails: eis.map(i => c[i] || '').join(';').split(/[;,\s]+/).filter(x => x.indexOf('@') > 0)
    });
  });

  if (ti >= 0) found.push('teacher');
  if (pis.length) found.push(plural(pis.length, 'phone column', 'phone columns'));

}

/* Logo upload: shrink to 256 px, keep transparency, pick the main color */
function logoAccent(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data, buckets = {};
  for (let i = 0; i < d.length; i += 8) {
    if (d[i + 3] < 160) continue;
    const r = d[i], g = d[i + 1], b = d[i + 2], hsl = rgbToHsl(r, g, b);
    if (hsl[1] < .25 || hsl[2] < .1 || hsl[2] > .9) continue;
    const k = Math.round(hsl[0] / 15) % 24, bk = buckets[k] || (buckets[k] = { n: 0, r: 0, g: 0, b: 0 }), wt = hsl[1];
    bk.n += wt; bk.r += r * wt; bk.g += g * wt; bk.b += b * wt;
  }
  let best = null;
  Object.keys(buckets).forEach(k => { if (!best || buckets[k].n > best.n) best = buckets[k]; });
  return best ? rgbToHex(best.r / best.n, best.g / best.n, best.b / best.n) : null;
}
ACT['adm-logo-file'] = el => {
  const file = el.files && el.files[0], a = S.office.admin;
  if (!file) return;
  a.logoError = '';
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let size = 256, out = '';
      for (let attempt = 0; attempt < 4; attempt++) {
        const scale = Math.min(1, size / Math.max(img.naturalWidth || size, img.naturalHeight || size));
        const w = Math.max(1, Math.round((img.naturalWidth || size) * scale)), h = Math.max(1, Math.round((img.naturalHeight || size) * scale));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        out = c.toDataURL('image/png');
        if (attempt === 0) a.logoAccentAuto = logoAccent(ctx, w, h);
        if (out.length < 140000) break;
        size = Math.round(size * .75);
      }
      a.logoDraft = { dataUrl: out, accent: a.logoAccentAuto || a.settings.AccentColor || '#2456C5' };
      renderOfficeMain();
    };
    img.onerror = () => { a.logoError = 'That file could not be read as an image.'; renderOfficeMain(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};

  } else {

document.addEventListener('keydown', e => {

  if (e.key === 'Enter' && e.target.id === 'oadd-q') { e.preventDefault(); return; }
  if (S.route !== 'office' || S.kiosk || !S.staffToken || S.office.tab !== 'today' || S.sheet) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (typing) {
    if (e.key === 'Escape') e.target.blur();

      if (n) n.focus();

setInterval(() => {

}
setInterval(() => {
  tickKioskClock();
  if (S.route === 'office' && !S.kiosk && S.office.tab === 'today' && S.office.board && !S.sheet) { updateBoard(); updateLive(); }
}, 30000);

async function loadConfig() {
  try {
    const c = await api('config', { token: undefined });
    S.cfg = c; store.set('cfg', c);
    const v = c.school.logoVersion;
    if (!v || v === '0') { if (S.logo) { S.logo = null; store.del('logo'); } }
    else if (!S.logo || S.logo.version !== v) {
      try { const l = await api('logo', { token: undefined }); S.logo = { version: l.version, dataUrl: l.dataUrl }; store.set('logo', S.logo); } catch (e) { /* keep the old one */ }
    }
    if (!isTyping() && !S.sheet) render(); else applyBrand();

function boot() {

  if (FRAMED) { $('#app').innerHTML = framedHtml(); return; }

  const inv = qs.get('invite');
  if (inv) { S.pendingInvite = inv.toUpperCase(); S.route = 'invite'; }
  const g = qs.get('go');
  if (g && /^(tardy|early|absent)$/i.test(g)) S.deepGo = g.toUpperCase();
  if (qs.has('office') || S.pendingKiosk) S.route = 'office';
  if (S.kiosk) { S.token = null; S.home = null; }
  render();
  loadConfig();
  if (S.pendingKiosk && S.staffToken && !S.kiosk) ACT['o-kiosk']();
  if (S.outbox.length && !S.kiosk) scheduleFlush(1500);
}
boot();

})();
