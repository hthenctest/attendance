/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 20px; border-radius: 14px; border: 1px solid transparent; font-weight: 650; font-size: 17px; background: var(--accent); color: var(--accent-ink); text-decoration: none; transition: transform .1s ease, filter .15s ease; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.day-head { padding: 18px 4px 8px; }
.empty { padding: 22px 16px; text-align: center; color: var(--ink-3); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-lg); font-size: 15px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 2px 10px; }

/* The confirmation slip, modeled on the front desk's paper slip */

/* Welcome and sign-in */

/* Front office */
.office { min-height: 100%; }

@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-block: 4px 14px; }

.sum { border-radius: 16px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; text-align: left; }
.sum b { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sum span { font-size: 14px; color: var(--ink-3); }

.lanes { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }

.c-top { display: flex; gap: 10px; align-items: center; min-width: 0; }

.temp-pin { font-family: var(--font-mono); font-size: 40px; font-weight: 700; letter-spacing: .2em; text-align: center; padding: 12px; border-radius: 16px; background: var(--surface-2); }

/* Patterns: the school year at a glance. Chart marks use the --viz-* colors (checked for color-blind separation in both themes). */
.pat { display: grid; gap: 16px; padding-top: 4px; transition: opacity .2s; }

th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }

/* Roster check */

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Toasts */

.toast { pointer-events: auto; max-width: 520px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow-2); font-size: 15px; font-weight: 550; display: flex; gap: 10px; align-items: center; animation: rise .2s ease; }

.splash { min-height: 70vh; display: grid; place-items: center; color: var(--ink-3); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Small cover screens (Galaxy Z Flip, Motorola Razr) and narrow split views: tighter, still thumb-sized */
@media (max-height: 480px) and (max-width: 600px), (max-width: 340px) {
  .topbar .wrap { min-height: 50px; gap: 8px; }

  h1 { font-size: 22px; }
  .hero { padding-block: 10px 4px; gap: 10px; }
  .hero .logo, .hero .mono { width: 48px; height: 48px; border-radius: 14px; font-size: 16px; }
  .tiles { gap: 8px; }
  .tile { min-height: 64px; padding: 10px 12px; grid-template-columns: 44px 1fr 18px; gap: 10px; }
  .tile .ic { width: 44px; height: 44px; border-radius: 13px; }
  .tile .t1 { font-size: 17px; }
  .tile .t2 { font-size: 13.5px; }
  .sheet-head h2 { padding-top: 10px; font-size: 19px; }
  .sheet-body { gap: 14px; padding-top: 4px; }
  .chip { min-height: 40px; padding: 7px 13px; font-size: 15px; }
  .kid { min-height: 46px; }
  .slip-main { padding: 14px 14px 10px; }
  .check-anim { width: 48px; height: 48px; }
}

/* Book posture and dual screens (Galaxy Z Fold, Pixel Fold, OnePlus Open, Surface Duo): each side gets its own part,
   nothing sits on the fold. Chrome and Edge 138+ report the fold; elsewhere these rules are skipped. */
@media (horizontal-viewport-segments: 2) {
  :root {
    --seg-l: env(viewport-segment-width 0 0, 50vw); --seg-r: env(viewport-segment-width 1 0, 50vw);
    --hinge: calc(env(viewport-segment-left 1 0, 50vw) - env(viewport-segment-right 0 0, 50vw));
    --col-l: calc(var(--seg-l) - 32px); --col-r: calc(var(--seg-r) - 32px); --col-gap: calc(var(--hinge) + 32px);
  }
  [data-view="parent"] main.wrap:not(.wide):not(.welcome), [data-view="parent"] .topbar .wrap:not(.wide) { max-width: min(560px, var(--seg-l)); margin-left: max(0px, calc((var(--seg-l) - 560px) / 2)); margin-right: 0; }
  .wrap.wide { max-width: none; }
  .panes { display: grid; grid-template-columns: var(--col-l) var(--col-r); column-gap: var(--col-gap); grid-template-areas: "a act" "b act"; grid-template-rows: auto 1fr; align-items: start; }
  .pane-a { grid-area: a; } .pane-b { grid-area: b; }
  .panes > .pane-actions { grid-area: act; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); padding-top: 8px; }
  main.welcome { max-width: none; display: grid; grid-template-columns: var(--col-l) var(--col-r); column-gap: var(--col-gap); align-items: center; min-height: calc(100dvh - 60px); }
  main.welcome > * { min-width: 0; width: 100%; max-width: 480px; justify-self: center; }
  .scrim { justify-content: flex-start; align-items: stretch; padding: 0; }
  .sheet { margin-left: env(viewport-segment-left 1 0, 50vw); width: var(--seg-r); max-width: none; max-height: none; height: 100%; border-radius: 0; padding-top: env(safe-area-inset-top, 0px); animation: slide .24s cubic-bezier(.2, .8, .2, 1); }
  .sheet-head::before { display: none; }
  .sheet-head h2 { padding-top: 10px; }
  #toasts { left: env(viewport-segment-left 1 0, 50vw); }
  .kiosk .wrap { max-width: none; }
  .kiosk-idle { grid-template-columns: var(--col-l) var(--col-r); column-gap: var(--col-gap); align-items: center; }
  .kiosk-signin { display: grid; grid-template-columns: var(--seg-l) var(--seg-r); column-gap: var(--hinge); min-height: 100dvh; align-items: center; }
  .kiosk-signin .k-top { align-self: stretch; }
  .kiosk-signin .k-bottom { padding-block: 24px; }
  .office .wrap { max-width: none; }
  .o-bar { max-width: var(--col-l); }
  .summary, .lanes, .split, .admin-grid { grid-template-columns: var(--col-l) var(--col-r); column-gap: var(--col-gap); align-items: start; }
  .sum-pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .lanes > .lane, .lanes > .lane:not(.on) { display: grid; }
  .lanes > .lane:nth-child(1) { grid-column: 1; grid-row: 1 / span 2; }
  .lanes > .lane:nth-child(2) { grid-column: 2; grid-row: 1; }
  .lanes > .lane:nth-child(3) { grid-column: 2; grid-row: 2; }
  .lanes.two > .lane:nth-child(1), .lanes.two > .lane:nth-child(2) { grid-row: 1; }
  .split > .detail { position: sticky; top: 132px; }
}

/* Laptop and tabletop postures (a Fold half-open on its side, a Flip in Flex mode): read on the top half, tap on the bottom half */
@media (vertical-viewport-segments: 2) {
  :root {
    --seg-t: env(viewport-segment-height 0 0, 50vh); --seg-b: env(viewport-segment-height 0 1, 50vh);
    --hinge-v: calc(env(viewport-segment-top 0 1, 50vh) - env(viewport-segment-bottom 0 0, 50vh));
  }
  .scrim { align-items: flex-end; justify-content: center; padding: 0; }
  .sheet { max-height: var(--seg-b); border-radius: 22px 22px 0 0; animation: rise .26s cubic-bezier(.2, .8, .2, 1); }
  #toasts, body.lock #toasts { top: max(16px, calc(var(--seg-t) - 84px)); bottom: auto; }
  .kiosk-idle { min-height: 100dvh; padding-block: 0; grid-template-rows: var(--seg-t) var(--seg-b); row-gap: var(--hinge-v); align-content: stretch; }
  .kiosk-idle .k-top, .kiosk-idle .k-bottom { align-self: center; }
  .kiosk-signin { display: grid; grid-template-rows: var(--seg-t) var(--seg-b); row-gap: var(--hinge-v); height: 100dvh; }
  .kiosk-signin .k-top { overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
  .kiosk-signin .k-read { align-content: center; padding-block: 8px; }
  .kiosk-signin .k-bottom { align-self: center; padding-block: 8px; }
}

@media print {
  body * { visibility: hidden; }
  .print-area, .print-area * { visibility: visible; }
  .print-area { position: absolute; inset: 0; padding: 24px; }
  .no-print { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/**
 * One request. The token is fixed when the call starts (data.token, or the current one): a reply that arrives after
 * a sign-out never changes whose request it was.
 */
async function api(action, data, opt) {
  opt = opt || {};
  if (FRAMED) throw Object.assign(new Error('Framed'), { code: 'FRAMED' });
  const payload = Object.assign({ action, device: S.kiosk && !opt.staff ? 'kiosk' : 'phone', lang: S.lang }, data || {});
  if (S.kiosk && !opt.staff) payload.kioskKey = store.get('kioskKey', '');
  if (!('token' in payload)) payload.token = opt.staff ? S.staffToken : S.token;
  const body = JSON.stringify(payload);
  if (!CONFIG.API_URL) throw Object.assign(new Error('No backend'), { code: 'NO_API' });
  if (!API_OK(CONFIG.API_URL)) throw Object.assign(new Error('Not an Apps Script web app link'), { code: 'BAD_API' });
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;

function kidsProblem(kids) {
  for (const k of kids) {
    if (!String(k.first || '').trim()) return t('err_NEED_KID_NAME');
    if (!k.grade) return t('err_NEED_GRADE');
  }
  return '';
}
ACT['su-next'] = async () => {
  const f = S.forms.signup;
  f.error = '';
  if (f.step === 1) {
    if (!f.first.trim() || !f.last.trim()) f.error = t('err_NEED_NAME');
    else if (!f.phone.trim() && !f.email.trim()) f.error = t('err_NEED_CONTACT');
    else if (f.phone.trim() && f.phone.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '').length !== 10) f.error = t('err_BAD_PHONE');
    else if (f.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) f.error = t('err_BAD_EMAIL');
    if (!f.error) { f.step = 2; f.kids.forEach(k => { if (!k.last) k.last = f.last.trim(); }); }
    render(); window.scrollTo(0, 0); return;
  }
  if (f.step === 2) {
    f.error = kidsProblem(f.kids);
    if (!f.error) f.step = 3;
    render(); window.scrollTo(0, 0); return;
  }
  if (!newPinOk(f.pin)) { f.error = t('err_PIN_FORMAT'); render(); return; }
  if (f.pin !== f.pin2) { f.error = t('pinMismatch'); render(); return; }
  if (f.busy) return;
  f.busy = true; render();
  const gen = S.gen;
  try {
    const d = await api('signup', {
      token: undefined, pin: f.pin, remember: f.remember !== false, clientId: f.key,
      adult: { first: f.first, last: f.last, phone: f.phone, email: f.email, relationship: f.relationship, lang: S.lang },
      kids: f.kids.map(k => ({ first: k.first, last: k.last, grade: k.grade, teacher: k.teacher }))

    S.forms.signup = null;
    afterSignIn(d, f.remember !== false);

    f.busy = false; f.error = errText(e);
    if (e.code === 'PIN_WEAK' || e.code === 'PIN_FORMAT') { f.pin = ''; f.pin2 = ''; }
    if (/NEED_NAME|NEED_CONTACT|BAD_PHONE|BAD_EMAIL|ACCOUNT_EXISTS/.test(e.code)) f.step = 1;
    if (/NEED_KID|NEED_GRADE|TOO_MANY/.test(e.code)) f.step = 2;

    render();

};

/* ---------- Offline outbox: absences sent with no signal go out later, from the same person's phone only ---------- */
const OUTBOX_HOURS = 12;
let flushTimer = null, flushDelay = 2000;
function outboxAdd(item) {
  if (S.kiosk) return;
  S.outbox.push(item); store.set('outbox', S.outbox); scheduleFlush(flushDelay);
}
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flushOutbox, ms); }
/** Keeps only what the person signed in now queued, from the last few hours. Anything else is dropped unsent. */
function pruneOutbox() {
  const me = S.home && S.home.me && S.home.me.id, cut = Date.now() - OUTBOX_HOURS * 3600000;
  const keep = S.outbox.filter(x => x && x.owner && x.owner === me && x.at > cut);
  if (keep.length !== S.outbox.length) { const dropped = S.outbox.length - keep.length; S.outbox = keep; store.set('outbox', keep); if (dropped && me) toast(t('outboxDropped'), 'error'); }
}
async function flushOutbox() {
  if (S.kiosk) { S.outbox = []; return; }
  pruneOutbox();
  if (!S.outbox.length || !S.token) return;
  const item = S.outbox[0], token = S.token, gen = S.gen;
  try {
    const res = await api('entry.create', Object.assign({}, item.payload, { token }));
    if (gen !== S.gen || S.token !== token) return;
    S.outbox.shift(); store.set('outbox', S.outbox); flushDelay = 2000;
    mergeCreated(res); toast(t('sentLater'));
    if (S.flow && S.flow.clientId === item.payload.clientId) { S.flow.status = 'saved'; S.flow.result = res; renderSheet(); }
    if (S.outbox.length) scheduleFlush(300); else render();
  } catch (e) {
    if (gen !== S.gen || S.token !== token) return;
    if (e.code === 'NETWORK') { flushDelay = Math.min(flushDelay * 2, 30000); scheduleFlush(flushDelay); return; }
    S.outbox.shift(); store.set('outbox', S.outbox);
    toast(t('failed', { msg: errText(e) }), 'error'); render();
  }
}

async function kioskLogin() {
  const k = S.k, gen = S.gen;
  k.busy = true; render();
  try {
    const d = await api('login', { id: k.mode === 'email' ? k.email : k.phone, pin: k.pin, remember: false, device: 'kiosk', token: undefined });
    if (gen !== S.gen || !S.kiosk || S.k !== k) { api('logout', { token: d.token }).catch(() => {}); return; }
    if (d.mustChangePin) {
      S.recovery = { token: d.token, reason: d.mustChangePin, first: (d.me && d.me.first) || '', remember: false };
      S.forms.newpin = { pin: '', pin2: '' };
      if (d.me && d.me.lang && !store.get('langChosen', false)) S.lang = d.me.lang;
      S.k = { step: 'recovery' };
      render(); kioskIdleTimer();
      return;
    }
    S.token = d.token; S.home = d.home;
    S.k = { step: 'home' };

function viewRowFor(e, showNotes) {
  const reason = e.reason === 'Other' ? (showNotes ? e.note : 'Other (see the app)') : e.reason;
  const adult = !e.reporterKind || e.reporterKind === 'Adult';
  const reporter = e.reporter + (adult && e.relationship ? ' (' + e.relationship + ')' : '');
  const md = d => { const p = d.split('-'); return +p[1] + '/' + +p[2] + '/' + p[0]; };
  const recv = String(e.receivedAt || e.createdAt), sub = enStamp(recv);
  const left = e.type === 'EARLY' && e.status === 'PICKED_UP' && e.statusAt ? enStamp(e.statusAt) : '';

  let comment;
  if (e.type === 'EARLY') comment = `${reason} – signed out ${enTime(e.time)} by ${reporter}${left ? ' – left ' + left : ''}`;
  else if (e.type === 'ABSENT') comment = `${reason} – reported by ${reporter} on ${md(recv.slice(0, 10)).replace(/\/\d{4}$/, '')} ${sub}`;
  else comment = `${reason} – arrived ${enTime(e.time)}${e.minutesLate != null ? ', ' + e.minutesLate + ' min late' : ''} – reported by ${reporter}`;
  let status = STATUS_NAME[e.status] || e.status;
  if (e.status === 'VOIDED' && e.voidReason) status += ' (' + e.voidReason + ')';
  const a = e.authority || { state: 'PENDING', text: [] };
  let review = a.state === 'AUTHORIZED' ? 'Approved' : adult ? 'Pending: ' + (a.text || []).join(', ') : 'Office entry';
  if (e.status === 'PICKED_UP' && e.releaseCheck) review = RELEASE_TEXT[e.releaseCheck] + (e.releaseCheck === 'EXCEPTION' ? ' (exception)' : '') + ' · ' + review;
  return [md(e.date), e.student, e.grade, e.teacher, TYPE_NAME[e.type], time, reason, comment, e.reporter, adult ? e.relationship : 'Office entry', md(recv.slice(0, 10)) + ' ' + sub, status, review, e.location || '', e.id];
}

function reviewItems(g) {

const PAT_COLS = d => [['name', 'Student'], ['TARDY', 'Tardies'], ['over', `Over ${d.flag} min`], ['EARLY', 'Early releases'], ['ABSENT', 'Absences'], ['last', 'Last entry']];

/* Weekly chart: three small charts that share the week axis, one per kind of entry */
function niceMax(v) {
  if (v <= 5) return Math.max(1, Math.ceil(v));
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}
function colPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h), f = n => Math.round(n * 10) / 10;
  return `M${f(x)},${f(y + h)}V${f(y + r)}Q${f(x)},${f(y)} ${f(x + r)},${f(y)}H${f(x + w - r)}Q${f(x + w)},${f(y)} ${f(x + w)},${f(y + r)}V${f(y + h)}Z`;
}
const monthShort = d => new Intl.DateTimeFormat('en-US', { month: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, 15)));
let patRO = null;
function drawPatChart() {
  const box = $('#pat-chart'), p = S.office.pat;
  if (!box || !p || !p.data) return;
  const weeks = p.data.weeks, W = Math.max(260, Math.floor(box.clientWidth || 600));
  const rowH = 70, labelH = 26, gapY = 18, axisH = 22, padL = 34, padR = 4;
  const H = TYPES.length * (labelH + rowH + gapY) - gapY + axisH;
  const n = Math.max(1, weeks.length), slot = (W - padL - padR) / n;
  const bw = Math.max(2, Math.min(24, slot - Math.max(2, slot * 0.36)));
  const out = [`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`,
    `<rect class="pat-hl" x="0" y="${labelH - 6}" width="${slot}" height="${H - axisH - labelH + 10}" rx="6" visibility="hidden"/>`];
  TYPES.forEach((tp, ti) => {
    const top = ti * (labelH + rowH + gapY), y0 = top + labelH, base = y0 + rowH;
    const nice = niceMax(Math.max(0, ...weeks.map(w => w[tp])));
    out.push(`<rect x="0" y="${top + 3}" width="10" height="10" rx="3" class="pat-col ${tp}"/><text class="pat-lbl" x="16" y="${top + 12}">${TYPE_PLURAL[tp]}</text>`);
    out.push(`<line class="pat-grid" x1="${padL}" x2="${W - padR}" y1="${y0 + 0.5}" y2="${y0 + 0.5}"/><text x="${padL - 8}" y="${y0 + 4}" text-anchor="end">${nice}</text>`);
    out.push(`<line class="pat-grid" x1="${padL}" x2="${W - padR}" y1="${base + 0.5}" y2="${base + 0.5}"/><text x="${padL - 8}" y="${base + 4}" text-anchor="end">0</text>`);
    weeks.forEach((w, i) => {
      if (!w[tp]) return;
      const h = Math.max(3, w[tp] / nice * rowH);
      out.push(`<path class="pat-col ${tp}" d="${colPath(padL + i * slot + (slot - bw) / 2, base - h, bw, h)}"/>`);
    });
  });
  let lastM = '', lastX = -99;
  weeks.forEach((w, i) => {
    const m = w.start.slice(0, 7), x = padL + i * slot;
    if (m === lastM) return;
    lastM = m;
    if (x - lastX < 36) return;
    lastX = x;
    out.push(`<text x="${(x + 1).toFixed(1)}" y="${H - 5}">${monthShort(w.start)}</text>`);
  });
  out.push('</svg>');
  box.innerHTML = out.join('') + '<div class="pat-tip" hidden></div>';
  box._geo = { padL, slot, n, H, axisH };
  box._w = box.clientWidth;
  box.onpointermove = box.onpointerdown = e => {
    const r = box.getBoundingClientRect(), g = box._geo, x = e.clientX - r.left, y = e.clientY - r.top;
    if (x < g.padL - 4 || y > g.H - g.axisH + 6) { hidePatTip(); return; }
    const i = Math.max(0, Math.min(g.n - 1, Math.floor((x - g.padL) / g.slot)));
    if (i !== S.office.pat.hl || $('.pat-tip', box).hidden) showPatTip(i);
  };
  box.onpointerleave = e => { if (e.pointerType === 'mouse') hidePatTip(); };
  box.onblur = () => hidePatTip();
  box.onkeydown = e => {
    const last = box._geo.n - 1, cur = S.office.pat.hl;
    let i;
    if (e.key === 'ArrowRight') i = cur == null ? 0 : Math.min(last, cur + 1);

function splitRow(line, delim) {
  if (delim === '\t') return line.split('\t');
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }

    else if (c === delim) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

function parseRoster(text) {

  const ni = fi < 0 || li < 0 ? col(/^(student|student name|name|full name|student full name|lastfirst|last first|last, first)$/) : -1;
  const gi = head.findIndex(h => /^(grade|gr|grd|grade level|grade lvl)$/.test(h) || /^grade\b/.test(h));
  const ti = head.findIndex(h => /(teacher|homeroom)/.test(h) && !/(mother|father|parent|guardian)/.test(h));
  const pis = head.map((h, i) => (/(phone|cell|mobile|tel)/.test(h) && !/teacher/.test(h) ? i : -1)).filter(i => i >= 0);
  const eis = head.map((h, i) => (/e-?mail/.test(h) && !/teacher/.test(h) ? i : -1)).filter(i => i >= 0);
  if ((fi < 0 || li < 0) && ni < 0) return { error: 'The first row needs column names such as First Name and Last Name, or Student Name.' };
  const rows = [];
  lines.slice(1).forEach(l => {
    const c = splitRow(l, delim).map(x => x.trim());
    let first = '', last = '';
    if (fi >= 0 && li >= 0) { first = c[fi] || ''; last = c[li] || ''; }
    else {

    });

  if (ti >= 0) found.push('teacher');
  if (pis.length) found.push(plural(pis.length, 'phone column', 'phone columns'));

/* Logo upload: shrink to 256 px, keep transparency, pick the main color */
function logoAccent(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data, buckets = {};
  for (let i = 0; i < d.length; i += 8) {
    if (d[i + 3] < 160) continue;
    const r = d[i], g = d[i + 1], b = d[i + 2], hsl = rgbToHsl(r, g, b);
    if (hsl[1] < .25 || hsl[2] < .1 || hsl[2] > .9) continue;
    const k = Math.round(hsl[0] / 15) % 24, bk = buckets[k] || (buckets[k] = { n: 0, r: 0, g: 0, b: 0 }), wt = hsl[1];
    bk.n += wt; bk.r += r * wt; bk.g += g * wt; bk.b += b * wt;
  }
  let best = null;
  Object.keys(buckets).forEach(k => { if (!best || buckets[k].n > best.n) best = buckets[k]; });
  return best ? rgbToHex(best.r / best.n, best.g / best.n, best.b / best.n) : null;
}
ACT['adm-logo-file'] = el => {
  const file = el.files && el.files[0], a = S.office.admin;
  if (!file) return;
  a.logoError = '';
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let size = 256, out = '';
      for (let attempt = 0; attempt < 4; attempt++) {
        const scale = Math.min(1, size / Math.max(img.naturalWidth || size, img.naturalHeight || size));
        const w = Math.max(1, Math.round((img.naturalWidth || size) * scale)), h = Math.max(1, Math.round((img.naturalHeight || size) * scale));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        out = c.toDataURL('image/png');
        if (attempt === 0) a.logoAccentAuto = logoAccent(ctx, w, h);
        if (out.length < 140000) break;
        size = Math.round(size * .75);
      }
      a.logoDraft = { dataUrl: out, accent: a.logoAccentAuto || a.settings.AccentColor || '#2456C5' };
      renderOfficeMain();
    };
    img.onerror = () => { a.logoError = 'That file could not be read as an image.'; renderOfficeMain(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};
ACT['adm-save-logo'] = async () => {
  const a = S.office.admin;
  const accent = (a.logoDraft && a.logoDraft.accent) || a.settings.AccentColor;
  try {
    const payload = { accent };
    payload.dataUrl = a.logoDraft ? a.logoDraft.dataUrl : (S.logo && S.logo.dataUrl) || '';
    const r = await oapi('admin.saveLogo', payload);
    S.logo = { version: r.logoVersion, dataUrl: payload.dataUrl }; store.set('logo', S.logo);
    if (S.cfg) { S.cfg.school.accent = r.accent; S.cfg.school.logoVersion = r.logoVersion; store.set('cfg', S.cfg); }
    a.logoDraft = null; a.accentChanged = false; a.settings.AccentColor = r.accent;
    toast('Logo and color saved'); render();
  } catch (e) { toast(e.message, 'error'); }
};
ACT['adm-remove-logo'] = async () => {
  try {
    const r = await oapi('admin.saveLogo', { dataUrl: '' });
    S.logo = { version: r.logoVersion, dataUrl: '' }; store.set('logo', S.logo); S._logo = null;
    if (S.cfg) { S.cfg.school.logoVersion = r.logoVersion; store.set('cfg', S.cfg); }
    toast('Logo removed'); render();
  } catch (e) { toast(e.message, 'error'); }
};

/* QR signs */
ACT['adm-qr'] = () => openSheet({ kind: 'qr' });
SHEETS.qr = () => {
  const base = appBaseUrl();
  const sign = (title, sub, url) => `<div class="qr-card">${logoTag()}<div class="big">${esc(title)}</div><div class="muted">${esc(sub)}</div><div data-qr="${esc(url)}" style="width:100%;display:grid;place-items:center;min-height:200px"><div class="spin"></div></div><div class="tiny muted" style="overflow-wrap:anywhere">${esc(url)}</div></div>`;
  return {
    title: 'QR signs',
    body: `<p class="small muted">Print these for the drop-off curb and the front office. Scanning opens the app straight to the right step and checks that the parent is on campus; parents who are signed in on their phone are two taps from done.</p>
      <div class="qr-sheet print-area">${sign('Here after the bell?', 'Scan to report a tardy · Escanee para avisar llegada tarde', base + '#go-tardy')}${sign('Picking up early?', 'Scan when you arrive · Escanee al llegar', base + '#go-early')}${sign('New family?', 'Scan to create your profile · Escanee para crear su perfil', base + '#signup')}</div>`,
    foot: `<button class="btn block no-print" data-a="print">Print signs</button>`,
    after: root => fillQr(root)
  };
};
ACT.print = () => { try { window.print(); } catch (e) { /* not allowed here */ } };

/* ---------- Rendering, events and start-up ---------- */
/* The first screen when the app can't load its settings: says which part of the setup to fix. */
function setupNeeded(e) {
  const code = e && e.code;
  const url = String(CONFIG.API_URL || '');
  const shown = url.length > 64 ? url.slice(0, 44) + '…' + url.slice(-14) : url;
  let title, lead = '', steps;
  if (code === 'NO_API' || code === 'BAD_API') {
    title = 'Connect this app to its Google Sheet';
    if (code === 'BAD_API') lead = `The address in index.html is not an Apps Script web app link: <code style="overflow-wrap:anywhere">${esc(shown)}</code>`;
    steps = ['Open index.html in a text editor and search for <b>checkin-api-url</b>.', 'Paste the web app URL from Apps Script (Deploy, then Manage deployments; it starts with https://script.google.com/ and ends in /exec) between the quotes after content=.', 'Save and upload the file again.'];
  } else if (code === 'KEY_MISSING' || code === 'KEY_MISMATCH') {
    title = 'The data key needs to be restored';
    lead = 'Parent phone numbers and emails are stored encrypted, and this copy of the script does not have the key that opens them.';
    steps = ['Open the System sheet and choose <b>School Check-In &gt; Restore the data key</b>.', 'Paste the data recovery key that was saved at setup (it starts with SCK2-, or SCK1- for a key from version 1).', 'Then tap Try again.'];
  } else if (code === 'NOT_SET_UP') {
    title = 'One step left: run setup';
    lead = 'The web app answered, but its System sheet is not set up yet.';
    steps = ['In the Apps Script editor, pick <b>setup</b> in the toolbar and click Run.', 'In the System sheet, choose <b>School Check-In &gt; Show the first admin sign-in</b>, and save the data recovery key from the same menu.', 'Then tap Try again.'];
  } else if (code === 'NETWORK') {
    title = T('err_NETWORK');
    lead = 'If the connection is fine, the web app link needs a look:';
    steps = [`This app calls <code style="overflow-wrap:anywhere">${esc(shown)}</code>. It should end in /exec.`, 'In Apps Script, Deploy, then Manage deployments, must show <b>Who has access: Anyone</b>.', 'After pasting or changing the code, edit the deployment and pick Version: New version. Opening the link in a private window should show "ok": true.'];
  } else {
    title = 'The web app answered with an error';
    steps = [esc((e && e.message) || 'Unknown error')];
  }
  return `<main class="wrap main stack" lang="en"><div class="hero"><span class="mono">!</span><h1>${title}</h1></div>${lead ? `<p class="muted">${lead}</p>` : ''}
    <ol class="note" style="display:grid;gap:8px;padding-left:34px;margin:0">${steps.map(x => `<li>${x}</li>`).join('')}</ol>
    ${code === 'NO_API' || code === 'BAD_API' ? '' : `<button class="btn block" data-a="retry">${icon('refresh', 20)} ${T('tryAgain')}</button>`}</main>`;
}
ACT.retry = () => { $('#app').innerHTML = '<div class="splash"><div class="spin"></div></div>'; loadConfig(); };
ACT['close-sheet'] = () => closeSheet();

/** Shown instead of the app inside another site's frame. */
function framedHtml() {
  return `<main class="wrap main stack" lang="en"><h1>Open this page on its own</h1><p class="muted">For safety, the check-in app does not run inside another page.</p><a class="btn block" href="${esc(location.href.split('#')[0])}" target="_top" rel="noopener">Open it</a></main>`;
}
function render() {
  const app = $('#app');
  if (FRAMED) { app.innerHTML = framedHtml(); return; }
  applyBrand();
  if (!S.cfg) { app.innerHTML = '<div class="splash"><div class="spin" role="status" aria-label="Loading"></div></div>'; return; }
  let html;
  // The school iPad shows only the iPad screens, whatever the address says: staff leave it by holding the logo and signing in.
  if (S.kiosk) html = KioskView();
  else if (S.route === 'office') html = OfficeView();
  else if (S.recovery) html = RecoveryView();
  else if (S.route === 'invite' && S.pendingInvite) html = InviteView();
  else if (!S.token) html = S.route === 'signup' ? SignupView() : S.route === 'forgot' ? ForgotView() : WelcomeView();
  else if (!S.home) { html = '<div class="splash"><div class="spin"></div></div>'; refreshHome(true); }
  else html = S.route === 'history' ? HistoryView() : S.route === 'family' ? FamilyView() : S.route === 'account' ? AccountView() : HomeView();
  app.innerHTML = html;
  document.body.dataset.view = S.kiosk ? 'kiosk' : S.route === 'office' ? 'office' : 'parent';
  if (S.kiosk) keepAwake();
  afterRender();
}
function afterRender() {
  const app = $('#app');
  fillQr(app);
  const tb = $('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4);
  if (S.route === 'office' && !S.kiosk) afterOffice();
  if (S.deepGo && S.token && S.home && !S.sheet && !S.kiosk && S.route === 'home') {
    const tp = S.deepGo; S.deepGo = null;
    if (tp === 'EARLY' ? S.home.kids.length : guardianKids().length) startFlow(tp);
  }
}
function afterOffice() {
  if (S.staffToken && S.office.tab === 'today' && !S.office.board) loadBoard(true);
  if (S.office.tab === 'patterns') drawPatChart();
  updateLive(); applyTitle();
}
const _updateBoard = updateBoard;
updateBoard = function () {
  const a = document.activeElement, card = a && a.closest ? a.closest('[data-card]') : null, id = card && card.dataset.card;
  _updateBoard();
  if (id) { const c = $(`[data-card="${CSS.escape(id)}"]`); if (c) c.focus({ preventScroll: true }); }
};

function setPath(root, path, v) {
  const p = path.split('.');
  let o = root;
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null) o[p[i]] = {}; o = o[p[i]]; }
  o[p[p.length - 1]] = v;
}
document.addEventListener('click', e => {
  if (FRAMED) return;
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'scrim') { if (e.target === el && S.sheet && !S._noClose) closeSheet(); return; }
  if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  if (FRAMED) return;
  const el = e.target, d = el.dataset;
  if (d.f) { setPath(S.forms, d.f, el.type === 'checkbox' ? el.checked : el.value); return; }
  if (d.ff && S.flow) { S.flow[d.ff] = el.value; S.flow.error = ''; if (d.ff === 'date' && S.flow.endDate && S.flow.endDate < el.value) S.flow.endDate = el.value; return; }
  if (d.sf && S.sheet) { S.sheet[d.sf] = el.value; return; }
  if (d.oq) { S.office.q = el.value; updateBoard(); return; }
  if (d.famq) { S.office.fam.q = el.value; famSearch(); return; }
  if (d.logq) { S.office.log.q = el.value; logSearch(); return; }
  if (d.oadd && S.forms.oadd) { S.forms.oadd[d.oadd] = el.value; if (d.oadd === 'q') oaddSearch(); return; }
  const a = S.office.admin;
  if (!a) return;
  if (d.adm) {
    a.settings[d.adm] = el.value;
    // Pasting "33.13167, -117.20222" (or a Google Maps link) into either box fills both.
    const m = d.latlng && /(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/.exec(el.value);
    if (m) { a.settings.SchoolLat = m[1]; a.settings.SchoolLng = m[2]; renderOfficeMain(); }
  }
  else if (d.admT) a.teachers[+d.admT].name = el.value;
  else if (d.admR) a.reasons[+d.admR][d.k] = el.value;
  else if (d.admS) a.staff[+d.admS][d.k] = el.value;
  else if (d.admNew) a.newStaff[d.admNew] = el.value;
  else if (d.calPaste) a.calPaste = el.value;
  else if (d.admAccent) { if (a.logoDraft) a.logoDraft.accent = el.value; else { a.settings.AccentColor = el.value; a.accentChanged = true; } const sw = $('.swatch'); if (sw) sw.style.background = el.value; }
  else if (d.admYear) { a.yearConfirm = el.value; const b = $('[data-a="adm-year-run"]'); if (b) b.disabled = !a.yearPreview || el.value !== a.yearPreview.to; }
});
document.addEventListener('change', e => {
  if (FRAMED) return;
  const el = e.target, d = el.dataset;
  if (d.aChange) { const fn = ACT[d.aChange]; if (fn) fn(el, e); return; }
  if (d.f && el.type === 'checkbox') { setPath(S.forms, d.f, el.checked); return; }
  if (d.ff && (el.type === 'date' || el.type === 'time')) { renderSheet(); return; }
  if (d.admAccent) renderOfficeMain();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]');
  if (!f) return;
  e.preventDefault();
  if (FRAMED) return;
  const fn = ACT[f.dataset.submit];
  if (fn) fn(f, e);
});
document.addEventListener('keydown', e => {
  if (FRAMED) return;
  if (e.key === 'Escape' && S.sheet && !S._noClose) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.id === 'f-note') { e.preventDefault(); sendFlow(); return; }
  if (e.key === 'Enter' && e.target.id === 'oadd-q') { e.preventDefault(); return; }
  if (S.route !== 'office' || S.kiosk || !S.staffToken || S.office.tab !== 'today' || S.sheet) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (typing) {
    if (e.key === 'Escape') e.target.blur();
    if (e.key === 'ArrowDown' && e.target.id === 'o-q') { const c = $('[data-card]'); if (c) { e.preventDefault(); c.focus(); } }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); const q = $('#o-q'); if (q) q.focus(); return; }
  if (e.key === 'r' || e.key === 'R') { S.office.etag = null; loadBoard(true); toast('Refreshed'); return; }
  const card = e.target.closest && e.target.closest('[data-card]');
  if (!card) return;
  const k = e.key.toLowerCase();
  if (k === 'c') { const b = $('[data-s="CHECKED_IN"]', card); if (b) b.click(); }
  else if (k === 'p') { const b = $('[data-s="PICKED_UP"]', card); if (b) b.click(); }
  else if (e.key === 'Enter') { const b = $('[data-a="o-entry"]', card); if (b) b.click(); }
  else if (/^Arrow/.test(e.key)) {
    e.preventDefault();
    const lane = card.closest('.lane'), lanes = $$('.lane').filter(l => l.offsetParent);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const cards = $$('[data-card]', lane), i = cards.indexOf(card), n = cards[i + (e.key === 'ArrowDown' ? 1 : -1)];
      if (n) n.focus();
    } else {
      const nl = lanes[lanes.indexOf(lane) + (e.key === 'ArrowRight' ? 1 : -1)];
      const c = nl && $('[data-card]', nl); if (c) c.focus();
    }
  }
});
let pressTimer = null;
document.addEventListener('pointerdown', e => {
  if (S.kiosk) { kioskIdleTimer(); keepAwake(); }
  if (S.route === 'office') unlockAudio();
  const el = e.target.closest && e.target.closest('[data-press]');
  if (!el) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { pressTimer = null; if (el.dataset.press === 'kiosk-exit' && S.kiosk) openSheet({ kind: 'kioskExit', login: '', pin: '' }); }, 3000);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(pressTimer); pressTimer = null; }, true));
document.addEventListener('keydown', () => { if (S.kiosk) kioskIdleTimer(); if (S.route === 'office') unlockAudio(); }, true);
window.addEventListener('scroll', () => { const tb = $('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
window.addEventListener('hashchange', () => {
  if (FRAMED) { render(); return; }
  if (S.sheet) closeSheet();
  const prev = S.route;
  S.route = routeFromHash();
  if (S.route === 'history' && prev !== 'history') S.hist = null;
  render(); window.scrollTo(0, 0);
});
window.addEventListener('online', () => scheduleFlush(300));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.token && !S.kiosk && S.route !== 'office' && !S.recovery) refreshHome(true);
  // Back from turning location on in Settings: check again without making them tap.
  if (S.sheet && S.sheet.kind === 'flow' && S.flow && S.flow.step === 'form' && needsGeo(S.flow.type) && S.geo && S.geo.state !== 'ok' && S.geo.state !== 'pending') startGeo(true);
  pollOffice(true);
  keepAwake();
});
setInterval(pollOffice, 4000);
// While a parent waits at the office, their phone shows the office's answer without a refresh.
setInterval(() => {
  if (S.token && !S.kiosk && S.route === 'home' && document.visibilityState === 'visible' && pendingAtOffice()) refreshHome(true);
}, 15000);
/* The school iPad's screen stays on while it waits for families (Safari 16.4+, Chrome). */
let wakeLock = null;
async function keepAwake() {
  if (!S.kiosk || wakeLock || document.visibilityState !== 'visible' || !('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
  catch (e) { /* not allowed right now; tried again on the next tap */ }
}
setInterval(() => {
  tickKioskClock();
  if (S.route === 'office' && !S.kiosk && S.office.tab === 'today' && S.office.board && !S.sheet) { updateBoard(); updateLive(); }
}, 30000);

async function loadConfig() {
  try {
    const c = await api('config', { token: undefined });
    S.cfg = c; store.set('cfg', c);
    const v = c.school.logoVersion;
    if (!v || v === '0') { if (S.logo) { S.logo = null; store.del('logo'); } }
    else if (!S.logo || S.logo.version !== v) {
      try { const l = await api('logo', { token: undefined }); S.logo = { version: l.version, dataUrl: l.dataUrl }; store.set('logo', S.logo); } catch (e) { /* keep the old one */ }
    }
    if (!isTyping() && !S.sheet) render(); else applyBrand();
    if (S.token && !S.kiosk) refreshHome(true);
  } catch (e) {
    if (!S.cfg) $('#app').innerHTML = setupNeeded(e);
  }
}
function boot() {
  // Never inside another site's frame: nobody can dress the office screen up as something else.
  if (FRAMED) { $('#app').innerHTML = framedHtml(); return; }
  S.route = routeFromHash();
  const inv = qs.get('invite');
  if (inv) { S.pendingInvite = inv.toUpperCase(); S.route = 'invite'; }
  const g = qs.get('go');
  if (g && /^(tardy|early|absent)$/i.test(g)) S.deepGo = g.toUpperCase();
  if (qs.has('office') || S.pendingKiosk) S.route = 'office';
  if (S.kiosk) { S.token = null; S.home = null; }
  render();
  loadConfig();
  if (S.pendingKiosk && S.staffToken && !S.kiosk) ACT['o-kiosk']();
  if (S.outbox.length && !S.kiosk) scheduleFlush(1500);
}
boot();

})();
</script>
