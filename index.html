<style>
/* Layout: thumb-first single column on phones, two panes split at the fold on foldables and tablets,
   and a three-lane live board for the front office. Type: the device's own system face for speed. */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --surface-2: #EBEEF3; --surface-3: #DFE4EB; --line: #D7DDE6;
  --ink: #111723; --ink-2: #465163; --ink-3: #6B7688;
  --accent: #2456C5; --accent-ink: #FFFFFF; --accent-soft: #E3EAFA; --accent-strong: #193F95;
  --tardy: #8F4505; --tardy-soft: #FDEFC8; --tardy-line: #EFC064;
  --early: #4F2DAE; --early-soft: #ECE6FD; --early-line: #C5B6F6;
  --absent: #A8143B; --absent-soft: #FDE3E9; --absent-line: #F2A7B8;
  --ok: #08704E; --ok-soft: #D5F4E6; --warn: #845600; --warn-soft: #FFF0C7; --danger: #B42318; --danger-soft: #FDE4E1;
  --shadow-1: 0 1px 2px rgba(17,23,35,.06), 0 1px 1px rgba(17,23,35,.04);
  --shadow-2: 0 10px 28px rgba(17,23,35,.12), 0 2px 6px rgba(17,23,35,.06);
  --scrim: rgba(9,13,20,.42);
  --av-s: 70%; --av-l: 90%; --av-fs: 48%; --av-fl: 30%;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  --tap: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1016; --surface: #151A22; --surface-2: #1C222C; --surface-3: #262D39; --line: #2B3341;
    --ink: #EAEEF4; --ink-2: #AEB7C5; --ink-3: #848EA0;
    --accent: #86A6F6; --accent-ink: #0C1016; --accent-soft: #1B2743; --accent-strong: #B2C7FA;
    --tardy: #F5C452; --tardy-soft: #2D2310; --tardy-line: #5E4718;
    --early: #BBA7FA; --early-soft: #231C3E; --early-line: #46387E;
    --absent: #F6A3B5; --absent-soft: #35161F; --absent-line: #6D2B3D;
    --ok: #6BDFB1; --ok-soft: #10291F; --warn: #F2C35B; --warn-soft: #2C230C; --danger: #F6A19B; --danger-soft: #3A1715;
    --shadow-1: 0 1px 2px rgba(0,0,0,.45); --shadow-2: 0 12px 32px rgba(0,0,0,.55);
    --scrim: rgba(0,0,0,.62);
    --av-s: 36%; --av-l: 26%; --av-fs: 72%; --av-fl: 84%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1016; --surface: #151A22; --surface-2: #1C222C; --surface-3: #262D39; --line: #2B3341;
  --ink: #EAEEF4; --ink-2: #AEB7C5; --ink-3: #848EA0;
  --accent: #86A6F6; --accent-ink: #0C1016; --accent-soft: #1B2743; --accent-strong: #B2C7FA;
  --tardy: #F5C452; --tardy-soft: #2D2310; --tardy-line: #5E4718;
  --early: #BBA7FA; --early-soft: #231C3E; --early-line: #46387E;
  --absent: #F6A3B5; --absent-soft: #35161F; --absent-line: #6D2B3D;
  --ok: #6BDFB1; --ok-soft: #10291F; --warn: #F2C35B; --warn-soft: #2C230C; --danger: #F6A19B; --danger-soft: #3A1715;
  --shadow-1: 0 1px 2px rgba(0,0,0,.45); --shadow-2: 0 12px 32px rgba(0,0,0,.55);
  --scrim: rgba(0,0,0,.62);
  --av-s: 36%; --av-l: 26%; --av-fs: 72%; --av-fl: 84%;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 400 17px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); }
img { max-width: 100%; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.i { flex: none; display: block; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(26px, 6.4vw, 32px); line-height: 1.12; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 21px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 17px; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }
.eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Page frame */
.wrap { width: 100%; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main { padding-block: 8px 40px; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .2s; }
.topbar.scrolled { border-bottom-color: var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; text-decoration: none; color: inherit; }
.brand-name { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 36px; height: 36px; border-radius: 10px; object-fit: contain; flex: none; background: var(--surface); }
.mono { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px; letter-spacing: .02em; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.lang-btn { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.me-btn { border-radius: 999px; text-decoration: none; }
.nav-tabs { display: flex; gap: 4px; padding-block: 0 8px; overflow-x: auto; scrollbar-width: none; }
.nav-tabs::-webkit-scrollbar { display: none; }
.nav-tab { padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px; color: var(--ink-2); white-space: nowrap; text-decoration: none; }
.nav-tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* Two panes on foldables and tablets: the gap sits on the fold */
@media (min-width: 760px) {
  .wrap.wide { max-width: 1120px; }
  .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "a act" "b act"; grid-template-rows: auto 1fr; column-gap: 64px; align-items: start; }
  .pane-a { grid-area: a; } .pane-b { grid-area: b; }
  .panes > .pane-actions { grid-area: act; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); padding-top: 8px; }
}
@media (orientation: landscape) and (max-height: 540px) {
  .wrap.wide { max-width: 1120px; }
  .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "a act" "b act"; grid-template-rows: auto 1fr; column-gap: 32px; align-items: start; }
  .pane-a { grid-area: a; } .pane-b { grid-area: b; }
  .panes > .pane-actions { grid-area: act; }
  .topbar .wrap { min-height: 50px; }
  h1 { font-size: 24px; }
  .tile { min-height: 64px; }
}

/* Buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 20px; border-radius: 14px; border: 1px solid transparent; font-weight: 650; font-size: 17px; background: var(--accent); color: var(--accent-ink); text-decoration: none; transition: transform .1s ease, filter .15s ease; }
.btn:active { transform: scale(.98); }
.btn:hover { filter: brightness(1.05); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--line); }
.btn.soft { background: var(--surface-2); color: var(--ink); }
.btn.quiet { background: transparent; color: var(--ink-2); }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.ok { background: var(--ok); color: var(--surface); }
.btn.sm { min-height: 40px; font-size: 15px; padding: 0 14px; border-radius: 11px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.link-btn { color: var(--accent); font-weight: 600; font-size: 15px; padding: 10px 4px; display: inline-flex; align-items: center; gap: 6px; }
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > label, .label { font-size: 14px; font-weight: 650; color: var(--ink-2); }
.input { width: 100%; min-height: var(--tap); padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 17px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
.input.pin { font-family: var(--font-mono); font-size: 24px; letter-spacing: .45em; text-align: center; padding-inline: 8px; }
textarea.input { min-height: 88px; resize: vertical; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); gap: 2px; }
.seg button { padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.check { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.error { color: var(--danger); font-size: 15px; font-weight: 550; }
.note { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.accent { background: var(--accent-soft); color: var(--accent-strong); }
/* Location check at the top of the tardy and early release sheets */
.geo { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 14px; background: var(--surface-2); color: var(--ink-2); font-size: 15px; line-height: 1.4; }
.geo > .i { margin-top: 1px; }
.geo .spin { width: 18px; height: 18px; border-width: 2px; flex: none; margin-top: 1px; }
.geo.ok { background: var(--ok-soft); color: var(--ok); align-items: center; }
.geo.bad { background: var(--danger-soft); color: var(--danger); }
.geo.bad b { color: inherit; }
.geo.bad .tiny { color: var(--ink-2); display: block; margin-top: 6px; }
.geo.bad .btn.soft { background: var(--surface); color: var(--ink); }
.geo.demo { background: var(--accent-soft); color: var(--accent-strong); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.btn .spin { width: 18px; height: 18px; border-width: 2px; border-color: color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; }
.card-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; text-align: left; transition: background .12s, border-color .12s, transform .1s; }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.recent { border-style: dashed; }
.chip.grade { min-width: 52px; justify-content: center; font-variant-numeric: tabular-nums; }
.chip .sub { font-weight: 500; opacity: .75; font-size: 14px; }
.kid { display: inline-flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); min-height: 54px; font-weight: 600; transition: border-color .12s, background .12s; }
.kid[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.kid .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.kid[aria-pressed="true"] .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.av { --av: 40px; width: var(--av); height: var(--av); border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: calc(var(--av) * .38); background: hsl(var(--h) var(--av-s) var(--av-l)); color: hsl(var(--h) var(--av-fs) var(--av-fl)); letter-spacing: .02em; }
.shake { animation: shake .35s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 650; white-space: nowrap; }
.pill.TARDY { background: var(--tardy-soft); color: var(--tardy); }
.pill.EARLY { background: var(--early-soft); color: var(--early); }
.pill.ABSENT { background: var(--absent-soft); color: var(--absent); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.danger { background: var(--danger-soft); color: var(--danger); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.pill.void { background: var(--surface-2); color: var(--ink-3); text-decoration: line-through; }

/* Action tiles */
.tiles { display: grid; gap: 12px; }
.tile { display: grid; grid-template-columns: 56px 1fr 22px; align-items: center; gap: 14px; width: 100%; min-height: 86px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-1); text-align: left; transition: transform .12s ease, box-shadow .2s ease; }
.tile:active { transform: scale(.985); }
.tile:hover { box-shadow: var(--shadow-2); }
.tile .ic { width: 56px; height: 56px; border-radius: 17px; display: grid; place-items: center; }
.tile.TARDY .ic { background: var(--tardy-soft); color: var(--tardy); }
.tile.EARLY .ic { background: var(--early-soft); color: var(--early); }
.tile.ABSENT .ic { background: var(--absent-soft); color: var(--absent); }
.tile .t1 { display: block; font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.tile .t2 { display: block; color: var(--ink-3); font-size: 15px; }
.tile .go { color: var(--ink-3); }

/* Entry rows */
.list { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.entry { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 14px 14px; background: var(--surface); }
.entry + .entry { border-top: 1px solid var(--line); }
.entry .l1 { font-weight: 650; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.entry .l2 { color: var(--ink-2); font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; }
.entry .l3 { color: var(--ink-3); font-size: 14px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.day-head { padding: 18px 4px 8px; }
.empty { padding: 22px 16px; text-align: center; color: var(--ink-3); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-lg); font-size: 15px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 2px 10px; }

/* Bottom sheet, a dialog on wide screens, a side panel on phones held sideways */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 640px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 16px); display: flex; flex-direction: column; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: var(--shadow-2); animation: rise .26s cubic-bezier(.2, .8, .2, 1); overflow: hidden; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px)); position: relative; }
.sheet-head::before { content: ""; position: absolute; top: 6px; left: 50%; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--surface-3); }
.sheet-head h2 { flex: 1; padding-top: 14px; }
.sheet-head .icon-btn { margin-top: 8px; }
.sheet-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 8px max(20px, env(safe-area-inset-right, 0px)) 20px max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 20px; align-content: start; }
.sheet-foot { flex: none; padding: 12px max(20px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px; }
.sheet.done .sheet-body { background: var(--surface-2); }
.sheet .group { display: grid; gap: 10px; }
.sheet .group > .label { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
@media (min-width: 760px) {
  .scrim { align-items: center; padding: 24px; }
  .sheet { border-radius: 24px; max-height: min(88vh, 920px); }
  .sheet-head::before { display: none; }
  .sheet-head h2 { padding-top: 10px; }
  .sheet-foot { padding-bottom: 16px; }
}
@media (orientation: landscape) and (max-height: 540px) {
  .scrim { justify-content: flex-end; align-items: stretch; padding: 0; }
  .sheet { max-width: 62%; max-height: 100%; border-radius: 22px 0 0 22px; }
  .sheet-head::before { display: none; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }

/* The confirmation slip, modeled on the front desk's paper slip */
.slip { position: relative; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-2); overflow: hidden; }
.slip-band { display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-size: 12.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.slip-band .logo, .slip-band .mono { width: 28px; height: 28px; border-radius: 8px; font-size: 11px; }
.slip.TARDY .slip-band { background: var(--tardy-soft); color: var(--tardy); }
.slip.EARLY .slip-band { background: var(--early-soft); color: var(--early); }
.slip.ABSENT .slip-band { background: var(--absent-soft); color: var(--absent); }
.slip-main { padding: 20px 18px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.slip-main h2 { font-size: 22px; }
.slip-names { font-size: 18px; font-weight: 650; }
.slip-perf { height: 24px; position: relative; background: radial-gradient(circle at 0 50%, var(--surface-2) 11px, transparent 11.5px), radial-gradient(circle at 100% 50%, var(--surface-2) 11px, transparent 11.5px); }
.slip-perf::before { content: ""; position: absolute; left: 18px; right: 18px; top: 50%; border-top: 2px dashed var(--line); }
.slip-foot { padding: 4px 18px 16px; display: grid; gap: 4px; font-size: 14.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.slip-foot .row { justify-content: space-between; }
.stamp { display: inline-flex; align-items: center; gap: 6px; font-weight: 650; }
.stamp.ok { color: var(--ok); }
.stamp.wait { color: var(--ink-3); }
.stamp.err { color: var(--danger); }
.check-anim circle { stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw .5s ease-out forwards; }
.check-anim path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .35s .32s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.undo-btn { position: relative; }
.undo-n { font-variant-numeric: tabular-nums; opacity: .7; }

/* Welcome and sign-in */
.hero { display: grid; gap: 14px; justify-items: start; padding-block: 28px 8px; }
.hero .logo, .hero .mono { width: 64px; height: 64px; border-radius: 18px; font-size: 20px; }
.hero h1 { max-width: 16ch; }
.steps { display: flex; gap: 6px; }
.steps span { height: 5px; flex: 1; border-radius: 3px; background: var(--surface-3); }
.steps span.on { background: var(--accent); }
.kid-card { display: grid; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.foot-links { display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; padding-block: 18px 8px; }

/* Keypad (school iPad and staff sign-in) */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 360px; margin: 0 auto; }
.key { height: 72px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); font-size: 28px; font-weight: 600; box-shadow: var(--shadow-1); display: grid; place-items: center; font-variant-numeric: tabular-nums; transition: transform .08s, background .1s; }
.key:active { transform: scale(.95); background: var(--surface-2); }
.key.ghost { background: transparent; border-color: transparent; box-shadow: none; font-size: 15px; font-weight: 600; color: var(--accent); }
.pad-display { text-align: center; font-size: clamp(26px, 5vw, 34px); font-weight: 650; letter-spacing: .02em; min-height: 46px; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 16px; justify-content: center; min-height: 46px; align-items: center; }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-3); }
.dot.on { background: var(--ink); border-color: var(--ink); }

/* School iPad */
.kiosk .wrap { max-width: 980px; }
.kiosk-idle { min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: grid; place-items: center; text-align: center; padding-block: 32px; }
.kiosk-idle .logo, .kiosk-idle .mono { width: 112px; height: 112px; border-radius: 28px; font-size: 34px; }
.kiosk-idle h1 { font-size: clamp(30px, 5vw, 46px); max-width: 18ch; margin-inline: auto; }
.kiosk-clock { font-size: clamp(44px, 9vw, 84px); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.kiosk .tiles { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.kiosk .tile { min-height: 120px; }
.kiosk .tile .t1 { font-size: 23px; }

/* Front office */
.office { min-height: 100%; }
.office .wrap { max-width: 1480px; }
.o-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.o-top .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; flex-wrap: wrap; padding-block: 6px; }
.o-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.o-tabs::-webkit-scrollbar { display: none; }
.o-tab { padding: 9px 13px; border-radius: 10px; font-weight: 600; font-size: 15px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.o-tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--danger); color: var(--surface); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2.4s infinite; }
.live.off i { background: var(--warn); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.o-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 14px; }
.o-bar .input { min-height: 44px; max-width: 320px; }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-block: 4px 14px; }
.sum { border-radius: 16px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; text-align: left; }
.sum b { font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sum span { font-size: 14px; color: var(--ink-3); }
.sum.TARDY b { color: var(--tardy); } .sum.EARLY b { color: var(--early); } .sum.ABSENT b { color: var(--absent); }
.lanes { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
.lane { background: var(--surface-2); border-radius: 18px; padding: 10px; display: grid; gap: 8px; min-width: 0; }
.lane-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px; font-weight: 700; }
.lane-head .pill { margin-left: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 7px; box-shadow: var(--shadow-1); min-width: 0; }
.card:focus-visible { outline-offset: 1px; }
.card.TARDY { border-left: 4px solid var(--tardy-line); } .card.EARLY { border-left: 4px solid var(--early-line); } .card.ABSENT { border-left: 4px solid var(--absent-line); }
.card.closed { opacity: .66; }
.card.void { opacity: .5; }
.card.fresh { animation: fresh 2s ease; }
@keyframes fresh { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: var(--shadow-1); } }
.c-top { display: flex; gap: 10px; align-items: center; min-width: 0; }
.c-name { min-width: 0; flex: 1; }
.c-name b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-name span { display: block; font-size: 13.5px; color: var(--ink-3); }
.c-time { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.c-time small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.c-reason { font-size: 15px; font-weight: 550; overflow-wrap: anywhere; }
.c-meta { font-size: 13.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.c-where { display: flex; gap: 4px; align-items: flex-start; margin-top: 2px; }
.c-where .i { margin-top: 2px; }
.c-flags { display: flex; flex-wrap: wrap; gap: 6px; }
.c-actions { display: flex; gap: 8px; align-items: center; }
.c-actions .btn { flex: 1; }
.lane-switch { display: none; }
@media (max-width: 899px) {
  .lanes { grid-template-columns: 1fr; }
  .lane:not(.on) { display: none; }
  .lane-switch { display: flex; }
  .summary { gap: 8px; }
  .sum { padding: 10px; }
  .sum b { font-size: 22px; }
}
.split { display: grid; gap: 16px; }
@media (min-width: 1000px) { .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; } .split > .detail { position: sticky; top: 132px; } }
.fam { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; width: 100%; }
.fam.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.people { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.nowrap { white-space: nowrap; }
details.diff summary { cursor: pointer; color: var(--accent); font-size: 13.5px; }
details.diff pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; font-family: var(--font-mono); background: var(--surface-2); padding: 8px; border-radius: 8px; margin: 6px 0 0; }
.admin-grid { display: grid; gap: 16px; }
@media (min-width: 1000px) { .admin-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 18px; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.mini-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.reason-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.reason-row.off { opacity: .55; }
.logo-preview { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.logo-preview .logo, .logo-preview .mono { width: 72px; height: 72px; border-radius: 18px; font-size: 22px; }
.swatch { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); }
.qr-sheet { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.qr-card { border: 2px solid var(--line); border-radius: 20px; padding: 20px; text-align: center; display: grid; gap: 10px; justify-items: center; background: var(--surface); }
.qr-card svg { width: 100%; max-width: 220px; height: auto; background: #FFFFFF; border-radius: 10px; }
.qr-card .big { font-size: 24px; font-weight: 800; }
.temp-pin { font-family: var(--font-mono); font-size: 40px; font-weight: 700; letter-spacing: .2em; text-align: center; padding: 12px; border-radius: 16px; background: var(--surface-2); }

/* Toasts */
body.lock #toasts { bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
#toasts { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: grid; justify-items: center; gap: 8px; pointer-events: none; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.toast { pointer-events: auto; max-width: 520px; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow-2); font-size: 15px; font-weight: 550; display: flex; gap: 10px; align-items: center; animation: rise .2s ease; }
.toast.error { background: var(--danger); color: var(--surface); }
.splash { min-height: 70vh; display: grid; place-items: center; color: var(--ink-3); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media print {
  body * { visibility: hidden; }
  .print-area, .print-area * { visibility: visible; }
  .print-area { position: absolute; inset: 0; padding: 24px; }
  .no-print { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- Talking to the Google Sheet backend ---------- */
async function api(action, data, opt) {

  if (!('token' in payload)) payload.token = opt.staff ? S.staffToken : S.token;
  const body = JSON.stringify(payload);

    try { json = await window.__LOCAL_API__(body); } catch (e) { throw Object.assign(new Error('Preview error'), { code: 'SERVER' }); }
  } else {

function kidAt(el) { const f = S.forms[el.dataset.form]; return f.kids[+el.dataset.i]; }

ACT['kid-teacher'] = el => { const k = kidAt(el); if (el.dataset.v) { k.teacher = el.dataset.v; k.custom = false; } else { k.custom = true; k.teacher = ''; } rerenderForm(el, k.custom ? `#${el.dataset.form}-k${el.dataset.i}-teacher` : null); };
ACT['kid-remove'] = el => { const f = S.forms[el.dataset.form]; f.kids.splice(+el.dataset.i, 1); rerenderForm(el); };
function rerenderForm(el, focusSel) { if (S.sheet) renderSheet(); else render(); if (focusSel) { const x = $(focusSel); if (x) x.focus(); } }
ACT['su-rel'] = el => { S.forms.signup.relationship = el.dataset.v; render(); };
ACT['su-addkid'] = () => { const f = S.forms.signup; f.kids.push(blankKid(f.last)); render(); const x = $(`#signup-k${f.kids.length - 1}-first`); if (x) x.focus(); };
ACT['su-back'] = () => { const f = S.forms.signup; f.error = ''; f.step = Math.max(1, f.step - 1); render(); window.scrollTo(0, 0); };
function kidsProblem(kids) {
  for (const k of kids) {
    if (!String(k.first || '').trim()) return t('err_NEED_KID_NAME');
    if (!k.grade) return t('err_NEED_GRADE');
  }
  return '';
}
ACT['su-next'] = async () => {
  const f = S.forms.signup;
  f.error = '';
  if (f.step === 1) {
    if (!f.first.trim() || !f.last.trim()) f.error = t('err_NEED_NAME');
    else if (!f.phone.trim() && !f.email.trim()) f.error = t('err_NEED_CONTACT');
    else if (f.phone.trim() && f.phone.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '').length !== 10) f.error = t('err_BAD_PHONE');
    else if (f.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) f.error = t('err_BAD_EMAIL');
    if (!f.error) { f.step = 2; f.kids.forEach(k => { if (!k.last) k.last = f.last.trim(); }); }
    render(); window.scrollTo(0, 0); return;
  }
  if (f.step === 2) {
    f.error = kidsProblem(f.kids);
    if (!f.error) f.step = 3;
    render(); window.scrollTo(0, 0); return;
  }
  if (!/^\d{6}$/.test(f.pin)) { f.error = t('err_PIN_FORMAT'); render(); return; }
  if (f.pin !== f.pin2) { f.error = t('pinMismatch'); render(); return; }
  if (f.busy) return;
  f.busy = true; render();
  try {
    const d = await api('signup', {
      token: undefined, pin: f.pin, remember: f.remember !== false,
      adult: { first: f.first, last: f.last, phone: f.phone, email: f.email, relationship: f.relationship, lang: S.lang },
      kids: f.kids.map(k => ({ first: k.first, last: k.last, grade: k.grade, teacher: k.teacher }))
    });
    S.forms.signup = null;
    setSession(d.token, d.home, f.remember !== false);
    afterSignIn(d);
  } catch (e) {
    f.busy = false; f.error = errText(e);
    if (e.code === 'PIN_WEAK' || e.code === 'PIN_FORMAT') { f.pin = ''; f.pin2 = ''; }
    if (/NEED_NAME|NEED_CONTACT|BAD_PHONE|BAD_EMAIL|ACCOUNT_EXISTS/.test(e.code)) f.step = 1;
    if (/NEED_KID|NEED_GRADE/.test(e.code)) f.step = 2;
    render();
  }
};

/* ---------- Signed-in parent: home, entries, quick flows ---------- */
function topBarIn(active) {

  const tabs = [['home', 'home'], ['history', 'historyTitle'], ['family', 'familyTitle']];
  return `<header class="topbar"><div class="wrap wide"><a class="brand" href="#home">${logoTag()}<span class="brand-name">${esc(schoolShort())} Check-In</span></a>${langBtn()}

    <div class="wrap wide"><nav class="nav-tabs" aria-label="Sections">${tabs.map(x => `<a class="nav-tab" href="#${x[0]}" ${active === x[0] ? 'aria-current="page"' : ''}>${T(x[1])}</a>`).join('')}</nav></div></header>`;
}
function myRole(studentId) { const k = (S.home.kids || []).find(x => x.id === studentId); return k ? k.role : ''; }
function guardianKids() { return (S.home.kids || []).filter(k => k.role === 'Guardian'); }
function tileOrder() {
  const sc = S.cfg.school, now = schoolNow();
  const bell = mins(sc.bellStart) || 495, end = mins(dismissalFor(now.date)) || 900;
  if (isWeekend(now.date)) return ['ABSENT', 'EARLY', 'TARDY'];
  if (now.mins < bell + 120) return ['TARDY', 'ABSENT', 'EARLY'];
  if (now.mins < end) return ['EARLY', 'ABSENT', 'TARDY'];
  return ['ABSENT', 'EARLY', 'TARDY'];
}
function tilesHtml() {
  let types = tileOrder();
  if (!guardianKids().length) types = ['EARLY'];
  return `<div class="tiles">${types.map(tp => `<button class="tile ${tp}" data-a="flow" data-t="${tp}">
    <span class="ic">${icon(TYPE_ICON[tp], 28)}</span><span><span class="t1">${T(tp)}</span><span class="t2">${T(tp + '_hint')}</span></span><span class="go">${icon('chevR', 20)}</span></button>`).join('')}</div>`;
}
function statusPill(e) {
  const map = { REPORTED: 'plain', CHECKED_IN: 'ok', PICKED_UP: 'ok', VOIDED: 'void', NOT_CHECKED_IN: 'warn', NOT_PICKED_UP: 'warn' };

  ['today', 'upcoming'].forEach(k => { h[k] = (h[k] || []).filter(e => ids.indexOf(e.id) < 0); });
  (h.history || []).forEach(e => { if (ids.indexOf(e.id) >= 0) e.status = 'VOIDED'; });

}
function mergeCreated(res) {
  const h = S.home;
  if (!h || !res) return;
  const today = schoolNow().date;
  (res.created || []).forEach(e => {
    if (e.date === today) { if (!h.today.some(x => x.id === e.id)) h.today.push(e); }
    else if (e.date > today) { if (!h.upcoming.some(x => x.id === e.id)) h.upcoming.push(e); }
    if (!h.history.some(x => x.id === e.id)) h.history.unshift(e);
  });
  h.upcoming.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  if (res.created && res.created[0] && res.created[0].note) {
    const list = h.recent[res.created[0].type] || (h.recent[res.created[0].type] = []);
    const n = res.created[0].note;
    if (!list.some(x => x.toLowerCase() === n.toLowerCase())) { list.unshift(n); list.length = Math.min(list.length, 3); }
  }
  storeHome();
  if (!S.sheet || S.sheet.kind === 'flow') render();
}

/* ---------- The quick flow: tardy, early release, absent ---------- */
// Tardy and early release are sent at school, at the moment they happen. Absences can be sent from anywhere, for any day.
function startFlow(type) {
  const now = schoolNow();
  const eligible = type === 'EARLY' ? S.home.kids : guardianKids();
  if (!eligible.length) return;
  const end = mins(dismissalFor(now.date)) || 900;
  const date = type === 'ABSENT' && (isWeekend(now.date) || now.mins >= end) ? nextSchoolDay(now.date) : now.date;
  S.flow = {
    type, step: 'form', clientId: uid(),
    kids: type === 'TARDY' || eligible.length === 1 ? eligible.map(k => k.id) : [],
    date, dateMode: date === now.date ? 'today' : 'next', endDate: '',
    reasonKey: '', note: '', other: false, error: ''
  };
  if (needsGeo(type)) startGeo();
  openSheet({ kind: 'flow' });
}
ACT.flow = el => startFlow(el.dataset.t);

}

    <button type="button" class="btn sm soft" data-a="geo-retry" style="justify-self:start">${icon('refresh', 16)} ${T('tryAgain')}</button></div></div>`;
}
ACT['geo-retry'] = () => { startGeo(true); renderSheet(); };

function flowPayload(f) {
  const p = { type: f.type, studentIds: f.kids.slice(), reasonKey: f.reasonKey, note: f.reasonKey === 'other' ? f.note.trim() : undefined, clientId: f.clientId };
  if (f.type === 'ABSENT') { p.date = f.date; p.endDate = f.dateMode === 'range' ? f.endDate : undefined; }
  else if (S.geo && S.geo.fix) p.location = { lat: S.geo.fix.lat, lng: S.geo.fix.lng, acc: S.geo.fix.acc };
  return p;
}
function shake(sel) {
  const g = $(sel);
  if (g) { g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); g.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
async function sendFlow() {
  const f = S.flow;
  if (!f || f.busy || f.locating) return;
  const miss = flowMissing(f);
  if (miss) { f.error = miss; renderSheet(); shake(miss === 'pickKid' ? '#g-kids' : '#g-reason'); return; }
  if (needsGeo(f.type)) {
    // Usually the fix is already in: it started when the tile was tapped.
    if (!S.geo || S.geo.state === 'pending' || (S.geo.fix && Date.now() - S.geo.fix.at > 60000)) {
      f.locating = true; renderSheet();
      await startGeo(S.geo && S.geo.state !== 'pending');
      f.locating = false;
      if (S.flow !== f) return;
    }
    if (geoBlocked(f)) { renderSheet(); shake('#g-geo'); return; }
  }
  const payload = flowPayload(f);
  f.payload = payload; f.step = 'done'; f.status = 'saving'; f.busy = true; f.sentAt = schoolNow();
  renderSheet(); haptic(); startUndoCountdown(f);
  // Tardy and early release carry the moment they were sent, so they never wait in an outbox: retry briefly, then say so.
  const tries = f.type === 'ABSENT' ? 1 : 3;
  for (let i = 0; i < tries; i++) {
    try {
      const res = await api('entry.create', payload);
      f.busy = false; f.result = res; f.status = 'saved';
      mergeCreated(res);
      if (f.undoRequested) { undoFlow(); return; }
      if (S.flow === f) { renderSheet(); scheduleFlowClose(f); }
      return;
    } catch (e) {
      if (e.code === 'NETWORK' && i < tries - 1) { await new Promise(r => setTimeout(r, 1500 * (i + 1))); continue; }
      f.busy = false;
      if (e.code === 'NETWORK' && f.type === 'ABSENT') {
        outboxAdd({ payload, at: Date.now() }); f.status = 'queued';
        if (f.undoRequested) { undoFlow(); return; }
        if (S.flow === f) { renderSheet(); scheduleFlowClose(f); }
      } else if (e.code === 'SIGNED_OUT' || e.code === 'INACTIVE') {
        closeSheet(); signOutLocal(e.code === 'INACTIVE' ? t('err_INACTIVE') : t('signedOut'));
      } else {
        f.step = 'form'; f.error = ''; clearInterval(S.undoTimer);
        const geoCodes = { NEED_LOCATION: 'off', NOT_ON_CAMPUS: 'far', LOCATION_IMPRECISE: 'imprecise', NO_CAMPUS: 'nocampus' };
        if (geoCodes[e.code]) S.geo = Object.assign({}, S.geo || {}, { state: geoCodes[e.code] });
        if (S.flow === f) { renderSheet(); if (!geoCodes[e.code]) toast(e.code === 'NETWORK' ? t('noSignal') : errText(e), 'error'); }

}
function startUndoCountdown(f) {

    f.undoLeft--;

    if (f.undoLeft <= 0) {

}

}
async function undoFlow() {
  const f = S.flow;

  const ids = ((f.result && f.result.created) || []).map(e => e.id);
  if (!ids.length) { closeSheet(); if (S.kiosk) kioskSignOut(); return; }

    removeEntries(ids); closeSheet(); toast(t('undone'));

}

/* ---------- Offline outbox: entries sent with no signal go out later ---------- */
let flushTimer = null, flushDelay = 2000;
function outboxAdd(item) { S.outbox.push(item); store.set('outbox', S.outbox); scheduleFlush(flushDelay); }
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flushOutbox, ms); }
async function flushOutbox() {
  if (!S.outbox.length || !S.token) return;
  const item = S.outbox[0];
  try {
    const res = await api('entry.create', item.payload);
    S.outbox.shift(); store.set('outbox', S.outbox); flushDelay = 2000;
    mergeCreated(res); toast(t('sentLater'));
    if (S.flow && S.flow.clientId === item.payload.clientId) { S.flow.status = 'saved'; S.flow.result = res; renderSheet(); }
    if (S.outbox.length) scheduleFlush(300); else render();
  } catch (e) {
    if (e.code === 'NETWORK') { flushDelay = Math.min(flushDelay * 2, 30000); scheduleFlush(flushDelay); return; }
    S.outbox.shift(); store.set('outbox', S.outbox);
    toast(t('failed', { msg: errText(e) }), 'error'); render();
  }
}

function verPill(v) { return v ? `<span class="pill ok">${icon('shield', 13)}${T('verified')}</span>` : `<span class="pill warn">${T('notVerified')}</span>`; }
function FamilyView() {
  const h = S.home, guardian = guardianKids().length > 0 || !h.kids.length;
  const kids = h.kids.map(k => `<div class="entry">${avatar(k.first, k.last, 44)}<div class="grow">
      <div class="l1">${esc(k.first + ' ' + k.last)}</div>
      <div class="l2">${esc(gradeLabel(k.grade))}${k.teacher ? ' · ' + esc(k.teacher) : ''}</div>

      ${k.role === 'Guardian' ? `<button class="btn sm soft" data-a="kid-edit" data-id="${esc(k.id)}">${T('edit')}</button>` : ''}</div>`).join('');

ACT['inv-create'] = async () => {
  const f = S.forms.inv;
  f.error = '';

  if (!f.kids.length) { f.error = t('pickKid'); renderSheet(); return; }
  f.busy = true; renderSheet();
  try { f.result = await papi('invite.create', { name: f.name, relationship: f.relationship, role: f.role, studentIds: f.kids }); }
  catch (e) { f.error = errText(e); }

async function copyText(text, inputSel) {
  try { await navigator.clipboard.writeText(text); toast(t('copied')); return true; }
  catch (e) { const i = inputSel && $(inputSel); if (i) { i.focus(); i.select(); } return false; }
}
ACT['inv-copy'] = () => copyText(inviteUrl(S.forms.inv.result), '#inv-url');
ACT['inv-share'] = async () => {
  const f = S.forms.inv, url = inviteUrl(f.result);
  const text = t('inviteBody', { kids: listNames(guardianKids().filter(k => f.kids.indexOf(k.id) >= 0).map(k => k.first)), school: schoolShort(), role: t(f.role).toLowerCase() });
  try { if (navigator.share) { await navigator.share({ title: schoolShort() + ' Check-In', text, url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  copyText(url, '#inv-url');
};

/* ---------- School iPad (kiosk): big keypad, signs out after every use ---------- */
function appBaseUrl() {
  const u = S.cfg && S.cfg.school && S.cfg.school.appUrl;
  return (u || location.href).split('#')[0].split('?')[0];
}
let qrLoading = null;
function loadQr() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (!qrLoading) {
    qrLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
      s.onload = () => (window.qrcode ? resolve(window.qrcode) : reject(new Error('qr')));
      s.onerror = () => { qrLoading = null; reject(new Error('qr')); };
      document.head.appendChild(s);
    });
  }
  return qrLoading;
}
function qrSvg(text) {
  const q = window.qrcode(0, 'M');
  q.addData(text); q.make();
  return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}
function fillQr(root) {
  const els = $$('[data-qr]', root);
  if (!els.length) return;
  loadQr().then(() => els.forEach(el => { el.innerHTML = qrSvg(el.dataset.qr); })).catch(() => els.forEach(el => { el.innerHTML = `<code class="small" style="overflow-wrap:anywhere">${esc(el.dataset.qr)}</code>`; }));
}
function fmtPhone(d) {
  d = d.slice(0, 10);
  if (d.length <= 3) return d ? '(' + d : '';
  if (d.length <= 6) return '(' + d.slice(0, 3) + ') ' + d.slice(3);
  return '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6);
}
function keypad(action, extraLeft) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
  return `<div class="keypad" role="group">${keys.map(k => `<button class="key" data-a="${action}" data-v="${k}">${k}</button>`).join('')}
    ${extraLeft || '<span></span>'}<button class="key" data-a="${action}" data-v="0">0</button>
    <button class="key" data-a="${action}" data-v="back" aria-label="Delete">${icon('back', 28)}</button></div>`;
}
function kioskClock() {
  return new Intl.DateTimeFormat(locale(), { hour: 'numeric', minute: '2-digit', timeZone: schoolTz() }).format(new Date());
}
function KioskView() {
  const k = S.k, sc = S.cfg.school;
  if (k.step === 'home' && S.home) return KioskHome();

      <div data-press="kiosk-exit" title="Hold for staff">${logoTag()}</div>
      <p class="eyebrow">${esc(sc.name)}</p>
      <div class="kiosk-clock" id="kiosk-clock">${esc(kioskClock())}</div>
      <h1>${T('kioskHead')}</h1><p class="muted">${T('kioskSub')}</p>
      <button class="btn" style="min-height:72px;font-size:22px;padding:0 48px;border-radius:20px" data-a="k-start">${T('kioskStart')}</button>
      <div class="row" style="justify-content:center">${langBtn()}</div>
      <div class="row" style="gap:16px;max-width:560px;text-align:left;margin-top:12px"><div data-qr="${esc(appBaseUrl())}" style="width:112px;flex:none;background:#FFFFFF;border-radius:12px;padding:4px"></div><p class="small muted">${T('kioskOwn')}<br>${T('kioskNoAccount')}</p></div>

    pad = keypad('k-key');
  } else if (email) {
    display = `<form data-submit="k-email-next" class="stack-sm" style="max-width:520px;margin:0 auto;width:100%"><input class="input" id="k-email" type="email" inputmode="email" autocapitalize="off" autocomplete="off" data-f="kioskf.email" value="${esc((S.forms.kioskf || {}).email || '')}" placeholder="name@example.com"><button class="btn block">${T('next')}</button></form>`;
  } else {
    display = `<div class="pad-display" aria-live="polite">${esc(fmtPhone(k.phone)) || '<span class="muted">(___) ___-____</span>'}</div>`;
    pad = keypad('k-key', `<button class="key ghost" data-a="k-mode">${T('kioskEmail')}</button>`);
  }
  return `<main class="kiosk"><header class="topbar"><div class="wrap"><div class="brand" data-press="kiosk-exit">${logoTag()}<span class="brand-name">${esc(sc.short)}</span></div>${langBtn()}<button class="btn sm soft" data-a="k-cancel">${T('startOver')}</button></div></header>
    <div class="wrap stack" style="padding-block:28px 40px;justify-items:center;text-align:center">
      <h1>${isPin ? T('kioskPin') : email ? T('emailLabel') : T('kioskPhone')}</h1>
      ${display}
      ${k.error ? `<p class="error" role="alert">${esc(k.error)}</p>` : ''}
      ${k.busy ? '<div class="spin"></div>' : pad}
    </div></main>`;

ACT['k-start'] = () => { S.k = { step: 'id', mode: 'phone', phone: '', pin: '' }; render(); kioskIdleTimer(); };
ACT['k-mode'] = () => { S.k.mode = S.k.mode === 'email' ? 'phone' : 'email'; S.forms.kioskf = { email: '' }; render(); const e = $('#k-email'); if (e) e.focus(); };
ACT['k-cancel'] = () => kioskSignOut();
ACT['k-signout'] = () => kioskSignOut();
ACT['k-email-next'] = () => { const e = String((S.forms.kioskf || {}).email || '').trim(); if (!e) return; S.k.email = e; S.k.step = 'pin'; S.k.pin = ''; S.k.error = ''; render(); };
ACT['k-key'] = el => {
  const k = S.k, v = el.dataset.v;
  if (k.busy) return;
  k.error = '';
  haptic();
  if (k.step === 'id') {
    if (v === 'back') k.phone = k.phone.slice(0, -1);
    else if (k.phone.length < 10) k.phone += v;
    if (k.phone.length === 10) { k.step = 'pin'; k.pin = ''; }
    render(); return;
  }
  if (v === 'back') { if (!k.pin.length) { k.step = 'id'; } else k.pin = k.pin.slice(0, -1); render(); return; }
  if (k.pin.length < 6) k.pin += v;
  render();
  if (k.pin.length === 6) kioskLogin();
};
async function kioskLogin() {
  const k = S.k;
  k.busy = true; render();
  try {
    const d = await api('login', { id: k.mode === 'email' ? k.email : k.phone, pin: k.pin, remember: false, device: 'kiosk', token: undefined });
    S.token = d.token; S.home = d.home;
    S.k = { step: 'home' };
    if (d.home.me.lang && !store.get('langChosen', false)) S.lang = d.home.me.lang;
    render(); kioskIdleTimer();
    const only = guardianKids().length ? null : 'EARLY';
    if (only) startFlow(only);
  } catch (e) {
    k.busy = false; k.pin = ''; k.error = errText(e);
    if (e.code === 'BAD_LOGIN') k.step = 'id';
    render();
  }
}
function kioskSignOut() {
  clearTimeout(S.kioskTimer);
  const tok = S.token;
  if (tok) api('logout', { token: tok }).catch(() => {});
  S.token = null; S.home = null; S.k = { step: 'idle' }; S.forms = {};
  if (S.sheet) closeSheet();
  if (store.get('langChosen', false) === false) S.lang = store.get('lang', S.lang);
  render();
}

function boardFiltered() {

function laneSort(type) {

function boardInner() {
  const o = S.office;

function durText(m) { return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
function officeCard(e, isToday, now) {

  if (e.unverified) flags.push(`<button class="pill warn" data-a="o-openfam" data-id="${esc(e.studentId)}">${icon('shield', 13)}Unverified family</button>`);
  if (e.type === 'TARDY' && e.minutesLate != null) flags.push(`<span class="pill ${e.minutesLate > late ? 'danger' : 'TARDY'} num">${e.minutesLate} min late${e.minutesLate > late ? ' · over ' + late : ''}</span>`);
  let timeHtml = '';
  if (e.type === 'TARDY') timeHtml = `${enTime(e.time)}<small>arrived</small>`;
  if (e.type === 'EARLY') {
    timeHtml = `${enTime(e.time)}<small>here</small>`;
    if (isToday && e.status === 'REPORTED') {
      const wait = Math.max(0, now - mins(e.time));
      flags.push(`<span class="pill ${wait >= 15 ? 'danger' : wait >= 5 ? 'warn' : 'plain'} num">${wait < 1 ? 'Just arrived' : 'Waiting ' + durText(wait)}</span>`);
    }
    if (e.status === 'PICKED_UP') flags.push(`<span class="pill ok num">${icon('check', 13)}Left ${enStamp(e.statusAt)}</span>`);
  }

  </article>`;
}

/* Copy the day in the Office View sheet's column order */
function viewRowFor(e) {
  const reason = enReason(e);
  const rel = e.source === 'Office' ? '' : e.relationship;
  const reporter = e.reporter + (rel ? ' (' + rel + ')' : '');
  const md = d => { const p = d.split('-'); return +p[1] + '/' + +p[2] + '/' + p[0]; };
  const sub = enStamp(e.createdAt);
  const left = e.type === 'EARLY' && e.status === 'PICKED_UP' && e.statusAt ? enStamp(e.statusAt) : '';
  const time = e.type === 'TARDY' ? enTime(e.time) : e.type === 'EARLY' ? (left || enTime(e.time)) : '';
  let comment;
  if (e.type === 'EARLY') comment = `${reason} – signed out ${enTime(e.time)} by ${reporter}${left ? ' – left ' + left : ''}`;
  else if (e.type === 'ABSENT') comment = `${reason} – reported by ${reporter} on ${md(String(e.createdAt).slice(0, 10)).replace(/\/\d{4}$/, '')} ${sub}`;
  else comment = `${reason} – arrived ${enTime(e.time)}${e.minutesLate != null ? ', ' + e.minutesLate + ' min late' : ''} – reported by ${reporter}`;
  return [md(e.date), e.student, e.grade, e.teacher, TYPE_NAME[e.type], time, reason, comment, e.reporter, e.relationship, md(String(e.createdAt).slice(0, 10)) + ' ' + sub, STATUS_NAME[e.status], e.unverified ? 'Not yet' : 'Yes', e.location || '', e.id];
}
ACT['o-copy'] = async () => {
  const o = S.office;
  if (!o.board) return;
  const order = { TARDY: 0, EARLY: 1, ABSENT: 2 };
  const rows = o.board.entries.filter(e => e.status !== 'VOIDED').sort((a, b) => (order[a.type] - order[b.type]) || String(a.time).localeCompare(String(b.time)) || a.student.localeCompare(b.student));
  const head = ['Date', 'Student', 'Grade', 'Teacher', 'Type', 'Time', 'Reason', 'Comment', 'Reported by', 'Relationship', 'Submitted', 'Status', 'Verified', 'Location', 'Entry ID'];
  const tsv = [head].concat(rows.map(viewRowFor)).map(r => r.map(v => String(v == null ? '' : v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
  try { await navigator.clipboard.writeText(tsv); toast(`Copied ${rows.length} row${rows.length === 1 ? '' : 's'}. Paste into any sheet.`); }
  catch (e) { openSheet({ kind: 'o-copytext', text: tsv }); }
};

/* Change log */
function LogView() {
  const o = S.office, l = o.log || (o.log = { q: '', rows: null });
  if (!l.rows && !l.loading) logSearch(true);
  return `<div class="o-bar"><input class="input grow" id="log-q" type="search" placeholder="Search who, what or an ID" value="${esc(l.q)}" data-logq="1" autocomplete="off" style="max-width:520px"><span class="tiny muted">Every change is recorded with who made it, when, and the values before and after.</span></div>
    <div id="log-table">${logTableHtml()}</div>`;
}
function logTableHtml() {
  const l = S.office.log;
  if (!l.rows) return '<div class="splash" style="min-height:200px"><div class="spin"></div></div>';
  if (!l.rows.length) return '<p class="empty">Nothing found.</p>';
  const pretty = s => { try { return JSON.stringify(JSON.parse(s), null, 1); } catch (e) { return s; } };
  return `<div class="table-wrap"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Item</th><th>Details</th></tr></thead><tbody>${l.rows.map(r => `<tr>
    <td class="nowrap num">${esc(enDate(String(r.when).slice(0, 10)))}<br><span class="tiny muted">${esc(enStamp(r.when))}</span></td><td>${esc(r.actor)}<br><span class="tiny muted">${esc(r.actorType)}</span></td>
    <td>${esc(r.action)}${r.note ? `<br><span class="tiny muted">${esc(r.note)}</span>` : ''}</td><td class="tiny">${esc(r.entity)}<br><span class="muted">${esc(r.id)}</span></td>
    <td>${r.before || r.after ? `<details class="diff"><summary>Before and after</summary>${r.before ? `<pre>Before: ${esc(pretty(r.before))}</pre>` : ''}${r.after ? `<pre>After: ${esc(pretty(r.after))}</pre>` : ''}</details>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
let logTimer = null;
function logSearch(now) {
  const l = S.office.log;
  clearTimeout(logTimer);
  logTimer = setTimeout(async () => {
    l.loading = true;
    try { const d = await oapi('office.log', { q: l.q }); l.rows = d.rows; } catch (e) { l.rows = []; toast(e.message, 'error'); }
    l.loading = false;
    const box = $('#log-table'); if (box) box.innerHTML = logTableHtml();
  }, now ? 0 : 300);
}

ACT['adm-here'] = el => {
  const a = S.office.admin;
  if (!navigator.geolocation) { a.here = { error: 'This browser cannot share its location.' }; renderOfficeMain(); return; }
  el.disabled = true;
  navigator.geolocation.getCurrentPosition(p => {
    const fix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0) };
    a.here = fix;
    if (fix.acc <= 100) { a.settings.SchoolLat = fix.lat.toFixed(6); a.settings.SchoolLng = fix.lng.toFixed(6); toast('Location filled in. Save to keep it.'); }
    else toast(`That reading is only accurate to ${fmtDist(fix.acc)}. Step outside and try again.`, 'error');
    renderOfficeMain();
  }, err => { a.here = { error: err && err.code === 1 ? 'Location is blocked for this site. Allow it in the browser settings and try again.' : 'Could not get a location. Try again outside.' }; renderOfficeMain(); },
  { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
};

/* Logo upload: shrink to 256 px, keep transparency, pick the main color */
function logoAccent(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data, buckets = {};
  for (let i = 0; i < d.length; i += 8) {
    if (d[i + 3] < 160) continue;
    const r = d[i], g = d[i + 1], b = d[i + 2], hsl = rgbToHsl(r, g, b);
    if (hsl[1] < .25 || hsl[2] < .1 || hsl[2] > .9) continue;
    const k = Math.round(hsl[0] / 15) % 24, bk = buckets[k] || (buckets[k] = { n: 0, r: 0, g: 0, b: 0 }), wt = hsl[1];
    bk.n += wt; bk.r += r * wt; bk.g += g * wt; bk.b += b * wt;
  }
  let best = null;
  Object.keys(buckets).forEach(k => { if (!best || buckets[k].n > best.n) best = buckets[k]; });
  return best ? rgbToHex(best.r / best.n, best.g / best.n, best.b / best.n) : null;
}
ACT['adm-logo-file'] = el => {
  const file = el.files && el.files[0], a = S.office.admin;
  if (!file) return;
  a.logoError = '';
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      let size = 256, out = '';
      for (let attempt = 0; attempt < 4; attempt++) {
        const scale = Math.min(1, size / Math.max(img.naturalWidth || size, img.naturalHeight || size));
        const w = Math.max(1, Math.round((img.naturalWidth || size) * scale)), h = Math.max(1, Math.round((img.naturalHeight || size) * scale));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
        out = c.toDataURL('image/png');
        if (attempt === 0) a.logoAccentAuto = logoAccent(ctx, w, h);
        if (out.length < 140000) break;
        size = Math.round(size * .75);
      }
      a.logoDraft = { dataUrl: out, accent: a.logoAccentAuto || a.settings.AccentColor || '#2456C5' };
      renderOfficeMain();
    };
    img.onerror = () => { a.logoError = 'That file could not be read as an image.'; renderOfficeMain(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
};
ACT['adm-save-logo'] = async () => {
  const a = S.office.admin;

};

/* QR signs */
ACT['adm-qr'] = () => openSheet({ kind: 'qr' });
SHEETS.qr = () => {
  const base = appBaseUrl();
  const sign = (title, sub, url) => `<div class="qr-card">${logoTag()}<div class="big">${esc(title)}</div><div class="muted">${esc(sub)}</div><div data-qr="${esc(url)}" style="width:100%;display:grid;place-items:center;min-height:200px"><div class="spin"></div></div><div class="tiny muted" style="overflow-wrap:anywhere">${esc(url)}</div></div>`;
  return {
    title: 'QR signs',
    body: `<p class="small muted">Print these for the drop-off curb and the front office. Scanning opens the app straight to the right step and checks that the parent is on campus; parents who are signed in on their phone are two taps from done.</p>
      <div class="qr-sheet print-area">${sign('Here after the bell?', 'Scan to report a tardy · Escanee para avisar llegada tarde', base + '#go-tardy')}${sign('Picking up early?', 'Scan when you arrive · Escanee al llegar', base + '#go-early')}${sign('New family?', 'Scan to create your profile · Escanee para crear su perfil', base + '#signup')}</div>`,
    foot: PREVIEW ? '' : `<button class="btn block no-print" data-a="print">Print signs</button>`,

  };

ACT.print = () => { try { window.print(); } catch (e) { /* not allowed here */ } };

/* ---------- Rendering, events and start-up ---------- */
/* The first screen when the app can't load its settings: says which part of the setup to fix. */
function setupNeeded(e) {
  const code = e && e.code;
  const url = String(CONFIG.API_URL || '');
  const shown = url.length > 64 ? url.slice(0, 44) + '…' + url.slice(-14) : url;
  let title, lead = '', steps;
  if (code === 'NO_API') {
    title = 'Connect this app to its Google Sheet';
    steps = ['Open index.html in a text editor and search for <b>API_URL</b>.', 'Paste the web app URL from Apps Script (Deploy, then Manage deployments; it ends in /exec) between the quotes.', 'Save and upload the file again.'];
  } else if (code === 'NOT_SET_UP') {
    title = 'One step left: run setup';
    lead = 'The web app answered, but its System sheet is not set up yet.';
    steps = ['In the Apps Script editor, pick <b>setup</b> in the toolbar and click Run. The staff PINs appear in the Execution log.', 'Then tap Try again.'];
  } else if (code === 'NETWORK') {
    title = T('err_NETWORK');
    lead = 'If the connection is fine, the web app link needs a look:';
    steps = [`This app calls <code style="overflow-wrap:anywhere">${esc(shown)}</code>. It should end in /exec.`, 'In Apps Script, Deploy, then Manage deployments, must show <b>Who has access: Anyone</b>.', 'After pasting or changing the code, edit the deployment and pick Version: New version. Opening the link in a private window should show "ok": true.'];
  } else {
    title = 'The web app answered with an error';
    steps = [esc((e && e.message) || 'Unknown error')];
  }
  return `<main class="wrap main stack"><div class="hero"><span class="mono">!</span><h1>${title}</h1></div>${lead ? `<p class="muted">${lead}</p>` : ''}
    <ol class="note" style="display:grid;gap:8px;padding-left:34px;margin:0">${steps.map(x => `<li>${x}</li>`).join('')}</ol>
    ${code === 'NO_API' ? '' : `<button class="btn block" data-a="retry">${icon('refresh', 20)} ${T('tryAgain')}</button>`}</main>`;
}
ACT.retry = () => { $('#app').innerHTML = '<div class="splash"><div class="spin"></div></div>'; loadConfig(); };
ACT['close-sheet'] = () => closeSheet();

function render() {
  applyBrand();
  const app = $('#app');
  if (!S.cfg) { app.innerHTML = '<div class="splash"><div class="spin" role="status" aria-label="Loading"></div></div>'; return; }
  let html;
  if (S.route === 'office') html = OfficeView();
  else if (S.kiosk) html = KioskView();
  else if (S.route === 'invite' && S.pendingInvite) html = InviteView();
  else if (!S.token) html = S.route === 'signup' ? SignupView() : S.route === 'forgot' ? ForgotView() : WelcomeView();
  else if (!S.home) { html = '<div class="splash"><div class="spin"></div></div>'; refreshHome(true); }
  else html = S.route === 'history' ? HistoryView() : S.route === 'family' ? FamilyView() : S.route === 'account' ? AccountView() : HomeView();
  app.innerHTML = html;
  afterRender();
}
function afterRender() {
  const app = $('#app');
  fillQr(app);
  const tb = $('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4);
  if (S.route === 'office') afterOffice();
  if (S.deepGo && S.token && S.home && !S.sheet && !S.kiosk && S.route === 'home') {
    const tp = S.deepGo; S.deepGo = null;
    if (tp === 'EARLY' ? S.home.kids.length : guardianKids().length) startFlow(tp);
  }
}
function afterOffice() {
  if (S.staffToken && S.office.tab === 'today' && !S.office.board) loadBoard(true);
  updateLive();
}
const _updateBoard = updateBoard;
updateBoard = function () {
  const a = document.activeElement, card = a && a.closest ? a.closest('[data-card]') : null, id = card && card.dataset.card;
  _updateBoard();
  if (id) { const c = $(`[data-card="${CSS.escape(id)}"]`); if (c) c.focus({ preventScroll: true }); }
};

function setPath(root, path, v) {
  const p = path.split('.');
  let o = root;
  for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null) o[p[i]] = {}; o = o[p[i]]; }
  o[p[p.length - 1]] = v;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  if (el.dataset.a === 'scrim') { if (e.target === el && S.sheet && !S._noClose) closeSheet(); return; }
  if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = ACT[el.dataset.a];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.f) { setPath(S.forms, d.f, el.type === 'checkbox' ? el.checked : el.value); return; }
  if (d.ff && S.flow) { S.flow[d.ff] = el.value; S.flow.error = ''; if (d.ff === 'date' && S.flow.endDate && S.flow.endDate < el.value) S.flow.endDate = el.value; return; }
  if (d.sf && S.sheet) { S.sheet[d.sf] = el.value; return; }
  if (d.oq) { S.office.q = el.value; updateBoard(); return; }
  if (d.famq) { S.office.fam.q = el.value; famSearch(); return; }
  if (d.logq) { S.office.log.q = el.value; logSearch(); return; }
  if (d.oadd && S.forms.oadd) { S.forms.oadd[d.oadd] = el.value; if (d.oadd === 'q') oaddSearch(); return; }
  const a = S.office.admin;
  if (!a) return;
  if (d.adm) {
    a.settings[d.adm] = el.value;
    // Pasting "33.13167, -117.20222" (or a Google Maps link) into either box fills both.
    const m = d.latlng && /(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/.exec(el.value);
    if (m) { a.settings.SchoolLat = m[1]; a.settings.SchoolLng = m[2]; renderOfficeMain(); }
  }
  else if (d.admT) a.teachers[+d.admT].name = el.value;
  else if (d.admR) a.reasons[+d.admR][d.k] = el.value;
  else if (d.admS) a.staff[+d.admS][d.k] = el.value;
  else if (d.admNew) a.newStaff[d.admNew] = el.value;
  else if (d.admAccent) { if (a.logoDraft) a.logoDraft.accent = el.value; else { a.settings.AccentColor = el.value; a.accentChanged = true; } const sw = $('.swatch'); if (sw) sw.style.background = el.value; }
  else if (d.admYear) { a.yearConfirm = el.value; const b = $('[data-a="adm-year-run"]'); if (b) b.disabled = !a.yearPreview || el.value !== a.yearPreview.to; }
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.aChange) { const fn = ACT[d.aChange]; if (fn) fn(el, e); return; }
  if (d.f && el.type === 'checkbox') { setPath(S.forms, d.f, el.checked); return; }
  if (d.ff && (el.type === 'date' || el.type === 'time')) { renderSheet(); return; }
  if (d.admAccent) renderOfficeMain();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]');
  if (!f) return;
  e.preventDefault();
  const fn = ACT[f.dataset.submit];
  if (fn) fn(f, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet && !S._noClose) { closeSheet(); return; }
  if (e.key === 'Enter' && e.target.id === 'f-note') { e.preventDefault(); sendFlow(); return; }
  if (e.key === 'Enter' && e.target.id === 'oadd-q') { e.preventDefault(); return; }
  if (S.route !== 'office' || !S.staffToken || S.office.tab !== 'today' || S.sheet) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (typing) {
    if (e.key === 'Escape') e.target.blur();
    if (e.key === 'ArrowDown' && e.target.id === 'o-q') { const c = $('[data-card]'); if (c) { e.preventDefault(); c.focus(); } }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); const q = $('#o-q'); if (q) q.focus(); return; }
  if (e.key === 'r' || e.key === 'R') { S.office.etag = null; loadBoard(true); toast('Refreshed'); return; }
  const card = e.target.closest && e.target.closest('[data-card]');
  if (!card) return;
  const k = e.key.toLowerCase();
  if (k === 'c') { const b = $('[data-s="CHECKED_IN"]', card); if (b) b.click(); }
  else if (k === 'p') { const b = $('[data-s="PICKED_UP"]', card); if (b) b.click(); }
  else if (e.key === 'Enter') { const b = $('[data-a="o-entry"]', card); if (b) b.click(); }
  else if (/^Arrow/.test(e.key)) {
    e.preventDefault();
    const lane = card.closest('.lane'), lanes = $$('.lane').filter(l => l.offsetParent);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const cards = $$('[data-card]', lane), i = cards.indexOf(card), n = cards[i + (e.key === 'ArrowDown' ? 1 : -1)];
      if (n) n.focus();
    } else {
      const nl = lanes[lanes.indexOf(lane) + (e.key === 'ArrowRight' ? 1 : -1)];
      const c = nl && $('[data-card]', nl); if (c) c.focus();
    }
  }
});
let pressTimer = null;
document.addEventListener('pointerdown', e => {
  if (S.kiosk) kioskIdleTimer();
  const el = e.target.closest && e.target.closest('[data-press]');
  if (!el) return;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(() => { pressTimer = null; if (el.dataset.press === 'kiosk-exit') openSheet({ kind: 'kioskExit', pin: '' }); }, 3000);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(pressTimer); pressTimer = null; }, true));
document.addEventListener('keydown', () => { if (S.kiosk) kioskIdleTimer(); }, true);
window.addEventListener('scroll', () => { const tb = $('.topbar'); if (tb) tb.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
window.addEventListener('hashchange', () => {
  if (S.sheet) closeSheet();
  const prev = S.route;
  S.route = routeFromHash();
  if (S.route === 'history' && prev !== 'history') S.hist = null;
  render(); window.scrollTo(0, 0);
});
window.addEventListener('online', () => scheduleFlush(300));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.token && !S.kiosk && S.route !== 'office') refreshHome(true);
  // Back from turning location on in Settings: check again without making them tap.
  if (S.sheet && S.sheet.kind === 'flow' && S.flow && S.flow.step === 'form' && needsGeo(S.flow.type) && S.geo && S.geo.state !== 'ok' && S.geo.state !== 'pending') startGeo(true);
  pollOffice();
});
setInterval(pollOffice, 15000);
setInterval(() => {
  tickKioskClock();
  if (S.route === 'office' && S.office.tab === 'today' && S.office.board && !S.sheet) { updateBoard(); updateLive(); }
}, 30000);

async function loadConfig() {
  try {
    const c = await api('config', { token: undefined });
    S.cfg = c; store.set('cfg', c);
    const v = c.school.logoVersion;
    if (!v || v === '0') { if (S.logo) { S.logo = null; store.del('logo'); } }
    else if (!S.logo || S.logo.version !== v) {
      try { const l = await api('logo', { token: undefined }); S.logo = { version: l.version, dataUrl: l.dataUrl }; store.set('logo', S.logo); } catch (e) { /* keep the old one */ }
    }
    if (!isTyping() && !S.sheet) render(); else applyBrand();
    if (S.token && !S.kiosk) refreshHome(true);
  } catch (e) {
    if (!S.cfg) $('#app').innerHTML = setupNeeded(e);
  }
}
function boot() {
  S.route = routeFromHash();
  const inv = qs.get('invite');
  if (inv) { S.pendingInvite = inv.toUpperCase(); S.route = 'invite'; }
  const g = qs.get('go');
  if (g && /^(tardy|early|absent)$/i.test(g)) S.deepGo = g.toUpperCase();
  if (qs.has('office') || S.pendingKiosk) S.route = 'office';
  if (S.kiosk) { S.token = null; S.home = null; }
  render();
  loadConfig();
  if (S.pendingKiosk && S.staffToken) ACT['o-kiosk']();
  if (S.outbox.length) scheduleFlush(1500);
}
boot();

})();
